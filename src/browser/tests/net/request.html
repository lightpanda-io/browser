<script id=basic>
{
  const req = new Request('https://example.com/api');
  testing.expectEqual('https://example.com/api', req.url);
  testing.expectEqual('GET', req.method);
}

{
  const req = new Request('https://example.com/api', { method: 'POST' });
  testing.expectEqual('https://example.com/api', req.url);
  testing.expectEqual('POST', req.method);
}

{
  const req = new Request('https://example.com/api', { method: 'post' });
  testing.expectEqual('POST', req.method);
}

{
  const req = new Request('/path');
  testing.expectEqual(true, req.url.includes('/path'));
}

  const req = new Request('https://example.com/api/hello world');
  testing.expectEqual('https://example.com/api/hello%20world', req.url);
</script>

<script id=headers>
{
  const req = new Request('https://example.com/api');
  const headers = req.headers;
  testing.expectEqual('object', typeof headers);

  headers.set('Content-Type', 'application/json');
  testing.expectEqual('application/json', headers.get('Content-Type'));

  const headers2 = req.headers;
  testing.expectEqual(true, headers === headers2);
  testing.expectEqual('application/json', headers2.get('Content-Type'));
}

{
  const headers = new Headers();
  headers.set('X-Custom', 'value');

  const req = new Request('https://example.com/api', { headers });
  testing.expectEqual('value', req.headers.get('X-Custom'));
}

{
  const req = new Request('https://example.com/api', {headers: {over: '9000!'}});
  testing.expectEqual('9000!', req.headers.get('over'));
}
</script>

<script id=request_input>

<script id=body_methods type=module>
  const state = await testing.async();

  const req1 = new Request('https://example.com/api', {
    method: 'POST',
    body: 'Hello, World!',
    headers: { 'Content-Type': 'text/plain' }
  });
  const text1 = await req1.text();

  const req2 = new Request('https://example.com/api', {
    method: 'POST',
    body: '{"name": "test"}',
    headers: { 'Content-Type': 'application/json' }
  });
  const json2 = await req2.json();

  const req3 = new Request('https://example.com/api', {
    method: 'POST',
    body: 'binary data',
    headers: { 'Content-Type': 'application/octet-stream' }
  });
  const buffer3 = await req3.arrayBuffer();

  const req4 = new Request('https://example.com/api', {
    method: 'POST',
    body: 'blob content',
    headers: { 'Content-Type': 'text/plain' }
  });
  const blob4 = await req4.blob();

  const req5 = new Request('https://example.com/api', {
    method: 'POST',
    body: 'bytes'
  });
  const bytes5 = await req5.bytes();

  state.resolve();
  await state.done(() => {
    testing.expectEqual('Hello, World!', text1);

    testing.expectEqual('test', json2.name);

    testing.expectEqual(true, buffer3 instanceof ArrayBuffer);
    testing.expectEqual(11, buffer3.byteLength);

    testing.expectEqual(true, blob4 instanceof Blob);
    testing.expectEqual(12, blob4.size);
    testing.expectEqual('text/plain', blob4.type);

    testing.expectEqual(true, bytes5 instanceof Uint8Array);
    testing.expectEqual(5, bytes5.length);
  });
</script>

<script id=clone>
  {
    const req1 = new Request('https://example.com/api', {
      method: 'POST',
      body: 'test body',
      headers: { 'X-Custom': 'value' }
    });

    const req2 = req1.clone();

    testing.expectEqual(req1.url, req2.url);
    testing.expectEqual(req1.method, req2.method);
    testing.expectEqual('value', req2.headers.get('X-Custom'));

    // Each copy owns its headers.
    req2.headers.set('X-Custom', 'changed');
    req2.headers.append('X-Other', 'other');
    testing.expectEqual('value', req1.headers.get('X-Custom'));
    testing.expectEqual(null, req1.headers.get('X-Other'));
  }

  {
    const req1 = new Request('https://example.com/api', { mode: 'no-cors' });
    const req2 = req1.clone();
    testing.expectEqual('no-cors', req2.mode);
    // The no-cors guard carries over: non-safelisted headers are dropped.
    req2.headers.set('X-Custom', 'value');
    testing.expectEqual(null, req2.headers.get('X-Custom'));
  }
</script>

<script id=request_input_inherits>
  {
    const req1 = new Request('https://example.com/api', {
      mode: 'same-origin',
      cache: 'no-store',
      credentials: 'omit',
      redirect: 'manual',
    });

    for (const req2 of [new Request(req1), new Request(req1, {}), new Request(req1, { method: 'POST' })]) {
      testing.expectEqual('same-origin', req2.mode);
      testing.expectEqual('no-store', req2.cache);
      testing.expectEqual('omit', req2.credentials);
      testing.expectEqual('manual', req2.redirect);
    }

    const req3 = new Request(req1, { mode: 'cors', cache: 'reload', credentials: 'include', redirect: 'error' });
    testing.expectEqual('cors', req3.mode);
    testing.expectEqual('reload', req3.cache);
    testing.expectEqual('include', req3.credentials);
    testing.expectEqual('error', req3.redirect);
  }

  {
    const req = new Request('https://example.com/api');
    testing.expectEqual('cors', req.mode);
    testing.expectEqual('default', req.cache);
    testing.expectEqual('same-origin', req.credentials);
    testing.expectEqual('follow', req.redirect);
  }

  testing.expectError('TypeError', () => new Request('https://example.com/api', { mode: 'navigate' }));
</script>

<script id=body_used type=module>
  const state = await testing.async();

  const req1 = new Request('https://example.com', { method: 'POST', body: 'hi' });
  const usedBefore1 = req1.bodyUsed;
  await req1.text();
  const usedAfter1 = req1.bodyUsed;

  // Re-consuming a used body rejects.
  let rejected1 = false;
  try { await req1.text(); } catch (e) { rejected1 = true; }

  // A request with no body is never "used".
  const req2 = new Request('https://example.com');
  const usedBefore2 = req2.bodyUsed;
  await req2.text();
  const usedAfter2 = req2.bodyUsed;

  // text() decodes as UTF-8, stripping a leading BOM.
  const req3 = new Request('https://example.com', { method: 'POST', body: '﻿hi' });
  const text3 = await req3.text();

  state.resolve();
  await state.done(() => {
    testing.expectFalse(usedBefore1);
    testing.expectTrue(usedAfter1);
    testing.expectTrue(rejected1);

    testing.expectFalse(usedBefore2);
    testing.expectFalse(usedAfter2);

    testing.expectEqual('hi', text3);
  });
</script>

<script id=stream_body type=module>
  const state = await testing.async();
  const enc = new TextEncoder();

  // ky's request-streams probe: an open stream body constructs fine, and
  // since `duplex` is never read, it concludes uploads can't stream.
  let duplexRead = false;
  const probe = new Request('https://empty.invalid', {
    body: new ReadableStream(),
    method: 'POST',
    get duplex() { duplexRead = true; return 'half'; },
  });
  const probeHasContentType = probe.headers.has('Content-Type');

  // Drained on first use, so a body enqueued after construction is read.
  let controller;
  const req1 = new Request('https://example.com', {
    method: 'POST',
    body: new ReadableStream({ start(c) { controller = c; } }),
  });
  const usedBefore1 = req1.bodyUsed;
  controller.enqueue(enc.encode('late'));
  controller.close();
  const text1 = await req1.text();
  const usedAfter1 = req1.bodyUsed;

  // Still open at first use: TypeError.
  const req2 = new Request('https://example.com', { method: 'POST', body: new ReadableStream() });
  let rejected2 = false;
  try { await req2.text(); } catch (e) { rejected2 = e instanceof TypeError; }

  // A Request built from one with a stream body carries it.
  const req3 = new Request(new Request('https://example.com', {
    method: 'POST',
    body: new ReadableStream({ start(c) { c.enqueue(enc.encode('carried')); c.close(); } }),
  }));
  const text3 = await req3.text();

  // clone() drains, so both copies read the body.
  const req4 = new Request('https://example.com', {
    method: 'POST',
    body: new ReadableStream({ start(c) { c.enqueue(enc.encode('twice')); c.close(); } }),
  });
  const req4b = req4.clone();
  const text4 = await req4.text();
  const text4b = await req4b.text();

  state.resolve();
  await state.done(() => {
    testing.expectFalse(duplexRead);
    testing.expectFalse(probeHasContentType);
    testing.expectFalse(usedBefore1);
    testing.expectEqual('late', text1);
    testing.expectTrue(usedAfter1);
    testing.expectTrue(rejected2);
    testing.expectEqual('carried', text3);
    testing.expectEqual('twice', text4);
    testing.expectEqual('twice', text4b);
  });
</script>

<script id=buffer_source_bodies type=module>
  const state = await testing.async();

  // Every ArrayBufferView is a BufferSource, viewed as its raw bytes.
  const int8 = await new Request('https://example.com', { method: 'POST', body: new Int8Array([-1, 2]) }).bytes();
  const float32 = await new Request('https://example.com', { method: 'POST', body: new Float32Array([1]) }).bytes();
  const buf = new ArrayBuffer(4);
  new DataView(buf).setUint32(0, 0x41424344);
  const view = await new Request('https://example.com', { method: 'POST', body: new DataView(buf, 1, 2) }).text();

  // body is read before method, whose getter detaches it: the body is then
  // empty, rather than a copy of the freed backing store.
  const body = new Uint8Array([1, 2, 3]);
  const detached = await new Request('https://example.com', { body, get method() { body.buffer.transfer(0); return 'POST'; } }).bytes();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(2, int8.length);
    testing.expectEqual(255, int8[0]);
    testing.expectEqual(2, int8[1]);
    testing.expectEqual(4, float32.length);
    testing.expectEqual('BC', view);
    testing.expectEqual(0, detached.length);
  });
</script>

<script id=form_data type=module>
  const state = await testing.async();

  // An urlencoded body parses into a FormData.
  const req1 = new Request('https://example.com', {
    method: 'POST',
    body: 'a=1&b=hello+world&c=%26%3D&no_value',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
  });
  const fd1 = await req1.formData();

  // A FormData body round-trips through the multipart encoding.
  const src = new FormData();
  src.append('username', 'alice');
  src.append('note', 'two\r\nlines');
  src.append('a\tb', 'tabbed');
  src.append('username', 'bob');
  const req2 = new Request('https://example.com', { method: 'POST', body: src });
  const fd2 = await req2.formData();

  // A URLSearchParams body parses back (urlencoded default Content-Type).
  const req3 = new Request('https://example.com', {
    method: 'POST',
    body: new URLSearchParams({ x: 'y z' }),
  });
  const fd3 = await req3.formData();

  // A non-form Content-Type rejects with a TypeError.
  let rejected4 = false;
  const req4 = new Request('https://example.com', { method: 'POST', body: 'plain' });
  try { await req4.formData(); } catch (e) { rejected4 = e instanceof TypeError; }

  // So does re-consuming an already-used body.
  let rejected5 = false;
  try { await req1.formData(); } catch (e) { rejected5 = e instanceof TypeError; }

  // A missing Content-Type rejects (never throws synchronously) with a
  // TypeError.
  let rejected6 = false;
  const p6 = new Request('https://example.com', { method: 'POST' }).formData();
  const promised6 = p6 instanceof Promise;
  try { await p6; } catch (e) { rejected6 = e instanceof TypeError; }

  // A null body with a form Content-Type acts as an empty byte sequence and
  // resolves with an empty FormData.
  const req7 = new Request('https://example.com', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
  });
  const fd7 = await req7.formData();

  // A multipart Content-Type without a boundary rejects with a TypeError.
  let rejected8 = false;
  const req8 = new Request('https://example.com', {
    method: 'POST',
    body: 'x',
    headers: { 'Content-Type': 'multipart/form-data' },
  });
  try { await req8.formData(); } catch (e) { rejected8 = e instanceof TypeError; }

  // A part with an unquoted RFC 5987 filename* parameter parses; the
  // parameter itself is skipped.
  const req9 = new Request('https://example.com', {
    method: 'POST',
    body: '--B\r\nContent-Disposition: form-data; filename*=UTF-8\'\'a.jpg; name="n"\r\n\r\nv\r\n--B--\r\n',
    headers: { 'Content-Type': 'multipart/form-data; boundary=B' },
  });
  const fd9 = await req9.formData();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, fd1 instanceof FormData);
    testing.expectEqual('1', fd1.get('a'));
    testing.expectEqual('hello world', fd1.get('b'));
    testing.expectEqual('&=', fd1.get('c'));
    testing.expectEqual('', fd1.get('no_value'));

    testing.expectEqual(true, fd2 instanceof FormData);
    testing.expectEqual(2, fd2.getAll('username').length);
    testing.expectEqual('alice', fd2.getAll('username')[0]);
    testing.expectEqual('bob', fd2.getAll('username')[1]);
    testing.expectEqual('two\r\nlines', fd2.get('note'));
    testing.expectEqual('tabbed', fd2.get('a\tb'));

    testing.expectEqual('y z', fd3.get('x'));

    testing.expectEqual(true, rejected4);
    testing.expectEqual(true, rejected5);

    testing.expectEqual(true, promised6);
    testing.expectEqual(true, rejected6);
    testing.expectEqual(true, fd7 instanceof FormData);
    testing.expectEqual(0, [...fd7].length);
    testing.expectEqual(true, rejected8);
    testing.expectEqual('v', fd9.get('n'));
  });
</script>

<script id=body type=module>
  const state = await testing.async();

  // No body: `body` is null, and getting it twice stays null.
  const req1 = new Request('https://example.com');
  const body1a = req1.body;
  const body1b = req1.body;

  // A body yields a ReadableStream, stable across repeated reads.
  const req2 = new Request('https://example.com', { method: 'POST', body: 'hello world' });
  const body2a = req2.body;
  const body2b = req2.body;
  const sameStream2 = body2a === body2b;
  const lockedBefore2 = body2a.locked;
  const text2 = await req2.text();
  const lockedAfter2 = body2a.locked;

  // Locking the stream directly is reflected in bodyUsed.
  const req3 = new Request('https://example.com', { method: 'POST', body: 'hello' });
  const usedBefore3 = req3.bodyUsed;
  req3.body.getReader();
  const usedAfterLock3 = req3.bodyUsed;

  // An empty body is a closed (not null) stream.
  const req4 = new Request('https://example.com', { method: 'POST', body: '' });
  const body4 = req4.body;

  state.resolve();
  await state.done(() => {
    testing.expectEqual(null, body1a);
    testing.expectEqual(null, body1b);

    testing.expectTrue(body2a instanceof ReadableStream);
    testing.expectTrue(sameStream2);
    testing.expectFalse(lockedBefore2);
    testing.expectEqual('hello world', text2);
    testing.expectTrue(lockedAfter2);

    testing.expectFalse(usedBefore3);
    testing.expectFalse(usedAfterLock3);

    testing.expectTrue(body4 instanceof ReadableStream);
  });
</script>

<script id=text_stream type=module>
  const state = await testing.async();

  async function readAllChunks(stream) {
    const reader = stream.getReader();
    const chunks = [];
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
    }
    return chunks;
  }

  const existsOnPrototype = 'textStream' in Request.prototype;
  const isFunction = typeof Request.prototype.textStream === 'function';

  const req1 = new Request('https://example.com', { method: 'POST', body: 'hello world' });
  const usedBefore1 = req1.bodyUsed;
  const stream1 = req1.textStream();
  const isReadableStream1 = stream1 instanceof ReadableStream;
  const usedAfter1 = req1.bodyUsed;
  const chunks1 = await readAllChunks(stream1);

  // Already consumed: throws synchronously.
  const req2 = new Request('https://example.com', { method: 'POST', body: 'hello' });
  await req2.text();
  let rejected2 = false;
  try { req2.textStream(); } catch (e) { rejected2 = e instanceof TypeError; }

  // Locked via body.getReader(): throws synchronously.
  const req3 = new Request('https://example.com', { method: 'POST', body: 'hello' });
  req3.body.getReader();
  let rejected3 = false;
  try { req3.textStream(); } catch (e) { rejected3 = e instanceof TypeError; }

  // No body: never marks used, every call returns a fresh empty stream.
  const req4 = new Request('https://example.com');
  const usedBefore4 = req4.bodyUsed;
  const stream4a = req4.textStream();
  const usedAfterFirst4 = req4.bodyUsed;
  const stream4b = req4.textStream();
  const differentStreams4 = stream4a !== stream4b;
  const chunks4a = await readAllChunks(stream4a);
  const chunks4b = await readAllChunks(stream4b);

  // Decodes as UTF-8 regardless of a charset in Content-Type.
  const utf16leBytes = new Uint8Array([0x68, 0x00, 0x65, 0x00, 0x6c, 0x00, 0x6c, 0x00, 0x6f, 0x00]);
  const req5 = new Request('https://example.com', {
    method: 'POST',
    body: utf16leBytes,
    headers: { 'Content-Type': 'text/plain; charset=utf-16le' },
  });
  const chunks5 = await readAllChunks(req5.textStream());

  state.resolve();
  await state.done(() => {
    testing.expectTrue(existsOnPrototype);
    testing.expectTrue(isFunction);

    testing.expectFalse(usedBefore1);
    testing.expectTrue(isReadableStream1);
    testing.expectTrue(usedAfter1);
    testing.expectEqual('hello world', chunks1.join(''));

    testing.expectTrue(rejected2);
    testing.expectTrue(rejected3);

    testing.expectFalse(usedBefore4);
    testing.expectFalse(usedAfterFirst4);
    testing.expectTrue(differentStreams4);
    testing.expectEqual(0, chunks4a.length);
    testing.expectEqual(0, chunks4b.length);

    testing.expectEqual('h\0e\0l\0l\0o\0', chunks5.join(''));
  });
</script>

<script id=request_body_stream_after_consume type=module>
  const state = await testing.async();
  const s = new ReadableStream({ start(c) { c.enqueue(new TextEncoder().encode('x')); c.close(); } });
  const r = new Request('https://example.com', { method: 'POST', body: s, duplex: 'half' });
  const text = await r.text();
  state.resolve();
  await state.done(() => {
    testing.expectEqual('x', text);
    testing.expectTrue(r.body === s);
    testing.expectTrue(s.locked);
    testing.expectTrue(r.bodyUsed);
  });
</script>
