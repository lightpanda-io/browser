<script id=basic_echo type=module>
{
  const state = await testing.async();
  let received = [];

  let ws = new WebSocket('ws://127.0.0.1:9584/');

  ws.addEventListener('open', () => {
    ws.send('msg1');
  });

  ws.addEventListener('close', (e) => {
    received.push(['close', e.code, e.reason]);
    state.resolve();
  });

  ws.addEventListener('message', (e) => {
    received.push(e.data);
    ws.close(1000, 'bye');
  });

  await state.done(() => {
    testing.expectEqual([
      'echo-msg1',
      ['close', 1000, 'bye'],
    ], received);
  });
}
</script>

<script id=multiple_messages type=module>

  let ws = new WebSocket('ws://127.0.0.1:9584/');

  ws.addEventListener('open', () => {
    ws.send('first');
    ws.send('second');
    ws.send('third');
    sendCount = 3;
  });

  ws.addEventListener('message', (e) => {
    received.push(e.data);
    if (received.length === sendCount) {
      ws.close();

    state.resolve();
  });

  await state.done(() => {
    testing.expectEqual([

    ], received);
  });
}
</script>

<script id=receive_fragmented type=module>
{
  const state = await testing.async();
  let received = [];

  let ws = new WebSocket('ws://127.0.0.1:9584/');
  ws.binaryType = 'arraybuffer';

  ws.addEventListener('open', () => {
    ws.send('send-fragmented');
  });

  ws.addEventListener('message', (e) => {
    if (typeof e.data === 'string') {
      received.push(e.data);
      if (e.data === 'end') ws.close();
    } else {
      received.push(Array.from(new Uint8Array(e.data)));
    }
  });

  ws.addEventListener('close', () => {
    state.resolve();
  });

  await state.done(() => {
    testing.expectEqual([[1, 2, 3], 'abcd', 'end'], received);
  });
}
</script>

<script id=binary_uint8array type=module>
{

  let received = [];

  ws.binaryType = 'arraybuffer';

  ws.addEventListener('open', () => {

  });

    received.push(arr[1]); // Our first byte

  });

  ws.addEventListener('close', () => {
    state.resolve();
  });

  await state.done(() => {
    testing.expectEqual([0xEE, 6, 1], received);
  });
}
</script>

<script id=force_close type=module>
{
  const state = await testing.async();
  let received = [];

  let ws = new WebSocket('ws://127.0.0.1:9584/');

  ws.addEventListener('open', () => {
    ws.send('force-close');
  });

  let error_fired = false;
  ws.addEventListener('error', () => {
    error_fired = true;
  });

  ws.addEventListener('close', (e) => {
    received.push(['closed', e.code, e.wasClean, error_fired]);
    state.resolve();
  });

  await state.done(() => {
    // Connection was not cleanly closed. We fire error before close; Chrome
    // only does when the drop comes as a reset.
    if (testing.IS_TEST_RUNNER) {
      testing.expectEqual([['closed', 1006, false, true]], received);
    } else {
      testing.expectEqual(['closed', 1006, false], received[0].slice(0, 3));
    }
  });
}
</script>

<script id=ready_state type=module>

<script id=receive_binary_as_blob type=module>
{
  const state = await testing.async();
  let received = [];

  let ws = new WebSocket('ws://127.0.0.1:9584/');
  // binaryType defaults to 'blob'

  ws.addEventListener('open', () => {
    // Send binary data - server will echo with 0xEE marker
    const data = new Uint8Array([1, 2, 3, 4, 5]);
    ws.send(data);
  });

  ws.addEventListener('message', async (e) => {
    // e.data should be a Blob
    received.push(e.data instanceof Blob);
    received.push(e.data.size);

    // Read the Blob using FileReader
    const reader = new FileReader();
    reader.onload = () => {
      const arr = new Uint8Array(reader.result);
      received.push(arr[0]); // 0xEE marker
      received.push(arr[1]); // Our first byte
      ws.close();
    };
    reader.readAsArrayBuffer(e.data);
  });

  ws.addEventListener('close', () => {
    state.resolve();
  });

  await state.done(() => {
    testing.expectEqual([true, 6, 0xEE, 1], received);
  });
}
</script>

<script id=url_scheme_normalization>
{
  // http(s) is an accepted spelling of ws(s), and the url is resolved against
  // the document base before its scheme is looked at — so a relative url is
  // as valid as an absolute one.
  const dir = new URL('.', location);
  const cases = [
    ['http://127.0.0.1:9584/chat', 'ws://127.0.0.1:9584/chat'],
    ['https://127.0.0.1:9584/chat', 'wss://127.0.0.1:9584/chat'],
    ['ws://127.0.0.1:9584/chat', 'ws://127.0.0.1:9584/chat'],
    ['chat', 'ws://' + dir.host + dir.pathname + 'chat'],
    ['?x=1', 'ws://' + dir.host + location.pathname + '?x=1'],
  ];
  for (const [input, expected] of cases) {
    const ws = new WebSocket(input);
    testing.expectEqual(expected, ws.url);
    ws.close();
  }

  // the document's charset never applies: a websocket url percent-encodes
  // as UTF-8 no matter what the page is in
  const euro = new WebSocket('ws://127.0.0.1:9584/?€');
  testing.expectEqual('ws://127.0.0.1:9584/?%E2%82%AC', euro.url);
  euro.close();

  // every other scheme is a SyntaxError, as is a url the parser rejects
  for (const input of ['ftp://127.0.0.1:9584/', 'about:blank', 'mailto:a@b.org']) {
    testing.expectError('SyntaxError', () => new WebSocket(input));
  }
  testing.diverges("Chrome's URL parser allows a space in the host", () => {
    testing.expectError('SyntaxError', () => new WebSocket('ws://foo bar.com/'));
  });
}
</script>

<script id=close_while_connecting type=module>
{
  const state = await testing.async();
  let received = [];

  let ws = new WebSocket('ws://127.0.0.1:9584/');
  ws.addEventListener('open', () => { received.push('open'); });
  ws.addEventListener('error', () => { received.push(['error', ws.readyState]); });
  ws.addEventListener('close', (e) => {
    received.push(['close', e.code, e.reason, e.wasClean, ws.readyState]);
    state.resolve();
  });

  ws.close(3000, 'changed my mind');
  received.push(ws.readyState); // CLOSING = 2, immediately

  await state.done(() => {
    // Fails the connection: open never fires; error then an abnormal close
    // (1006, not what close() was given) are delivered asynchronously.
    testing.expectEqual([2, ['error', 3], ['close', 1006, '', false, 3]], received);
  });
}
</script>

<script id=cookies_on_upgrade type=module>
{
  // Cookies set on the page should ride along with the WebSocket
  // upgrade request as a Cookie header — same as any other same-origin
  // HTTP request. Without this, cookie-authenticated WS endpoints
  // (Phoenix LiveView, anything session-gated) reject the upgrade.
  //
  // RFC 6455 §4.1: the upgrade is an HTTP/1.1 request and follows
  // normal HTTP cookie semantics.
  // RFC 6265 §5.4: cookies attach to "any HTTP request" matching
  // the cookie's domain/path; ports are not part of cookie scope, so
  // a cookie set on 127.0.0.1:9582 attaches to a 127.0.0.1:9584 WS.
  //
  // The cases share the page's cookie jar, so they run one after another
  // in this one script; separate module scripts would interleave.
  const state = await testing.async();

  const clearCookies = () => {
    for (const pair of document.cookie.split(';')) {
      const name = pair.split('=')[0].trim();
      if (name) document.cookie = `${name}=; path=/; Max-Age=0`;
    }
  };

  // The server echoes the upgrade's Cookie header ("cookie:" when absent).
  const upgradeCookie = () => new Promise((resolve) => {
    const ws = new WebSocket('ws://127.0.0.1:9584/');
    ws.addEventListener('open', () => { ws.send('get-cookie'); });
    ws.addEventListener('message', (e) => { resolve(e.data); ws.close(); });
  });

  const results = {};

  // Set with path=/ so the cookie applies to the WS server's "/" path
  // (without an explicit Path attribute, default-path uses the page's
  // directory which doesn't match the WS endpoint).
  clearCookies();
  document.cookie = 'ws_token=session_xyz; path=/';
  results.landed = document.cookie.includes('ws_token=session_xyz');
  results.simple = await upgradeCookie();
  document.cookie = 'ws_token=; path=/; Max-Age=0';

  // Path scoping: a cookie scoped to /restricted MUST NOT attach to
  // a WS upgrade for "/". Guards against over-sending cookies.
  clearCookies();
  document.cookie = 'restricted=nope; path=/restricted';
  results.path_scoped_out = await upgradeCookie();
  document.cookie = 'restricted=; path=/restricted; Max-Age=0';

  // SameSite=Strict on a same-site upgrade (origin and target share
  // host 127.0.0.1) MUST attach. The upgrade is a .subresource lookup;
  // the cookie jar's SameSite logic only blocks Strict cookies when
  // the request is cross-site, regardless of navigation status.
  clearCookies();
  document.cookie = 'strict_token=s; path=/; SameSite=Strict';
  results.samesite_strict = await upgradeCookie();
  document.cookie = 'strict_token=; path=/; Max-Age=0';

  // With no matching cookies, no Cookie header should be added (not an
  // empty `Cookie: ` header).
  clearCookies();
  results.empty_jar = await upgradeCookie();

  // Multiple matching cookies must be joined with "; " per RFC 6265 §5.4.
  // The order isn't strictly specified, but jars keep insertion order.
  document.cookie = 'a=1; path=/';
  document.cookie = 'b=2; path=/';
  results.multiple = await upgradeCookie();
  document.cookie = 'a=; path=/; Max-Age=0';
  document.cookie = 'b=; path=/; Max-Age=0';

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, results.landed);
    testing.expectEqual('cookie:ws_token=session_xyz', results.simple);
    testing.expectEqual('cookie:', results.path_scoped_out);
    testing.expectEqual('cookie:strict_token=s', results.samesite_strict);
    testing.expectEqual('cookie:', results.empty_jar);
    testing.expectEqual('cookie:a=1; b=2', results.multiple);
  });
}
</script>

<script id=origin_on_upgrade type=module>
{
  // The upgrade request must carry the document's origin in an Origin
  // header — RFC 6455 §4.1 requires it for browser clients. Origin-checking
  // endpoints (CSRF protection on WS servers) reject upgrades that arrive
  // without it, before the handshake ever completes.
  const state = await testing.async();
  let received = [];

  let ws = new WebSocket('ws://127.0.0.1:9584/');

  ws.addEventListener('open', () => { ws.send('get-origin'); });
  ws.addEventListener('message', (e) => { received.push(e.data); ws.close(); });
  ws.addEventListener('close', () => { state.resolve(); });

  await state.done(() => {
    // The origin is the document's (fixture HTTP server, port 9582) —
    // not the WS endpoint's 9584.
    testing.expectEqual(['origin:http://127.0.0.1:9582'], received);
  });
}
</script>

<script id=send_non_buffer_object type=module>

  ws.addEventListener('open', () => {

    ws.send(new Set([1]));

    state.resolve();

  await state.done(() => {
    testing.expectEqual(['echo-[object Set]', 'echo-1,2'], received);
  });
}
</script>

<script id=server_subprotocol_match type=module>
// Matching subprotocol selected by the server: connection succeeds and ws.protocol is set
{
  const state = await testing.async();
