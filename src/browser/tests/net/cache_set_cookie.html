<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="../testing.js"></script>

<!-- Set-Cookie responses are always cached, privately scoped to this Browser. -->
<script id=cache_set_cookie type=module>
  import { fetchTwice } from './cache_set_cookie.js';
  {
    const state = await testing.async();
    state.resolve(await fetchTwice());

    await state.done((data) => {
      testing.expectEqual(String(data.n), data.first_cookie);
      testing.expectEqual(null, data.cleared);
      // served from the private cache; a cache hit doesn't re-apply Set-Cookie
      testing.expectEqual(`served ${data.n}`, data.second);
      testing.expectEqual(null, data.second_cookie);
    });
  }
</script>
