<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=fetch_basic type=module>
  {
    const state = await testing.async()
    const response = await fetch('http://127.0.0.1:9582/xhr');
    const text = await response.text();

    state.resolve();
    await state.done(() => {
      testing.expectEqual(200, response.status);
      testing.expectEqual(true, response.ok);
      testing.expectEqual('basic', response.type);
      testing.expectEqual('http://127.0.0.1:9582/xhr', response.url);
      testing.expectEqual(false, response.redirected);

      // Check headers
      const headers = response.headers;
      testing.expectEqual('text/html; charset=utf-8', headers.get('Content-Type'));
      testing.expectEqual('100', headers.get('content-length'));

      // Check text response

      testing.expectEqual(100, text.length);
    });
  }
</script>

<script id=fetch_json type=module>
  {
    const state = await testing.async();
    const response = await fetch('http://127.0.0.1:9582/xhr/json');

      testing.expectEqual(200, response.status);
      testing.expectEqual(true, response.ok);
      testing.expectEqual('basic', response.type);
      testing.expectEqual(false, response.redirected);

      testing.expectEqual('9000!!!', json.over);

      testing.expectEqual(1765867200000, json.updated_at);
      testing.expectEqual({over: '9000!!!',updated_at:1765867200000}, json);
    });
  }
</script>

<script id=response_body_stream type=module>
  {
    const state = await testing.async();
    const response = await fetch('http://127.0.0.1:9582/xhr');
    state.resolve();

    const buf = await response.arrayBuffer()

    await state.done(() => {
      testing.expectEqual(true, response.body !== null);
      testing.expectEqual(true, response.body instanceof ReadableStream);


      const uint8array = new Uint8Array(buf);
      const decoder = new TextDecoder('utf-8');
      testing.expectEqual('1234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890', decoder.decode(uint8array));
    })
  };
</script>

<script id=fetch_blob_url type=module>
  {
    const state = await testing.async();
    // Create a blob and get its URL
    const blob = new Blob(['Hello from blob!'], { type: 'text/plain' });
    const blobUrl = URL.createObjectURL(blob);
    const response = await fetch(blobUrl);
    const text = await response.text();

    state.resolve();

    await state.done(() => {
      testing.expectEqual(200, response.status);
      testing.expectEqual(true, response.ok);
      testing.expectEqual(blobUrl, response.url);
      testing.expectEqual('text/plain', response.headers.get('Content-Type'));

      testing.expectEqual('Hello from blob!', text);

      // Clean up
      URL.revokeObjectURL(blobUrl);
    });
  }
</script>

<script id=abort type=module>
  {
    const state = await testing.async();
    const controller = new AbortController();
    controller.abort();
    try {
      await fetch('http://127.0.0.1:9582/xhr', { signal: controller.signal });
      state.resolve();
      await state.done(() => {
        testing.fail('fetch should have been aborted');
      });
    } catch (e) {
      state.resolve();
      await state.done(() => {
        testing.expectEqual("AbortError", e.name);
      });
    }
  }
</script>

<script id=fetch_readablestream_body type=module>
  {
    const state = await testing.async();
    const payload = "name=Streamed&count=9";
    const enc = new TextEncoder();
    const stream = new ReadableStream({
      start(controller) {
        controller.enqueue(enc.encode("name=Streamed&"));
        controller.enqueue(enc.encode("count=9"));
        controller.close();
      },
    });

    const response = await fetch("http://127.0.0.1:9582/echo_body", {
      method: "POST",
      body: stream,
      duplex: "half",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
    });
    const text = await response.text();
    state.resolve();

    await state.done(() => {
      testing.expectEqual(200, response.status);
      testing.expectEqual(payload, text);
    });
  }
</script>

<script id=fetch_readablestream_body_reject type=module>
  {
    const state = await testing.async();
    const url = "http://127.0.0.1:9582/echo_body";
    const opts = { method: "POST", duplex: "half" };

    let openRejected = false;
    try {
      const open = new ReadableStream({
        start(c) { c.enqueue(new TextEncoder().encode("x")); },
      });
      await fetch(url, { ...opts, body: open });
    } catch (e) {
      openRejected = e instanceof TypeError;
    }

    let lockedRejected = false;
    try {
      const locked = new ReadableStream({
        start(c) {
          c.enqueue(new TextEncoder().encode("x"));
          c.close();
        },
      });
      locked.getReader();
      await fetch(url, { ...opts, body: locked });
    } catch (e) {
      lockedRejected = e instanceof TypeError;
    }

    // A stream is single-use: draining it for one body must not leave it
    // looking like a valid (empty) body for the next request.
    const once = new ReadableStream({
      start(c) {
        c.enqueue(new TextEncoder().encode("x"));
        c.close();
      },
    });
    const first = await fetch(url, { ...opts, body: once });
    const firstText = await first.text();

    let reuseRejected = false;
    try {
      await fetch(url, { ...opts, body: once });
    } catch (e) {
      reuseRejected = e instanceof TypeError;
    }

    state.resolve();
    await state.done(() => {
      testing.expectEqual(true, openRejected);
      testing.expectEqual(true, lockedRejected);
      testing.expectEqual("x", firstText);
      testing.expectEqual(true, reuseRejected);
    });
  }
</script>

<script id=fetch_header_layers type=module>
  {
    const state = await testing.async();
    const headers = new Headers();
    headers.set('Accept-Language', 'fr');
    headers.append('X-Multi', 'a');
    headers.append('X-Multi', 'b');
    headers.append('Cookie', 'a=1');
    headers.append('Cookie', 'b=2');
    headers.set('User-Agent', 'Mozilla/5.0 (X11; Linux x86_64)');
    headers.set('Sec-Ch-Ua', '"Chromium";v="140"');
    const response = await fetch('http://127.0.0.1:9582/echo_headers', { headers });
    const text = await response.text();
    state.resolve();

    await state.done(() => {
      const got = {};
      for (const line of text.trim().split('\n')) {
        const sep = line.indexOf(': ');
        got[line.slice(0, sep).toLowerCase()] = line.slice(sep + 2);
      }
      testing.expectEqual('fr', got['accept-language']);
      testing.expectEqual('a, b', got['x-multi']);
      testing.expectEqual('a=1; b=2', got['cookie']);
      testing.expectEqual(true, got['user-agent'].includes('Lightpanda'));
      testing.expectEqual(false, got['user-agent'].includes('Mozilla'));
      testing.expectEqual(true, got['sec-ch-ua'].includes('Lightpanda'));
      testing.expectEqual(false, got['sec-ch-ua'].includes('Chromium'));
    });
  }
</script>

<script id=fetch_redirect_authorization type=module>
  {
    // Authorization must not follow a cross-origin redirect. Custom headers
    // are not stripped by the redirect itself (that is a CORS job).
    const state = await testing.async();
    const headers = { Authorization: 'Bearer secret', 'X-Hop': 'keep' };
    const same = await (await fetch('/redirect_same_echo_headers', { headers })).text();
    const cross = await (await fetch('/redirect_cross_echo_headers', { headers })).text();
    state.resolve();

    await state.done(() => {
      const s = same.toLowerCase();
      const c = cross.toLowerCase();
      testing.expectEqual(true, s.includes('authorization: bearer secret'));
      testing.expectEqual(true, s.includes('x-hop: keep'));
      testing.expectEqual(false, c.includes('authorization'));
      testing.expectEqual(true, c.includes('x-hop: keep'));
    });
  }
</script>
