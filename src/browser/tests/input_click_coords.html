<!DOCTYPE html>
<html><head><title>Element gesture coordinates</title>
<style>
body { margin: 0; }
#target { display: block; margin-left: 12px; margin-top: 8px; width: 60px; height: 24px; }
#hoverme { display: block; margin-left: 6px; margin-top: 40px; width: 80px; height: 30px; }
</style></head><body>
<button id="target">Go</button>
<div id="hoverme"></div>
<script>
window.events = [];
const push = type => e => {
  events.push({type, x: e.clientX, y: e.clientY, trusted: e.isTrusted, button: e.button});
};
for (const type of ['pointerover', 'mouseover', 'pointermove', 'mousemove', 'pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) {
  document.addEventListener(type, push(type));
}
// enter/leave don't bubble: listen on the elements themselves.
for (const el of [document.getElementById('target'), document.getElementById('hoverme')]) {
  for (const type of ['pointerenter', 'mouseenter']) {
    el.addEventListener(type, push(type));
  }
}
</script>
</body></html>
