<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=replaceable>
    "use strict";
    // console is [Replaceable] (Console Standard): assignment must replace it
    // even in strict mode — neither throwing nor silently no-op'ing, and even
    // after console has already been read.
    const prev = window.console;
    window.console = {marker: 42};
    testing.expectEqual(42, window.console.marker);
    testing.expectEqual(42, console.marker);
    // restore: console is now a writable data property, so this just overwrites it.
    window.console = prev;
    testing.expectEqual(true, window.console === prev);
</script>

<script id=entries>
    {
        const entries = Object.entries(console);
        testing.expectEqual(true, entries.length > 10);

        const log_entry = entries.find((e) => e[0] == 'log');
        testing.expectEqual(true, log_entry[1] === console.log);
    }
</script>

<script id=namespace>
    // console members are namespace properties: they must ignore their
    // receiver. pino (seen on cnn.com) calls the captured native method as
    // `write.apply(proto, args)` where proto is its own object.
    console.log.apply({}, ["via apply"]);
    console.error.call(null, "via call");
    const detached = console.warn;
    detached("detached");

    // stateful members still reach the global's console state
    const count = console.count;
    count("ns");
    count("ns");
    console.countReset("ns");

    testing.expectEqual(true, true);
</script>

<script id=shapes>
    // Web IDL shapes: variadic/optional params don't count toward length,
    // and fully-optional members must accept zero arguments.
    testing.expectEqual(0, console.log.length);
    testing.expectEqual(0, console.assert.length);
    testing.expectEqual(0, console.table.length);

    // namespace class string is the identifier, lowercase
    testing.expectEqual('[object console]', Object.prototype.toString.call(console));

    console.assert();          // asserts false, logs, must not throw
    console.table();
    console.dir(document.body);
    console.dir();
    console.dirxml(document.body, "extra");

    testing.expectEqual(true, true);
</script>

<script id="time">
    // should not crash
    console.time();
    console.timeLog();
    console.timeEnd();

    console.time("test");
    console.timeLog("test");
    console.timeEnd("test");

    testing.expectEqual(true, true);
</script>

<script id="count">
    // should not crash
    console.count();
    console.count();
    console.countReset();

    console.count("test");
    console.count("test");
    console.countReset("test");

    testing.expectEqual(true, true);
</script>

<script id="group">
    // should not crash
    console.group();
    console.groupEnd();

    console.group("outer");
    console.group("inner");
    console.log("nested");
    console.groupEnd();
    console.groupEnd();

    console.groupCollapsed("collapsed");
    console.log("inside collapsed");
    console.groupEnd();

    // groupEnd beyond depth 0 should not crash
    console.groupEnd();

    testing.expectEqual(true, true);
</script>
