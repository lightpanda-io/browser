<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="../testing.js"></script>

<script id=add_all_in_flight_at_teardown type=module>
  const state = await testing.async();

  // Never awaited: the page goes away with one fetch done and one still in
  // flight. The runner's leak check is the assertion.
  const cache = await caches.open('teardown');
  cache.addAll(['/xhr', '/xhr/slow']);

  state.resolve();
  await state.done(() => testing.expectTrue(true));
</script>
