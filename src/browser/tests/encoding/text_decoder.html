<!DOCTYPE html>
<meta charset="UTF-8">

<meta name=lp-mode content=test>
<script src="../testing.js"></script>
<script id=decoder>
  let d1 = new TextDecoder();
  testing.expectEqual('utf-8', d1.encoding);
  testing.expectEqual(false, d1.fatal);
  testing.expectEqual(false, d1.ignoreBOM);

  testing.expectEqual('', d1.decode());
  testing.expectEqual('香料', d1.decode(new Uint8Array([233, 166, 153, 230, 150, 153])));
  testing.expectEqual('香料', d1.decode(new Uint8Array([0xEF, 0xBB, 0xBF, 233, 166, 153, 230, 150, 153])));

  {
    const buffer = new ArrayBuffer(6);
    const ints = new Uint8Array(buffer)
    ints[0] = 233;
    ints[1] = 166;
    ints[2] = 153;
    ints[3] = 230;
    ints[4] = 150;
    ints[5] = 153;
    testing.expectEqual('香料', d1.decode(buffer));
  }

  {
    const buffer = new ArrayBuffer(6);
    const dv = new DataView(buffer);
    dv.setUint8(0, 233);
    dv.setUint8(1, 166);
    dv.setUint8(2, 153);
    dv.setUint8(3, 230);
    dv.setUint8(4, 150);
    dv.setUint8(5, 153);
    testing.expectEqual('香料', d1.decode(dv));
  }

  let d2 = new TextDecoder('utf8', {fatal: true})
  testing.expectError('TypeError', () => {
    let data  = new Uint8Array([241, 241, 159, 172]);
    d2.decode(data);
  });
</script>

<script id=stream>
  let d3 = new TextDecoder();
  testing.expectEqual('', d3.decode(new Uint8Array([226, 153]), { stream: true }));
  testing.expectEqual('♥', d3.decode(new Uint8Array([165]), { stream: true }));
</script>

<script id=stream_many>
  // Each decode's output lives on the caller's call_arena, which resets under
  // the decoder between calls. Reusing one decoder across many chunks must
  // still return only the chunk just decoded.
  let d5 = new TextDecoder();
  let out = '';
  for (let i = 0; i < 500; i++) {
    out += d5.decode(new Uint8Array([104, 105]), { stream: true });
  }
  testing.expectEqual(1000, out.length);
  testing.expectEqual('hihi', out.slice(0, 4));
  testing.expectEqual('', d5.decode());
</script>

<script id=bom>
  // Only a BOM of the decoder's own encoding is stripped; nothing is sniffed.
  testing.expectEqual('\ufffd\ufffdA\u0000', new TextDecoder().decode(new Uint8Array([0xFF, 0xFE, 0x41, 0x00])));
  testing.expectEqual('\u00ef\u00bb\u00bf\u00e9', new TextDecoder('windows-1252').decode(new Uint8Array([0xEF, 0xBB, 0xBF, 0xE9])));
  testing.expectEqual('A', new TextDecoder('utf-16le').decode(new Uint8Array([0xFF, 0xFE, 0x41, 0x00])));
  testing.expectEqual('\ufeffA', new TextDecoder('utf-8', {ignoreBOM: true}).decode(new Uint8Array([0xEF, 0xBB, 0xBF, 0x41])));
  testing.expectEqual('A', new TextDecoder('utf-16be').decode(new Uint8Array([0xFE, 0xFF, 0x00, 0x41])));
  // gb18030 has no BOM: a leading U+FEFF is kept.
  testing.expectEqual('\ufeffA', new TextDecoder('gb18030').decode(new Uint8Array([0x84, 0x31, 0x95, 0x33, 0x41])));

  // A BOM split across chunks is still stripped, and again after a flush.
  let d6 = new TextDecoder();
  testing.expectEqual('', d6.decode(new Uint8Array([0xEF, 0xBB]), { stream: true }));
  testing.expectEqual('A', d6.decode(new Uint8Array([0xBF, 0x41])));
  testing.expectEqual('B', d6.decode(new Uint8Array([0xEF, 0xBB, 0xBF, 0x42])));
</script>

<script id=slice>
  const buf1 = new ArrayBuffer(7);
  const arr1 = new Uint8Array(buf1)
  arr1[0] = 80;
  arr1[1] = 81;
  arr1[2] = 82;
  arr1[3] = 83;
  arr1[4] = 84;
  arr1[5] = 85;
  arr1[6] = 86;
  let d4 = new TextDecoder();
  testing.expectEqual('RST', d4.decode(new Uint8Array(buf1, 2, 3)));
</script>

<script id=legacy_encodings>
  // GBK (Chinese)
  let gbk = new TextDecoder('gbk');
  testing.expectEqual('gbk', gbk.encoding);
  testing.expectEqual('中文', gbk.decode(new Uint8Array([0xD6, 0xD0, 0xCE, 0xC4])));

  // Shift_JIS (Japanese)
  let sjis = new TextDecoder('shift_jis');
  testing.expectEqual('shift_jis', sjis.encoding);
  testing.expectEqual('日本語', sjis.decode(new Uint8Array([0x93, 0xFA, 0x96, 0x7B, 0x8C, 0xEA])));

  // EUC-JP (Japanese)
  let eucjp = new TextDecoder('euc-jp');
  testing.expectEqual('euc-jp', eucjp.encoding);

  // ISO-8859-1 (Latin-1)
  let latin1 = new TextDecoder('iso-8859-1');
  testing.expectEqual('windows-1252', latin1.encoding); // ISO-8859-1 maps to windows-1252 per spec
  testing.expectEqual('café', latin1.decode(new Uint8Array([0x63, 0x61, 0x66, 0xe9])));

  // Big5 (Traditional Chinese)
  let big5 = new TextDecoder('big5');
  testing.expectEqual('big5', big5.encoding);

  // UTF-16LE
  let utf16le = new TextDecoder('utf-16le');
  testing.expectEqual('utf-16le', utf16le.encoding);
  testing.expectEqual('AB', utf16le.decode(new Uint8Array([0x41, 0x00, 0x42, 0x00])));

  // UTF-16BE
  let utf16be = new TextDecoder('utf-16be');
  testing.expectEqual('utf-16be', utf16be.encoding);
  testing.expectEqual('AB', utf16be.decode(new Uint8Array([0x00, 0x41, 0x00, 0x42])));
</script>

<script id=invalid_label>
  // Test invalid encoding label
  try {
    new TextDecoder('invalid-encoding');
    testing.fail();
  } catch (e) {
    testing.expectEqual(true, e.toString().includes('RangeError'));
  }

  // Test 'replacement' encoding is rejected
  try {
    new TextDecoder('replacement');
    testing.fail();
  } catch (e) {
    testing.expectEqual(true, e.toString().includes('RangeError'));
  }
</script>

<script id=label_variations>
  // Case insensitive
  let upper = new TextDecoder('UTF-8');
  testing.expectEqual('utf-8', upper.encoding);

  // Leading/trailing whitespace
  let ws = new TextDecoder('  utf-8  ');
  testing.expectEqual('utf-8', ws.encoding);
</script>

<script id=stream_fatal_error>
  {
    let d = new TextDecoder('utf-8', {fatal: true});

    d.decode(new Uint8Array([65]), { stream: true }); // 'A'
    testing.expectError('TypeError', () => {
      d.decode(new Uint8Array([0xFF, 0xFE])); // invalid UTF-8
    });

    // Verify decoder still works after error recovery
    testing.expectEqual('B', d.decode(new Uint8Array([66])));
  }
</script>

<script id=stream_pending_bytes>
  {
    // Bytes held from the last call can decode to more than the new input
    // alone would: here one byte gives two U+FFFD.
    let d = new TextDecoder();
    testing.expectEqual('', d.decode(new Uint8Array([0xF0]), { stream: true }));
    testing.expectEqual('\uFFFD\uFFFD', d.decode(new Uint8Array([0x8F]), { stream: true }));
    testing.expectEqual('\uFFFD', d.decode(new Uint8Array([0x92]), { stream: true }));
    testing.expectEqual('', d.decode());

    testing.expectEqual('', d.decode(new Uint8Array([0xF0, 0x9F]), { stream: true }));
    testing.expectEqual('\uFFFDA', d.decode(new Uint8Array([0x41]), { stream: true }));
    testing.expectEqual('', d.decode());
  }
</script>

<script id=buffer_source_input>
{
  // Any view is decoded as its raw bytes; a string isn't a BufferSource.
  testing.expectEqual('AB', new TextDecoder().decode(new Uint16Array([0x4241])));
  testing.expectError('TypeError', () => new TextDecoder().decode('abc'));

  // The options are read after the input, and a getter that detaches it
  // leaves it empty, rather than a read of the freed backing store.
  const input = new TextEncoder().encode('hello');
  testing.expectEqual('', new TextDecoder().decode(input, {get stream() { input.buffer.transfer(0); return false; }}));
}
</script>
