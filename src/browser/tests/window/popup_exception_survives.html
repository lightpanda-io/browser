<!DOCTYPE html>
<head></head>
<body>
<script src="../testing.js"></script>

<!--
A JsApi value constructed by value (DOMException) is wrapped and tracked in
the page-wide identity map, held by a strong v8.Global. Re-navigating the
popup in place destroys the popup's context and releases its arena, but the
opener still holds the wrapper: its properties must stay readable after the
popup's context is gone.
-->
<script id=popup_exception_survives_renavigation type=module>
  const state = await testing.async();

  const w = window.open('about:blank', 'popup_ctor');
  testing.expectTrue(w != null);
  const e = new w.DOMException('m'.repeat(64), 'NotFoundError');
  testing.expectEqual('NotFoundError', e.name);
  testing.expectEqual('m'.repeat(64), e.message);

  // in-place re-navigation of the named popup
  window.open(testing.BASE_URL + 'window/support/frame1.html', 'popup_ctor');
  await new Promise((r) => setTimeout(r, 500));

  state.resolve();
  await state.done(() => {
    testing.expectEqual('NotFoundError', e.name);
    testing.expectEqual('m'.repeat(64), e.message);
    testing.expectEqual(8, e.code);
  });
</script>

<!--
Same, through structuredDeserialize: the clone is deserialized in the
popup's context, so its strings must live on the identity arena too.
-->
<script id=popup_clone_survives_renavigation type=module>
  const state = await testing.async();

  const w = window.open('about:blank', 'popup_clone');
  testing.expectTrue(w != null);
  const e = w.structuredClone(new DOMException('m'.repeat(64), 'NotFoundError'));
  testing.expectEqual('NotFoundError', e.name);
  testing.expectEqual('m'.repeat(64), e.message);

  // in-place re-navigation of the named popup
  window.open(testing.BASE_URL + 'window/support/frame1.html', 'popup_clone');
  await new Promise((r) => setTimeout(r, 500));

  state.resolve();
  await state.done(() => {
    testing.expectEqual('NotFoundError', e.name);
    testing.expectEqual('m'.repeat(64), e.message);
    testing.expectEqual(8, e.code);
  });
</script>
</body>
