<!DOCTYPE html>
<meta charset="UTF-8">
<body></body>
<meta name=lp-mode content=test>
<script src="../testing.js"></script>

<script id="gbk_encoding" type=module>
  {
    const state = await testing.async();
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = 'encoding/gbk.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      // GBK-encoded "中文" should be decoded to UTF-8
      testing.expectEqual('中文', iframe.contentDocument.getElementById('test').textContent);
      // document.characterSet should return canonical encoding name
      testing.expectEqual('GBK', iframe.contentDocument.characterSet);
      testing.expectEqual('GBK', iframe.contentDocument.charset);
      testing.expectEqual('GBK', iframe.contentDocument.inputEncoding);
    });
  }
</script>

<script id="content_type_header_charset" type=module>
  {
    const state = await testing.async();

    // Test charset from Content-Type HTTP header (no meta charset in file)
    // TestHTTPServer returns "text/html; charset=GB2312" for *.GB2312.html files
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = testing.BASE_URL + 'page/encoding/content_type.GB2312.html';

      // GB2312-encoded "中文" should be decoded to UTF-8 via Content-Type header charset
      testing.expectEqual('中文', iframe.contentDocument.getElementById('test').textContent);
    });
  }
</script>

<script id="unicode_label_falls_back_to_utf8" type=module>
  {
    const state = await testing.async();

    // The legacy "unicode" label maps to UTF-16LE, but HTML prescan maps
    // UTF-16 labels back to UTF-8 so ASCII pages stay readable.
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = 'encoding/unicode_label.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      testing.expectEqual('Hello world', iframe.contentDocument.getElementById('title').textContent);
      testing.expectEqual(
        'This page is plain ASCII but declares charset=unicode.',
        iframe.contentDocument.getElementById('body').textContent,
      );
      testing.expectEqual('UTF-8', iframe.contentDocument.characterSet);
      testing.expectEqual('UTF-8', iframe.contentDocument.charset);
      testing.expectEqual('UTF-8', iframe.contentDocument.inputEncoding);
    });
  }
</script>

<script id="no_charset_same_origin_inherits" type=module>
  {
    const state = await testing.async();

    // A same-origin child that declares nothing inherits the parent's
    // UTF-8, with no detection: invalid bytes become U+FFFD.
    const files = ['no_charset.html', 'latin1_no_charset.html', 'utf8_stray_byte.html'];
    const docs = {};
    for (const f of files) {
      const iframe = document.createElement('iframe');
      iframe.onload = () => {
        docs[f] = iframe.contentDocument;
        if (Object.keys(docs).length === files.length) state.resolve();
      };
      iframe.src = 'encoding/' + f;
      document.body.appendChild(iframe);
    }

    await state.done(() => {
      for (const f of files) {
        testing.expectEqual('UTF-8', docs[f].characterSet);
      }
      testing.expectEqual('\uFFFD\uFFFD\uFFFD\uFFFD', docs['no_charset.html'].getElementById('test').textContent);
      testing.expectEqual('Caf\uFFFD', docs['latin1_no_charset.html'].title);
      testing.expectEqual('café résumé \uFFFD', docs['utf8_stray_byte.html'].getElementById('test').textContent);
    });
  }
</script>

<script id="no_charset_cross_origin_fallback" type=module>
  {
    const state = await testing.async();

    // A cross-origin child doesn't inherit, so the browser's own fallback
    // applies. The fixtures post what they decoded.
    const cross = 'http://localhost:9582';
    const files = ['no_charset.html', 'latin1_no_charset.html', 'utf8_stray_byte.html'];
    const got = {};
    window.addEventListener('message', (e) => {
      if (e.origin !== cross) return;
      got[e.data.file] = e.data;
      if (Object.keys(got).length === files.length) state.resolve();
    });
    for (const f of files) {
      const iframe = document.createElement('iframe');
      iframe.src = cross + '/src/browser/tests/page/encoding/' + f;
      document.body.appendChild(iframe);
    }

    await state.done(() => {
      const latin1 = got['latin1_no_charset.html'];
      testing.expectEqual('windows-1252', latin1.cs);
      testing.expectEqual('Café', latin1.title);
      testing.expectEqual('naïve résumé', latin1.text);

      testing.diverges('Chrome detects GBK; we fall back to windows-1252', () => {
        testing.expectEqual('windows-1252', got['no_charset.html'].cs);
        testing.expectEqual('\u00D6\u00D0\u00CE\u00C4', got['no_charset.html'].text);
      });
      testing.diverges('Chrome never detects UTF-8 (it picks ISO-8859-4 here); we keep mostly-valid UTF-8', () => {
        testing.expectEqual('UTF-8', got['utf8_stray_byte.html'].cs);
        testing.expectEqual('café résumé \uFFFD', got['utf8_stray_byte.html'].text);
      });
    });
  }
</script>

<script id="utf16le_bom" type=module>
  {
    const state = await testing.async();

    // Served as text/html with no charset: the BOM alone names UTF-16LE.
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = 'encoding/utf16le_bom.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      testing.expectEqual('Café', iframe.contentDocument.title);
      testing.expectEqual('中文 naïve', iframe.contentDocument.getElementById('test').textContent);
      testing.expectEqual('UTF-16LE', iframe.contentDocument.characterSet);
    });
  }
</script>

<script id="utf8_bom_overrides_header" type=module>
  {
    const state = await testing.async();

    // The header says GB2312, but a UTF-8 BOM wins.
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = testing.BASE_URL + 'page/encoding/utf8_bom.GB2312.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      const doc = iframe.contentDocument;
      testing.expectEqual('中文 café', doc.getElementById('test').textContent);
      testing.expectEqual('UTF-8', doc.characterSet);
      // the BOM itself isn't content
      testing.expectEqual('test', doc.body.firstChild.id);
    });
  }
</script>

<script id="anchor_href_encoding_with_ncr" type=module>
  {
    const state = await testing.async();

    // Test that anchor.href encodes unmappable characters as NCRs in non-UTF-8 documents.
    // When a character can't be represented in the document's encoding, it should become &#nnnnn;
    // Per WHATWG URL Standard, query strings use document encoding with NCR fallback.
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = 'encoding/gbk.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      testing.expectEqual('GBK', iframe.contentDocument.characterSet);

      // Test 1: U+3D34 (㴴) - a Han character NOT in GBK, should become NCR &#15668;
      const anchor = iframe.contentDocument.createElement('a');
      iframe.contentDocument.body.appendChild(anchor);
      anchor.href = 'http://example.com/?q=\u3D34';
      // The NCR &#15668; percent-encoded is %26%2315668%3B
      testing.expectEqual('http://example.com/?q=%26%2315668%3B', anchor.href);

      // Test 2: U+4E2D (中) - IS in GBK, should encode to GBK bytes D6D0 then percent-encode
      const anchor2 = iframe.contentDocument.createElement('a');
      iframe.contentDocument.body.appendChild(anchor2);
      anchor2.href = 'http://example.com/?q=\u4E2D';
      // GBK encoding of 中 is D6 D0, percent-encoded as %D6%D0
      testing.expectEqual('http://example.com/?q=%D6%D0', anchor2.href);
    });
  }
</script>
