<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="../testing.js"></script>

<script id="document_fonts_exists">
{
    testing.expectTrue(document.fonts !== undefined);
    testing.expectTrue(document.fonts !== null);
}
</script>

<script id="document_fonts_same_instance">
{
    // Should return same instance each time
    const f1 = document.fonts;
    const f2 = document.fonts;
    testing.expectTrue(f1 === f2);
}
</script>

<script id="document_fonts_status">
{
    testing.expectEqual('loaded', document.fonts.status);
}
</script>

<script id="document_fonts_size">
{
    testing.expectEqual(0, document.fonts.size);
}
</script>

<script id="document_fonts_ready_is_promise">
{
    const ready = document.fonts.ready;
    testing.expectTrue(ready instanceof Promise);
}
</script>

<script id="document_fonts_ready_resolves">
{
    let resolved = false;
    document.fonts.ready.then(() => { resolved = true; });
    // Promise resolution is async; just confirm .then() does not throw
    testing.expectTrue(typeof document.fonts.ready.then === 'function');
}
</script>

<script id="document_fonts_check">
{
    testing.expectTrue(document.fonts.check('16px sans-serif'));
}
</script>

<script id="document_fonts_constructor_name">
{
    testing.expectEqual('FontFaceSet', document.fonts.constructor.name);
}
</script>

<script id="document_fonts_load">
{
    // Nothing starts loading, so neither event fires.
    const events = [];
    document.fonts.addEventListener('loading', () => events.push('loading'));
    document.fonts.addEventListener('loadingdone', () => {
        events.push('loadingdone');
        document.fonts.load("16px Roboto");
    });

    let loaded = null;
    document.fonts.load("italic bold 16px Roboto").then((fonts) => loaded = fonts);
    let generic = null;
    document.fonts.load("16px sans-serif").then((fonts) => generic = fonts);
    testing.expectEqual(0, events.length);

    testing.onload(() => {
      testing.expectEqual(0, events.length);
      testing.expectEqual(true, Array.isArray(loaded));
      // A generic family never matches a font face.
      testing.expectEqual(0, generic.length);
      testing.diverges('Chrome resolves an undeclared family with []; we resolve with a loaded stand-in face', () => {
        testing.expectEqual(1, loaded.length);
        testing.expectEqual('Roboto', loaded[0]?.family);
      });
    });
}
</script>

<script id="document_fonts_add_size">
{
    const before = document.fonts.size;
    const face = new FontFace("SizeFont", "url(size.woff)");
    document.fonts.add(face);
    testing.expectEqual(before + 1, document.fonts.size);
    // Adding the same face again doesn't grow the set.
    document.fonts.add(face);
    testing.expectEqual(before + 1, document.fonts.size);
}
</script>
