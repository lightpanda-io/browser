<!DOCTYPE html>
<html>
<head>
<meta name=lp-mode content=test>
<script src="../testing.js"></script>
<script id=load_waits_for_the_sheets>
  window.__events = [];
  let dclSheets = -1;
  document.addEventListener('DOMContentLoaded', () => { dclSheets = document.styleSheets.length; });
  testing.onload(() => {
    // No script follows the links: DOMContentLoaded didn't wait for them.
    testing.expectEqual(0, dclSheets);
    // The load event did.
    testing.expectEqual(4, document.styleSheets.length);
    for (const id of ['a', 'b', 'c', 'd']) {
      testing.expectEqual('none', getComputedStyle(document.getElementById(id)).display);
    }
    testing.expectEqual(['a:load', 'b:load', 'c:load', 'd:load'], [...window.__events].sort());
  });
</script>
<!-- In <head>: Chrome blocks the parser at a stylesheet <link> in <body> -->
<link rel=stylesheet href="slow/a.css?delay_ms=300" onload="__events.push('a:load')" onerror="__events.push('a:error')">
<link rel=stylesheet href="slow/b.css?delay_ms=300" onload="__events.push('b:load')" onerror="__events.push('b:error')">
<link rel=stylesheet href="slow/c.css?delay_ms=300" onload="__events.push('c:load')" onerror="__events.push('c:error')">
<link rel=stylesheet href="slow/d.css?delay_ms=300" onload="__events.push('d:load')" onerror="__events.push('d:error')">
</head>
<body>
<p id=a class=slow-a>a</p>
<p id=b class=slow-b>b</p>
<p id=c class=slow-c>c</p>
<p id=d class=slow-d>d</p>
</body>
</html>
