<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=WebGLRenderingContext#getSupportedExtensions>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  testing.expectEqual(true, ctx instanceof WebGLRenderingContext);

  const supportedExtensions = ctx.getSupportedExtensions();
  // The order Chrome prefer.
  const expectedExtensions = [
      "ANGLE_instanced_arrays",
      "EXT_blend_minmax",
      "EXT_clip_control",
      "EXT_color_buffer_half_float",
      "EXT_depth_clamp",
      "EXT_disjoint_timer_query",
      "EXT_float_blend",
      "EXT_frag_depth",
      "EXT_polygon_offset_clamp",
      "EXT_shader_texture_lod",
      "EXT_texture_compression_bptc",
      "EXT_texture_compression_rgtc",
      "EXT_texture_filter_anisotropic",
      "EXT_texture_mirror_clamp_to_edge",
      "EXT_sRGB",
      "KHR_parallel_shader_compile",
      "OES_element_index_uint",
      "OES_fbo_render_mipmap",
      "OES_standard_derivatives",
      "OES_texture_float",
      "OES_texture_float_linear",
      "OES_texture_half_float",
      "OES_texture_half_float_linear",
      "OES_vertex_array_object",
      "WEBGL_blend_func_extended",
      "WEBGL_color_buffer_float",
      "WEBGL_compressed_texture_astc",
      "WEBGL_compressed_texture_etc",
      "WEBGL_compressed_texture_etc1",
      "WEBGL_compressed_texture_pvrtc",
      "WEBGL_compressed_texture_s3tc",
      "WEBGL_compressed_texture_s3tc_srgb",
      "WEBGL_debug_renderer_info",
      "WEBGL_debug_shaders",
      "WEBGL_depth_texture",
      "WEBGL_draw_buffers",
      "WEBGL_lose_context",
      "WEBGL_multi_draw",
      "WEBGL_polygon_mode"
  ];

  testing.expectEqual(expectedExtensions.length, supportedExtensions.length);
  for (let i = 0; i < expectedExtensions.length; i++) {
    testing.expectEqual(expectedExtensions[i], supportedExtensions[i]);
  }
}
</script>

<script id=WebGLRenderingCanvas#getExtension>
// WEBGL_debug_renderer_info
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const rendererInfo = ctx.getExtension("WEBGL_debug_renderer_info");
  testing.expectEqual(true, rendererInfo instanceof WEBGL_debug_renderer_info);

  const { UNMASKED_VENDOR_WEBGL, UNMASKED_RENDERER_WEBGL } = rendererInfo;
  testing.expectEqual(UNMASKED_VENDOR_WEBGL, 0x9245);
  testing.expectEqual(UNMASKED_RENDERER_WEBGL, 0x9246);

  const vendor = ctx.getParameter(UNMASKED_VENDOR_WEBGL);
  const renderer = ctx.getParameter(UNMASKED_RENDERER_WEBGL);
  testing.expectEqual(true, typeof vendor === "string" && vendor.length > 0);
  testing.expectEqual(true, typeof renderer === "string" && renderer.length > 0);
  testing.expectEqual(false, /swiftshader|llvmpipe/i.test(vendor + renderer));
  // The pair comes from the active fingerprint profile, so the exact GPU
  // varies with the seed. What must hold for every profile is that the two
  // agree: the vendor's brand ("Google Inc. (NVIDIA)" -> NVIDIA, "Intel Inc."
  // -> Intel) also appears in the renderer string.
  const brand = (vendor.match(/\(([^)]+)\)/)?.[1] ?? vendor.replace(/\s+Inc\.$/, "")).trim();
  testing.expectEqual(true, brand.length > 0);
  testing.expectEqual(true, renderer.includes(brand));
}

// WEBGL_lose_context
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const loseContext = ctx.getExtension("WEBGL_lose_context");
  testing.expectEqual(true, loseContext instanceof WEBGL_lose_context);

  loseContext.loseContext();
  loseContext.restoreContext();
}
</script>

<script id=identity>
{
  const element = document.createElement('canvas');
  const ctx = element.getContext('webgl');

  testing.expectTrue(ctx === element.getContext('webgl'));
  testing.expectEqual(null, element.getContext('2d'));
}
</script>

<script id=WebGLRenderingContext#readPixels>
{
  const element = document.createElement('canvas');
  const ctx = element.getContext('webgl');
  const RGBA = 0x1908;

  const a = new Uint8Array(4 * 4 * 4);
  const b = new Uint8Array(4 * 4 * 4);
  ctx.readPixels(0, 0, 4, 4, RGBA, ctx.UNSIGNED_BYTE, a);
  ctx.readPixels(0, 0, 4, 4, RGBA, ctx.UNSIGNED_BYTE, b);

  // An all-zero buffer is the headless tell we are avoiding.
  testing.expectEqual(false, a.every((v) => v === 0));
  // Same probe => byte-identical, and pixels vary.
  testing.expectEqual(a.join(), b.join());
  testing.expectEqual(false, a.slice(0, 4).join() === a.slice(4, 8).join());
  // Opaque, like a real render.
  testing.expectEqual(255, a[3]);
  testing.expectEqual(255, a[a.length - 1]);

  // A different rect gives different bytes.
  const c = new Uint8Array(4 * 4 * 4);
  ctx.readPixels(2, 3, 4, 4, RGBA, ctx.UNSIGNED_BYTE, c);
  testing.expectEqual(false, a.join() === c.join());

  // With --no-stealth and no --fingerprint there is no profile and toDataURL keeps
  // the honest "data:," (see Canvas.toDataURL); with a profile it is a real
  // PNG, never a blank one. Either way it has to be stable across calls.
  const url = element.toDataURL();
  testing.expectEqual(true, url === 'data:,' || url.startsWith('data:image/png;base64,'));
  testing.expectEqual(url, element.toDataURL());
}
</script>
