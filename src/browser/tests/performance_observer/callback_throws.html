<!DOCTYPE html>
<script src="../testing.js"></script>

<script id="throwingObserverDoesNotStopOthers" type=module>
  const state = await testing.async();

  let calledSecond = false;
  const errors = [];
  const onError = (e) => {
    errors.push(e.error);
    e.preventDefault();
  };
  window.addEventListener('error', onError);

  const first = new PerformanceObserver(() => {
    first.disconnect();
    throw new Error('boom');
  });
  first.observe({ type: "mark" });

  await new Promise((resolve) => {
    const second = new PerformanceObserver(() => {
      calledSecond = true;
      second.disconnect();
      resolve();
    });
    second.observe({ type: "mark" });
    performance.mark("throwMark");
  });

  window.removeEventListener('error', onError);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, calledSecond);
    testing.expectEqual(1, errors.length);
    testing.expectEqual('boom', errors[0].message);
  });
</script>
