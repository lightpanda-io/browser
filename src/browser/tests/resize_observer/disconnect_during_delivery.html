<!DOCTYPE html>
<script src="../testing.js"></script>
<div id="target" style="width: 100px; height: 60px;">Target Element</div>

<script id="disconnectEarlierObserver">
  {
    // b disconnects a while the delivery round is in progress. Each observer
    // must still be called at most once, in registration order.
    const target = document.getElementById('target');
    const calls = [];
    const a = new ResizeObserver(() => calls.push('a'));
    const b = new ResizeObserver(() => { calls.push('b'); a.disconnect(); });
    const c = new ResizeObserver(() => calls.push('c'));
    a.observe(target);
    b.observe(target);
    c.observe(target);

    testing.onload(() => {
      testing.expectEqual('a,b,c', calls.join(','));
      b.disconnect();
      c.disconnect();
    });
  }
</script>

<script id="disconnectLaterObserver">
  {
    const target = document.getElementById('target');
    const calls = [];
    let c = null;
    const a = new ResizeObserver(() => { calls.push('a'); c.disconnect(); });
    const b = new ResizeObserver(() => calls.push('b'));
    c = new ResizeObserver(() => calls.push('c'));
    a.observe(target);
    b.observe(target);
    c.observe(target);

    testing.onload(() => {
      testing.expectEqual('a,b', calls.join(','));
      a.disconnect();
      b.disconnect();
    });
  }
</script>
