<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="../testing.js"></script>
<div id="target" style="width: 100px; height: 60px;">Target Element</div>

<script id="disconnectEarlierObserver" type=module>
  {
    // b disconnects a while the delivery round is in progress. Each observer
    // must still be called at most once, in registration order.
    const state = await testing.async();
    const target = document.getElementById('target');
    const calls = [];
    const a = new ResizeObserver(() => calls.push('a'));
    const b = new ResizeObserver(() => { calls.push('b'); a.disconnect(); });
    const c = new ResizeObserver(() => calls.push('c'));
    a.observe(target);
    b.observe(target);
    c.observe(target);
    await testing.nextFrame();
    b.disconnect();
    c.disconnect();

    state.resolve();
    await state.done(() => {
      testing.expectEqual('a,b,c', calls.join(','));
    });
  }
</script>

<script id="disconnectLaterObserver" type=module>
  {
    const state = await testing.async();
    const target = document.getElementById('target');
    const calls = [];
    let c = null;
    const a = new ResizeObserver(() => { calls.push('a'); c.disconnect(); });
    const b = new ResizeObserver(() => calls.push('b'));
    c = new ResizeObserver(() => calls.push('c'));
    a.observe(target);
    b.observe(target);
    c.observe(target);
    await testing.nextFrame();
    a.disconnect();
    b.disconnect();

    state.resolve();
    await state.done(() => {
      testing.expectEqual('a,b', calls.join(','));
    });
  }
</script>

<script id="microtaskCallsIntoZig" type=module>
  {
    // A microtask queued by the callback runs before the delivery round
    // ends. Its calls into Zig must not clobber the round's observer snapshot.
    const state = await testing.async();
    const target = document.getElementById('target');
    const calls = [];
    const observers = [];
    for (let i = 0; i < 4; i += 1) {
      const observer = new ResizeObserver(() => {
        calls.push(i);
        queueMicrotask(() => {
          for (let j = 0; j < 20; j += 1) {
            document.querySelector('#target' + 'x'.repeat(64 * j));
          }
        });
      });
      observer.observe(target);
      observers.push(observer);
    }
    await testing.nextFrame();
    for (const observer of observers) {
      observer.disconnect();
    }

    state.resolve();
    await state.done(() => {
      testing.expectEqual('0,1,2,3', calls.join(','));
    });
  }
</script>
