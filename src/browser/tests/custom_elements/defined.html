<!DOCTYPE html>
<meta name=lp-mode content=test>
<body>
<script src="../testing.js"></script>

<script id="not_custom">
  {
    testing.expectEqual(true, document.createElement('div').matches(':defined'));
    testing.expectEqual(true, document.createElement('font-face').matches(':defined'));
    testing.expectEqual(true, document.createElementNS('http://www.w3.org/2000/svg', 'x-svg').matches(':defined'));
    testing.expectEqual(false, document.createElement('x-never-defined').matches(':defined'));
  }
</script>

<script id="disconnected_stays_undefined">
  {
    const el = document.createElement('x-defined-late');
    customElements.define('x-defined-late', class extends HTMLElement {});
    testing.expectEqual(false, el.matches(':defined'));

    document.body.appendChild(el);
    testing.expectEqual(true, el.matches(':defined'));
    el.remove();
    testing.expectEqual(true, el.matches(':defined'));
  }
</script>

<script id="upgrade_api">
  {
    const el = document.createElement('x-defined-upgrade');
    customElements.define('x-defined-upgrade', class extends HTMLElement {});
    testing.expectEqual(false, el.matches(':defined'));
    customElements.upgrade(el);
    testing.expectEqual(true, el.matches(':defined'));
  }
</script>

<script id="precustomized_during_upgrade">
  {
    const el = document.createElement('x-defined-pre');
    document.body.appendChild(el);
    let during = null;
    customElements.define('x-defined-pre', class extends HTMLElement {
      constructor() {
        super();
        during = this.matches(':defined');
      }
    });
    testing.expectEqual(false, during);
    testing.expectEqual(true, el.matches(':defined'));
    el.remove();
  }
</script>

<script id="custom_during_construction">
  {
    let during = null;
    class XDefinedNew extends HTMLElement {
      constructor() {
        super();
        during = this.matches(':defined');
      }
    }
    customElements.define('x-defined-new', XDefinedNew);
    const el = new XDefinedNew();
    testing.expectEqual(true, during);
    testing.expectEqual(true, el.matches(':defined'));
  }
</script>

<script id="failed_upgrade">
  {
    const el = document.createElement('x-defined-fail');
    document.body.appendChild(el);
    window.onerror = () => true;
    customElements.define('x-defined-fail', class extends HTMLElement {
      constructor() {
        super();
        throw new Error('nope');
      }
    });
    window.onerror = null;
    testing.expectEqual(false, el.matches(':defined'));
    el.remove();
  }
</script>

<style>
  x-defined-styled:not(:defined) { display: none; }
</style>
<script id="visibility_follows_upgrade">
  {
    const el = document.createElement('x-defined-styled');
    el.textContent = 'hi';
    document.body.appendChild(el);
    testing.expectEqual(false, el.checkVisibility());

    let during = null;
    customElements.define('x-defined-styled', class extends HTMLElement {
      constructor() {
        super();
        during = this.checkVisibility();
      }
    });
    testing.expectEqual(false, during);
    testing.expectEqual(true, el.checkVisibility());
    el.remove();
  }
</script>
