<!doctype html>
<html lang="en"><head><title>AX ARIA states</title></head><body>
<button aria-label="Expanded details" aria-expanded="true">Details</button>
<button aria-label="Collapsed details" aria-expanded="false">Details</button>
<button aria-label="Invalid details" aria-expanded="sometimes">Details</button>
<div role="checkbox" aria-checked="mixed" tabindex="0">Mixed terms</div>
<div role="checkbox" aria-checked="true" tabindex="-1">Checked terms</div>
<div role="checkbox" aria-checked="false">Unfocusable terms</div>
<div role="checkbox" aria-checked="garbage" tabindex="xyz">Invalid state</div>
<input type="checkbox" role="checkbox" checked aria-checked="true" aria-label="Native terms">
<div role="checkbox" aria-checked="mixed" tabindex="0" inert>Inert terms</div>
<div role="checkbox" aria-checked="mixed" tabindex="0" hidden>Hidden terms</div>
<button aria-label="Uppercase expanded" aria-expanded="TRUE">Uppercase</button>
<button aria-label="Uppercase collapsed" aria-expanded="FALSE">Uppercase</button>
<div aria-label="Generic expanded" aria-expanded="true" tabindex="0">Generic</div>
<div role="checkbox" aria-label="Uppercase mixed" aria-checked="MIXED" tabindex="0">Mixed uppercase</div>
<div role="checkbox" aria-label="Absent checked" tabindex="0">Absent</div>
<div role="switch" aria-checked="TRUE" tabindex="0">Switch checked</div>
<div role="menuitemcheckbox" aria-checked="true" tabindex="0">Menu checkbox checked</div>
<div role="radio" aria-checked="FALSE" tabindex="0">Radio unchecked</div>
<div role="menuitemradio" aria-checked="true" tabindex="0">Menu radio checked</div>
<a role="button" aria-label="Custom anchor" aria-expanded="true" tabindex="0">Anchor widget</a>
<img role="button" aria-label="Custom image" aria-expanded="true" tabindex="0" alt="Image widget">
</body></html>
