<!doctype html>
<body style="height:40000px;width:4000px">
<script>
  // Put #target well below the viewport. The faux layout advances 5px per
  // node, so 2000 hidden pads push it past 10000px — beyond any test viewport
  // height. Hidden pads keep the horizontal position at 0 (the horizontal
  // position skips display:none siblings).
  for (let i = 0; i < 2000; i++) {
    const pad = document.createElement('div');
    pad.style.display = 'none';
    document.body.appendChild(pad);
  }
  const target = document.createElement('div');
  target.id = 'target';
  document.body.appendChild(target);
</script>
</body>
