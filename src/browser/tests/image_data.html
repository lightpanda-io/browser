<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="testing.js"></script>

<script id=constructor-basic>
  {
    const img = new ImageData(10, 20);
    testing.expectEqual(10, img.width);
    testing.expectEqual(20, img.height);
    testing.expectEqual("srgb", img.colorSpace);
    testing.expectEqual("rgba-unorm8", img.pixelFormat);
  }
</script>

<script id=data-property>
  {
    const img = new ImageData(2, 3);
    const data = img.data;
    testing.expectEqual(true, data instanceof Uint8ClampedArray);
    // 2 * 3 * 4 (RGBA) = 24 bytes
    testing.expectEqual(24, data.length);
  }
</script>

<script id=data-initialized-to-zero>
  {
    const img = new ImageData(2, 2);
    const data = img.data;
    for (let i = 0; i < data.length; i++) {
      testing.expectEqual(0, data[i]);
    }
  }
</script>

<script id=data-mutability>
  {
    const img = new ImageData(1, 1);
    const data = img.data;
    // Set pixel to red (RGBA)
    data[0] = 255;
    data[1] = 0;
    data[2] = 0;
    data[3] = 255;

    // Read back through the same accessor
    const data2 = img.data;
    testing.expectEqual(255, data2[0]);
    testing.expectEqual(0, data2[1]);
    testing.expectEqual(0, data2[2]);
    testing.expectEqual(255, data2[3]);
  }
</script>

<script id=constructor-with-settings>
  {
    const img = new ImageData(5, 5, { colorSpace: "srgb" });
    testing.expectEqual(5, img.width);
    testing.expectEqual(5, img.height);
    testing.expectEqual("srgb", img.colorSpace);
  }
</script>

</script>

<script id=single-pixel>
  {
    const img = new ImageData(1, 1);
    testing.expectEqual(4, img.data.length);
    testing.expectEqual(1, img.width);
    testing.expectEqual(1, img.height);
  }
</script>

<script id=structured-clone>
  {
    const img = new ImageData(2, 2);
    img.data[0] = 42;
    const clone = structuredClone(img);
    testing.expectEqual(2, clone.width);
    testing.expectEqual(2, clone.height);
    testing.expectEqual(42, clone.data[0]);
    clone.data[0] = 7;
    testing.expectEqual(42, img.data[0]);
  }
</script>

<script id=too-large>
  testing.expectError("IndexSizeError", () => new ImageData(2_147_483_648, 2_147_483_648));
</script>

<script id=constructor-with-data>
  {
    const arr = new Uint8ClampedArray(3 * 2 * 4);
    const img = new ImageData(arr, 3, 2);
    testing.expectEqual(3, img.width);
    testing.expectEqual(2, img.height);
    // wraps the caller's array, not a copy
    testing.expectEqual(true, img.data === arr);
    img.data[0] = 7;
    testing.expectEqual(7, arr[0]);

    // height is derived when omitted
    const derived = new ImageData(arr, 3);
    testing.expectEqual(2, derived.height);
    testing.diverges("Chrome converts an explicit undefined height to 0 when settings follow", () => {
      testing.expectEqual(2, new ImageData(arr, 3, undefined, { colorSpace: "srgb" }).height);
    });

    testing.expectEqual(2, ImageData.length);
  }
</script>

<script id=constructor-with-data-errors>
  {
    const arr = new Uint8ClampedArray(3 * 2 * 4);
    const expectError = (name, fn) => testing.withError((err) => testing.expectEqual(name, err.name), fn);

    expectError('IndexSizeError', () => new ImageData(arr, 3, 3));
    expectError('IndexSizeError', () => new ImageData(arr, 4));
    expectError('IndexSizeError', () => new ImageData(arr, 0));
    expectError('InvalidStateError', () => new ImageData(new Uint8ClampedArray(0), 1));
    expectError('InvalidStateError', () => new ImageData(new Uint8ClampedArray(5), 1));
    // not an ImageDataArray: the (sw, sh) overload, with sw = 0
    expectError('IndexSizeError', () => new ImageData(new Uint8Array(4), 1));
    expectError('TypeError', () => new ImageData(arr, 3, 2, { colorSpace: "nope" }));
    expectError('TypeError', () => new ImageData(10));
  }
</script>
