<script id=getRandomValues>
  function isRandom(ta) {
    let uniq = new Set(Array.from(ta));
    testing.expectEqual(true, (uniq.size / ta.length) * 100 > 0.7)
  }
  {
    let tu8a = new Uint8Array(100)
    testing.expectEqual(tu8a, crypto.getRandomValues(tu8a))
    isRandom(tu8a)

    let ti8a = new Int8Array(100)
    testing.expectEqual(ti8a, crypto.getRandomValues(ti8a))
    isRandom(ti8a)

    let tu8ca = new Uint8ClampedArray(100)
    testing.expectEqual(tu8ca, crypto.getRandomValues(tu8ca))
    isRandom(tu8ca)
  }

  {
    let tu16a = new Uint16Array(100)
    testing.expectEqual(tu16a, crypto.getRandomValues(tu16a))
    isRandom(tu16a)

    let ti16a = new Int16Array(100)
    testing.expectEqual(ti16a, crypto.getRandomValues(ti16a))
    isRandom(ti16a)
  }

  {
    let tu32a = new Uint32Array(100)
    testing.expectEqual(tu32a, crypto.getRandomValues(tu32a))
    isRandom(tu32a)

    let ti32a = new Int32Array(100)
    testing.expectEqual(ti32a, crypto.getRandomValues(ti32a))
    isRandom(ti32a)
  }

  {
    let tu64a = new BigUint64Array(100)
    testing.expectEqual(tu64a, crypto.getRandomValues(tu64a))
    isRandom(tu64a)

    let ti64a = new BigInt64Array(100)
    testing.expectEqual(ti64a, crypto.getRandomValues(ti64a))
    isRandom(ti64a)
  }
</script>

<script id=sign-and-verify-hmac type=module>
  const state = await testing.async();
  let key = await crypto.subtle.generateKey(
    {
      name: "HMAC",
      hash: { name: "SHA-512" },
    },
    true,
    ["sign", "verify"],
  );

  const raw = await crypto.subtle.exportKey("raw", key);

  const encoder = new TextEncoder();

  const signature = await crypto.subtle.sign(
    "HMAC",
    key,
    encoder.encode("Hello, world!")
  );

  const result = await window.crypto.subtle.verify(
    { name: "HMAC" },
    key,
    signature,
    encoder.encode("Hello, world!")
  );

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, key instanceof CryptoKey);
    testing.expectEqual(128, raw.byteLength);
    testing.expectEqual(true, signature instanceof ArrayBuffer);
    testing.expectEqual(true, result);
  });
</script>

<script id=derive-shared-key-x25519 type=module>
  const state = await testing.async();
  const { privateKey, publicKey } = await crypto.subtle.generateKey(
    { name: "X25519" },
    true,
    ["deriveBits"],
  );

  const sharedKey = await crypto.subtle.deriveBits(
    {
      name: "X25519",
      public: publicKey,
    },
    privateKey,
    128,
  );

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, privateKey instanceof CryptoKey);
    testing.expectEqual(true, publicKey instanceof CryptoKey);
    testing.expectEqual(16, sharedKey.byteLength);
  });
</script>

<script id=deriveBits-length type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const key = await subtle.importKey("raw", new TextEncoder().encode("password"), "PBKDF2", false, ["deriveBits"]);
  const pbkdf2 = (iterations) => ({ name: "PBKDF2", hash: "SHA-256", salt: new Uint8Array(16), iterations });
  const derive = (length, iterations = 1000) => errorName(() => subtle.deriveBits(pbkdf2(iterations), key, length));

  const results = {
    ok: await derive(256),
    nullLength: await derive(null),
    // [EnforceRange]: -8 used to wrap to 2^32 - 8 bits.
    nan: await derive(NaN),
    infinity: await derive(Infinity),
    negative: await derive(-8),
    tooLarge: await derive(2 ** 32 + 8),
    // Valid lengths whose cost (blocks * iterations) is over the PBKDF2 limit.
    hugeLength: await derive(2 ** 32 - 8, 100000),
    hugeIterations: await derive(256, 2 ** 24 + 1),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual(null, results.ok);
    testing.expectEqual("OperationError", results.nullLength);
    for (const name of ["nan", "infinity", "negative", "tooLarge"]) {
      testing.expectEqual(`${name}: TypeError`, `${name}: ${results[name]}`);
    }
    testing.expectEqual("OperationError", results.hugeLength);
    testing.expectEqual("OperationError", results.hugeIterations);
  });
</script>

<script id=rsa-oaep-roundtrip type=module>
  const state = await testing.async();
  const { privateKey, publicKey } = await crypto.subtle.generateKey(
    {
      name: "RSA-OAEP",
      modulusLength: 2048,
      publicExponent: new Uint8Array([1, 0, 1]),
      hash: "SHA-256",
    },
    true,
    ["encrypt", "decrypt"],
  );

  const plaintext = new TextEncoder().encode("lightpanda rsa-oaep");
  const ciphertext = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, publicKey, plaintext);
  const decrypted = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, privateKey, ciphertext);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, privateKey instanceof CryptoKey);
    testing.expectEqual(true, publicKey instanceof CryptoKey);
    testing.expectEqual(2048, publicKey.algorithm.modulusLength);
    testing.expectEqual("1,0,1", publicKey.algorithm.publicExponent.join(","));
    testing.expectEqual(256, ciphertext.byteLength);
    testing.expectEqual("lightpanda rsa-oaep", new TextDecoder().decode(decrypted));
  });
</script>

<script id=rsa-oaep-import type=module>
  const state = await testing.async();
  // Encrypt with the imported public key, decrypt with the private.
  const { spki, pkcs8 } = rsaTestKey;
  const publicKey = await crypto.subtle.importKey("spki", spki, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
  const privateKey = await crypto.subtle.importKey("pkcs8", pkcs8, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]);
  // Hash names match case-insensitively and are reported in canonical form.
  const lowerKey = await crypto.subtle.importKey("spki", spki, { name: "RSA-OAEP", hash: "sha-256" }, false, ["encrypt"]);

  const message = new TextEncoder().encode("imported key path");
  const ciphertext = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, publicKey, message);
  const decrypted = await crypto.subtle.decrypt({ name: "RSA-OAEP" }, privateKey, ciphertext);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(2048, publicKey.algorithm.modulusLength);
    testing.expectEqual("imported key path", new TextDecoder().decode(decrypted));
    testing.expectEqual("1,0,1", publicKey.algorithm.publicExponent.join(","));
    testing.expectEqual("SHA-256", lowerKey.algorithm.hash.name);
  });
</script>

<script id=rsa-oaep-errors type=module>
  const state = await testing.async();
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const gen = (hash, usages) => crypto.subtle.generateKey(
    { name: "RSA-OAEP", modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]), hash },
    true,
    usages,
  );
  const msg = new TextEncoder().encode("hi");

  // A lowercase hash still produces a usable key.
  const k = await gen("sha-256", ["encrypt", "decrypt"]);
  const ciphertext = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, k.publicKey, msg);

  // The label is part of the ciphertext: it must match on decrypt.
  const label = new Uint8Array([1, 2, 3]);
  const labeled = await crypto.subtle.encrypt({ name: "RSA-OAEP", label }, k.publicKey, msg);
  const unlabeled = await crypto.subtle.decrypt({ name: "RSA-OAEP", label }, k.privateKey, labeled);
  const labelMismatch = await errorName(() => crypto.subtle.decrypt({ name: "RSA-OAEP" }, k.privateKey, labeled));

  // The operation's algorithm must match the key's.
  const aesNameOnRsa = await errorName(() => crypto.subtle.encrypt({ name: "AES-GCM", iv: new Uint8Array(12) }, k.publicKey, msg));
  const aes = await crypto.subtle.generateKey({ name: "AES-GCM", length: 128 }, true, ["encrypt"]);
  const rsaNameOnAes = await errorName(() => crypto.subtle.encrypt({ name: "RSA-OAEP" }, aes, msg));

  // A pair whose private key would have no usages is rejected.
  const emptyPrivate = await errorName(() => gen("SHA-256", ["encrypt"]));
  // Generation blocks the main thread, so the modulus is capped at 4096 bits.
  const tooLarge = await errorName(() => crypto.subtle.generateKey(
    { name: "RSA-OAEP", modulusLength: 8192, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
    true,
    ["encrypt", "decrypt"],
  ));
  const rawExport = await errorName(() => crypto.subtle.exportKey("raw", k.publicKey));

  state.resolve();
  await state.done(() => {
    testing.expectEqual("SHA-256", k.publicKey.algorithm.hash.name);
    testing.expectEqual(128, ciphertext.byteLength);
    testing.expectEqual("hi", new TextDecoder().decode(unlabeled));
    testing.expectEqual("OperationError", labelMismatch);
    testing.expectEqual("InvalidAccessError", aesNameOnRsa);
    testing.expectEqual("InvalidAccessError", rsaNameOnAes);
    testing.expectEqual("SyntaxError", emptyPrivate);
    testing.expectEqual("OperationError", tooLarge);
    testing.expectEqual("NotSupportedError", rawExport);
  });
</script>

<script id=rsa-oaep-export type=module>
  const state = await testing.async();
  const algo = { name: "RSA-OAEP", hash: "SHA-256" };
  const { privateKey, publicKey } = await crypto.subtle.generateKey(
    { ...algo, modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) },
    true,
    ["encrypt", "decrypt"],
  );
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const msg = new TextEncoder().encode("exported key path");
  const roundTrip = async (pub, priv) =>
    new TextDecoder().decode(await crypto.subtle.decrypt(algo, priv, await crypto.subtle.encrypt(algo, pub, msg)));

  // DER: spki and pkcs8 survive an import/export round trip byte for byte.
  const spki = await crypto.subtle.exportKey("spki", publicKey);
  const pkcs8 = await crypto.subtle.exportKey("pkcs8", privateKey);
  const spkiKey = await crypto.subtle.importKey("spki", spki, algo, true, ["encrypt"]);
  const pkcs8Key = await crypto.subtle.importKey("pkcs8", pkcs8, algo, true, ["decrypt"]);
  const spkiAgain = await crypto.subtle.exportKey("spki", spkiKey);
  const pkcs8Again = await crypto.subtle.exportKey("pkcs8", pkcs8Key);

  // JWK: the public members on both halves, the private ones on the private key.
  const publicJwk = await crypto.subtle.exportKey("jwk", publicKey);
  const privateJwk = await crypto.subtle.exportKey("jwk", privateKey);
  const jwkPublicKey = await crypto.subtle.importKey("jwk", publicJwk, algo, true, ["encrypt"]);
  const jwkPrivateKey = await crypto.subtle.importKey("jwk", privateJwk, algo, true, ["decrypt"]);
  const privateJwkAgain = await crypto.subtle.exportKey("jwk", jwkPrivateKey);

  // A JWK without `alg`, `ext` or `key_ops` imports too; SHA-1 is plain "RSA-OAEP".
  const bare = await crypto.subtle.importKey("jwk", { kty: "RSA", n: publicJwk.n, e: publicJwk.e }, { name: "RSA-OAEP", hash: "SHA-1" }, true, ["encrypt"]);
  const bareJwk = await crypto.subtle.exportKey("jwk", bare);
  // Each hash has its own `alg`, which a JWK import accepts back.
  const algs = [];
  for (const hash of ["SHA-1", "SHA-256", "SHA-384", "SHA-512"]) {
    const key = await crypto.subtle.importKey("jwk", { kty: "RSA", n: publicJwk.n, e: publicJwk.e }, { name: "RSA-OAEP", hash }, true, ["encrypt"]);
    const { alg } = await crypto.subtle.exportKey("jwk", key);
    await crypto.subtle.importKey("jwk", { kty: "RSA", n: publicJwk.n, e: publicJwk.e, alg }, { name: "RSA-OAEP", hash }, true, ["encrypt"]);
    algs.push(alg);
  }

  const results = {
    viaSpki: await roundTrip(spkiKey, privateKey),
    viaPkcs8: await roundTrip(publicKey, pkcs8Key),
    viaJwk: await roundTrip(jwkPublicKey, jwkPrivateKey),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual(hex(spki), hex(spkiAgain));
    testing.expectEqual(hex(pkcs8), hex(pkcs8Again));
    testing.expectEqual("public", spkiKey.type);
    testing.expectEqual("private", pkcs8Key.type);
    testing.expectEqual("RSA,RSA-OAEP-256,AQAB,true", [publicJwk.kty, publicJwk.alg, publicJwk.e, publicJwk.ext].join(","));
    testing.expectEqual("encrypt", publicJwk.key_ops.join(","));
    testing.expectEqual(false, "d" in publicJwk);
    testing.expectEqual("decrypt", privateJwk.key_ops.join(","));
    testing.expectEqual(publicJwk.n, privateJwk.n);
    testing.expectEqual(6, ["d", "dp", "dq", "p", "q", "qi"].filter((m) => typeof privateJwk[m] === "string" && privateJwk[m].length > 0).length);
    testing.expectEqual(JSON.stringify(privateJwk), JSON.stringify(privateJwkAgain));
    testing.expectEqual("private", jwkPrivateKey.type);
    testing.expectEqual(1024, jwkPrivateKey.algorithm.modulusLength);
    testing.expectEqual("1,0,1", jwkPrivateKey.algorithm.publicExponent.join(","));
    testing.expectEqual("exported key path", results.viaSpki);
    testing.expectEqual("exported key path", results.viaPkcs8);
    testing.expectEqual("exported key path", results.viaJwk);
    testing.expectEqual("RSA-OAEP", bareJwk.alg);
    testing.expectEqual("SHA-1", bare.algorithm.hash.name);
    testing.expectEqual("RSA-OAEP,RSA-OAEP-256,RSA-OAEP-384,RSA-OAEP-512", algs.join(","));
  });
</script>

<script id=rsa-oaep-jwk-errors type=module>
  const state = await testing.async();
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const algo = { name: "RSA-OAEP", hash: "SHA-256" };
  const gen = (extractable) => crypto.subtle.generateKey(
    { ...algo, modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) },
    extractable,
    ["encrypt", "decrypt"],
  );
  const { privateKey, publicKey } = await gen(true);
  const locked = await gen(false);
  const pub = await crypto.subtle.exportKey("jwk", publicKey);
  const priv = await crypto.subtle.exportKey("jwk", privateKey);
  const importPublic = (jwk, extractable = true, usages = ["encrypt"]) =>
    errorName(() => crypto.subtle.importKey("jwk", jwk, algo, extractable, usages));
  const importPrivate = (jwk, usages = ["decrypt"]) =>
    errorName(() => crypto.subtle.importKey("jwk", jwk, algo, true, usages));
  // base64url of the member's bytes with a 0x00 octet in front.
  const zeroPrefixed = (b64url) => {
    const raw = atob(b64url.replace(/-/g, "+").replace(/_/g, "/"));
    return btoa("\0" + raw).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  };
  const { qi, ...withoutQi } = priv;
  const { kty, ...withoutKty } = pub;
  // Without key_ops, so the usage check (SyntaxError) is the one that fails.
  const { key_ops: _publicOps, ...pubNoOps } = pub;
  const { key_ops: _privateOps, ...privNoOps } = priv;

  const results = {
    // exportKey: each DER format belongs to one half; a non-extractable key exports nothing.
    spkiOfPrivate: await errorName(() => crypto.subtle.exportKey("spki", privateKey)),
    pkcs8OfPublic: await errorName(() => crypto.subtle.exportKey("pkcs8", publicKey)),
    notExtractable: await errorName(() => crypto.subtle.exportKey("jwk", locked.privateKey)),
    // importKey: the format and the key data must agree.
    jwkFromBytes: await errorName(() => crypto.subtle.importKey("jwk", new Uint8Array(8), algo, true, ["encrypt"])),
    spkiFromJwk: await errorName(() => crypto.subtle.importKey("spki", pub, algo, true, ["encrypt"])),
    // The usages must fit the half the JWK describes (`d` makes it private).
    privateForEncrypt: await importPrivate(privNoOps, ["encrypt"]),
    publicForDecrypt: await importPublic(pubNoOps, true, ["decrypt"]),
    // kty, use and alg are matched case-sensitively; alg must name the requested hash.
    ktyMissing: await importPublic(withoutKty),
    ktyEc: await importPublic({ ...pub, kty: "EC" }),
    ktyLower: await importPublic({ ...pub, kty: "rsa" }),
    useSig: await importPublic({ ...pub, use: "sig" }),
    algOtherHash: await importPublic({ ...pub, alg: "RSA-OAEP" }),
    algLower: await importPublic({ ...pub, alg: "rsa-oaep-256" }),
    algUnknown: await importPublic({ ...pub, alg: "RS256" }),
    // ext and key_ops can only narrow what is asked for.
    extFalse: await importPublic({ ...pub, ext: false }),
    extFalseLocked: await importPublic({ ...pub, ext: false }, false),
    keyOpsMissing: await importPublic({ ...pub, key_ops: ["wrapKey"] }),
    keyOpsDuplicate: await importPublic({ ...pub, key_ops: ["encrypt", "encrypt"] }),
    keyOpsWider: await importPublic({ ...pub, key_ops: ["encrypt", "wrapKey"] }),
    // The members must be present, minimal, well-formed, and make a valid key.
    missingN: await importPublic({ kty: "RSA", e: pub.e }),
    emptyE: await importPublic({ ...pub, e: "" }),
    leadingZero: await importPublic({ ...pub, n: zeroPrefixed(pub.n) }),
    notBase64: await importPublic({ ...pub, n: "!!!" }),
    missingQi: await importPrivate(withoutQi),
    wrongD: await importPrivate({ ...priv, d: priv.dp }),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual("InvalidAccessError", results.spkiOfPrivate);
    testing.expectEqual("InvalidAccessError", results.pkcs8OfPublic);
    testing.expectEqual("InvalidAccessError", results.notExtractable);
    testing.expectEqual("TypeError", results.jwkFromBytes);
    testing.expectEqual("TypeError", results.spkiFromJwk);
    testing.expectEqual("SyntaxError", results.privateForEncrypt);
    testing.expectEqual("SyntaxError", results.publicForDecrypt);
    testing.expectEqual("DataError", results.ktyMissing);
    testing.expectEqual("DataError", results.ktyEc);
    testing.expectEqual("DataError", results.ktyLower);
    testing.expectEqual("DataError", results.useSig);
    testing.expectEqual("DataError", results.algOtherHash);
    testing.expectEqual("DataError", results.algLower);
    testing.expectEqual("DataError", results.algUnknown);
    testing.expectEqual("DataError", results.extFalse);
    testing.expectEqual(null, results.extFalseLocked);
    testing.expectEqual("DataError", results.keyOpsMissing);
    testing.expectEqual("DataError", results.keyOpsDuplicate);

<script id=rsassa-sign-verify type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const algo = { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" };
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const data = new TextEncoder().encode("lightpanda rsassa");

  // PKCS #1 v1.5 signatures are deterministic: this key signs `data` with
  // SHA-256 into exactly what OpenSSL (and Chrome) produce.
  const expected = "YxvJD9uFamAy2GThpElvfytCcmRnlmcCl36q5MwolJh+cjT0rsSPoWcNU5u/fPEaZ4XNfnIsTKPktylb2tDmflEjpSjm83Fbcgcky2whEpfrdFoUK2Yu+WaXQBSAxGA6pcx7Gi+KCYvBdmVu81EVLFzNk67uwWyZLYLZYpq884b6rLFVWGCJz463JnzM20SmxecH+pxMotoN4obkAqc3X75Me5PRbgboF6i2nFmC0pUbdolKv+oF4ndsiUlbTOj7p7JY0RM5tube/ZZDi1cGLBNib3aSPEFUDAt7JKMZrZTfXgkZ780QMw/C5rwhRZupdeSUP9ChTNBLDxb0NKFuEQ==";
  const privateKey = await subtle.importKey("pkcs8", rsaTestKey.pkcs8, algo, false, ["sign"]);
  const publicKey = await subtle.importKey("spki", rsaTestKey.spki, algo, false, ["verify"]);
  const signature = await subtle.sign("RSASSA-PKCS1-v1_5", privateKey, data);
  // The name matches case-insensitively, and the hash is the key's.
  const lowerName = await subtle.sign({ name: "rsassa-pkcs1-v1_5" }, privateKey, data);
  const sha512Key = await subtle.importKey("pkcs8", rsaTestKey.pkcs8, { ...algo, hash: "sha-512" }, false, ["sign"]);
  const sha512Public = await subtle.importKey("spki", rsaTestKey.spki, { ...algo, hash: "SHA-512" }, false, ["verify"]);
  const sha512Signature = await subtle.sign(algo, sha512Key, data);

  const tampered = new Uint8Array(signature.slice(0));
  tampered[10] ^= 1;
  const results = {
    valid: await subtle.verify(algo, publicKey, signature, data),
    lowerName: await subtle.verify({ name: "rsassa-pkcs1-v1_5" }, publicKey, signature, data),
    otherData: await subtle.verify(algo, publicKey, signature, new TextEncoder().encode("lightpanda rsassb")),
    tampered: await subtle.verify(algo, publicKey, tampered, data),
    // A signature of the wrong length is invalid, not an error.
    truncated: await subtle.verify(algo, publicKey, signature.slice(0, 255), data),
    empty: await subtle.verify(algo, publicKey, new Uint8Array(0), data),
    tooLong: await subtle.verify(algo, publicKey, new Uint8Array(512), data),
    // Each key verifies with its own hash only.
    sha512Valid: await subtle.verify(algo, sha512Public, sha512Signature, data),
    sha512WithSha256: await subtle.verify(algo, sha512Public, signature, data),
  };

  // A generated pair: the private half signs, the public half verifies.
  const pair = await subtle.generateKey(
    { ...algo, modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) },
    true,
    ["sign", "verify"],
  );
  const generatedSignature = await subtle.sign(algo, pair.privateKey, data);
  const generatedValid = await subtle.verify(algo, pair.publicKey, generatedSignature, data);
  // Only "sign" asked for: the public key has no usages.
  const signOnly = await subtle.generateKey(
    { ...algo, modulusLength: 1024, publicExponent: new Uint8Array([3]) },
    true,
    ["sign"],
  );

  state.resolve();
  await state.done(() => {
    testing.expectEqual(expected, b64(signature));
    testing.expectEqual(expected, b64(lowerName));
    testing.expectEqual(true, results.valid);
    testing.expectEqual(true, results.lowerName);
    testing.expectEqual(false, results.otherData);
    testing.expectEqual(false, results.tampered);
    testing.expectEqual(false, results.truncated);
    testing.expectEqual(false, results.empty);
    testing.expectEqual(false, results.tooLong);
    testing.expectEqual(true, results.sha512Valid);
    testing.expectEqual(false, results.sha512WithSha256);
    testing.expectEqual(false, b64(sha512Signature) === expected);
    testing.expectEqual("RSASSA-PKCS1-v1_5", privateKey.algorithm.name);
    testing.expectEqual("SHA-512", sha512Key.algorithm.hash.name);
    testing.expectEqual(2048, publicKey.algorithm.modulusLength);
    testing.expectEqual(128, generatedSignature.byteLength);
    testing.expectEqual(true, generatedValid);
    testing.expectEqual("RSASSA-PKCS1-v1_5", pair.publicKey.algorithm.name);
    testing.expectEqual("SHA-256", pair.publicKey.algorithm.hash.name);
    testing.expectEqual("sign", pair.privateKey.usages.join(","));
    testing.expectEqual("verify", pair.publicKey.usages.join(","));
    testing.expectEqual("3", signOnly.publicKey.algorithm.publicExponent.join(","));
    testing.expectEqual("", signOnly.publicKey.usages.join(","));
  });
</script>

<script id=rsassa-export type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const algo = { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" };
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const data = new TextEncoder().encode("exported key path");
  const { privateKey, publicKey } = await subtle.generateKey(
    { ...algo, modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) },
    true,
    ["sign", "verify"],
  );
  const roundTrip = async (priv, pub) => subtle.verify(algo, pub, await subtle.sign(algo, priv, data), data);

  // DER: spki and pkcs8 survive an import/export round trip byte for byte.
  const spki = await subtle.exportKey("spki", publicKey);
  const pkcs8 = await subtle.exportKey("pkcs8", privateKey);
  const spkiKey = await subtle.importKey("spki", spki, algo, true, ["verify"]);
  const pkcs8Key = await subtle.importKey("pkcs8", pkcs8, algo, true, ["sign"]);

  // JWK: "sig" keys whose `alg` is RS<bits of the hash>.
  const publicJwk = await subtle.exportKey("jwk", publicKey);
  const privateJwk = await subtle.exportKey("jwk", privateKey);
  const jwkPublicKey = await subtle.importKey("jwk", publicJwk, algo, true, ["verify"]);
  const jwkPrivateKey = await subtle.importKey("jwk", privateJwk, algo, true, ["sign"]);
  const withUse = await subtle.importKey("jwk", { ...publicJwk, use: "sig" }, algo, true, ["verify"]);
  const algs = [];
  for (const hash of ["SHA-1", "SHA-256", "SHA-384", "SHA-512"]) {
    const key = await subtle.importKey("jwk", { kty: "RSA", n: publicJwk.n, e: publicJwk.e }, { ...algo, hash }, true, ["verify"]);
    const { alg } = await subtle.exportKey("jwk", key);
    await subtle.importKey("jwk", { kty: "RSA", n: publicJwk.n, e: publicJwk.e, alg }, { ...algo, hash }, true, ["verify"]);
    algs.push(alg);
  }

  // A key travels as a wrapped JWK and still signs once unwrapped.
  const wrapper = await subtle.generateKey({ name: "AES-GCM", length: 128 }, true, ["wrapKey", "unwrapKey"]);
  const gcm = { name: "AES-GCM", iv: new Uint8Array(12) };
  const wrapped = await subtle.wrapKey("jwk", privateKey, wrapper, gcm);
  const unwrapped = await subtle.unwrapKey("jwk", wrapped, wrapper, gcm, algo, false, ["sign"]);

  const results = {
    spkiAgain: hex(await subtle.exportKey("spki", spkiKey)),
    pkcs8Again: hex(await subtle.exportKey("pkcs8", pkcs8Key)),
    privateJwkAgain: JSON.stringify(await subtle.exportKey("jwk", jwkPrivateKey)),
    viaSpki: await roundTrip(privateKey, spkiKey),
    viaPkcs8: await roundTrip(pkcs8Key, publicKey),
    viaJwk: await roundTrip(jwkPrivateKey, jwkPublicKey),
    viaUse: await roundTrip(privateKey, withUse),
    viaUnwrap: await roundTrip(unwrapped, publicKey),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual(hex(spki), results.spkiAgain);
    testing.expectEqual(hex(pkcs8), results.pkcs8Again);
    testing.expectEqual("RSA,RS256,AQAB,true", [publicJwk.kty, publicJwk.alg, publicJwk.e, publicJwk.ext].join(","));
    testing.expectEqual("verify", publicJwk.key_ops.join(","));
    testing.expectEqual("sign", privateJwk.key_ops.join(","));
    testing.expectEqual(JSON.stringify(privateJwk), results.privateJwkAgain);
    testing.expectEqual("RS1,RS256,RS384,RS512", algs.join(","));
    testing.expectEqual("RSASSA-PKCS1-v1_5", jwkPrivateKey.algorithm.name);
    testing.expectEqual("RSASSA-PKCS1-v1_5", unwrapped.algorithm.name);
    testing.expectEqual(true, results.viaSpki);
    testing.expectEqual(true, results.viaPkcs8);
    testing.expectEqual(true, results.viaJwk);
    testing.expectEqual(true, results.viaUse);
    testing.expectEqual(true, results.viaUnwrap);
  });
</script>

<script id=rsassa-errors type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const algo = { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" };
  const data = new TextEncoder().encode("hi");
  const gen = (name, usages) => subtle.generateKey(
    { name, hash: "SHA-256", modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) },
    true,
    usages,
  );
  const rsassa = await gen("RSASSA-PKCS1-v1_5", ["sign", "verify"]);
  const oaep = await gen("RSA-OAEP", ["encrypt", "decrypt", "wrapKey", "unwrapKey"]);
  const hmac = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, true, ["sign", "verify"]);
  const signature = await subtle.sign(algo, rsassa.privateKey, data);
  // A 512-bit modulus is too short for a SHA-512 DigestInfo.
  const small = await subtle.generateKey(
    { name: "RSASSA-PKCS1-v1_5", hash: "SHA-512", modulusLength: 512, publicExponent: new Uint8Array([1, 0, 1]) },
    true,
    ["sign"],
  );
  const publicJwk = await subtle.exportKey("jwk", rsassa.publicKey);
  const { key_ops: _publicOps, ...pubNoOps } = publicJwk;
  const importPublic = (jwk, usages = ["verify"]) => errorName(() => subtle.importKey("jwk", jwk, algo, true, usages));

  const results = {
    // Each half does its own operation only.
    signWithPublic: await errorName(() => subtle.sign(algo, rsassa.publicKey, data)),
    verifyWithPrivate: await errorName(() => subtle.verify(algo, rsassa.privateKey, signature, data)),
    // A signature libcrypto can't produce.
    tooSmall: await errorName(() => subtle.sign("RSASSA-PKCS1-v1_5", small.privateKey, data)),
    // The algorithm must be one that signs, and the key's own.
    unknownName: await errorName(() => subtle.sign("RSA", rsassa.privateKey, data)),
    oaepName: await errorName(() => subtle.sign("RSA-OAEP", oaep.privateKey, data)),
    hmacNameOnRsa: await errorName(() => subtle.sign("HMAC", rsassa.privateKey, data)),
    rsaNameOnHmac: await errorName(() => subtle.sign(algo, hmac, data)),
    rsaVerifyOnHmac: await errorName(() => subtle.verify(algo, hmac, signature, data)),
    rsaNameOnOaep: await errorName(() => subtle.sign(algo, oaep.privateKey, data)),
    // RSASSA-PKCS1-v1_5 keys don't encrypt or wrap, and RSA-OAEP keys don't sign.
    encryptName: await errorName(() => subtle.encrypt(algo, rsassa.publicKey, data)),
    oaepOnRsassa: await errorName(() => subtle.encrypt({ name: "RSA-OAEP" }, rsassa.publicKey, data)),
    wrapName: await errorName(() => subtle.wrapKey("jwk", hmac, rsassa.publicKey, algo)),
    // Import: spki keys verify, pkcs8 keys sign, and a private key needs a usage.
    spkiForSign: await errorName(() => subtle.importKey("spki", rsaTestKey.spki, algo, true, ["sign"])),
    pkcs8ForVerify: await errorName(() => subtle.importKey("pkcs8", rsaTestKey.pkcs8, algo, true, ["verify"])),
    pkcs8NoUsages: await errorName(() => subtle.importKey("pkcs8", rsaTestKey.pkcs8, algo, true, [])),
    spkiNoUsages: await errorName(() => subtle.importKey("spki", rsaTestKey.spki, algo, true, [])),
    noHash: await errorName(() => subtle.importKey("spki", rsaTestKey.spki, "RSASSA-PKCS1-v1_5", true, ["verify"])),
    badHash: await errorName(() => subtle.importKey("spki", rsaTestKey.spki, { ...algo, hash: "SHA-224" }, true, ["verify"])),
    // Generation: the private key must get "sign".
    verifyOnly: await errorName(() => gen("RSASSA-PKCS1-v1_5", ["verify"])),
    // JWK: a "sig" key whose `alg` names the requested hash.
    publicForSign: await importPublic(pubNoOps, ["sign"]),
    useEnc: await importPublic({ ...publicJwk, use: "enc" }),
    algOtherHash: await importPublic({ ...publicJwk, alg: "RS384" }),
    algLower: await importPublic({ ...publicJwk, alg: "rs256" }),
    algOaep: await importPublic({ ...publicJwk, alg: "RSA-OAEP-256" }),
    algPss: await importPublic({ ...publicJwk, alg: "PS256" }),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual("InvalidAccessError", results.signWithPublic);
    testing.expectEqual("InvalidAccessError", results.verifyWithPrivate);
    testing.expectEqual("OperationError", results.tooSmall);
    testing.expectEqual("NotSupportedError", results.unknownName);
    testing.expectEqual("NotSupportedError", results.oaepName);
    testing.expectEqual("InvalidAccessError", results.hmacNameOnRsa);
    testing.expectEqual("InvalidAccessError", results.rsaNameOnHmac);
    testing.expectEqual("InvalidAccessError", results.rsaVerifyOnHmac);
    testing.expectEqual("InvalidAccessError", results.rsaNameOnOaep);
    testing.expectEqual("NotSupportedError", results.encryptName);
    testing.expectEqual("InvalidAccessError", results.oaepOnRsassa);
    testing.expectEqual("NotSupportedError", results.wrapName);
    testing.expectEqual("SyntaxError", results.spkiForSign);
    testing.expectEqual("SyntaxError", results.pkcs8ForVerify);
    testing.expectEqual("SyntaxError", results.pkcs8NoUsages);
    testing.expectEqual(null, results.spkiNoUsages);
    testing.expectEqual("TypeError", results.noHash);
    testing.expectEqual("NotSupportedError", results.badHash);
    testing.expectEqual("SyntaxError", results.verifyOnly);
    testing.expectEqual("SyntaxError", results.publicForSign);
    testing.expectEqual("DataError", results.useEnc);
    testing.expectEqual("DataError", results.algOtherHash);
    testing.expectEqual("DataError", results.algLower);
    testing.expectEqual("DataError", results.algOaep);
    testing.expectEqual("DataError", results.algPss);
  });

<script id=rsa-pss type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const algo = { name: "RSA-PSS", hash: "SHA-256" };
  const data = new TextEncoder().encode("lightpanda rsa-pss");
  const privateKey = await subtle.importKey("pkcs8", rsaTestKey.pkcs8, algo, false, ["sign"]);
  const publicKey = await subtle.importKey("spki", rsaTestKey.spki, algo, false, ["verify"]);

  // With no salt, PSS is deterministic: this is what OpenSSL (and Chrome)
  // produce for the shared test key, SHA-256 and MGF1 over SHA-256.
  const expected = "Y8BivUzQOY0aMtDqK7PaK6scH2T8i6mbTYvrO81MIcYUXmYEvVAhSgTrYTyxPEJd+KH+n0/XM08WdgV4WOwMBjwgezfKyjd21Llir//NrYitf9qlvqRbKprrQLd8rGQ5PBb41pgwkEvM3u3PAVjaeKmeHtfdVZZ59cJwe36P5X+e3aGhjnaxggjFcBk2c+amVnXMjFlkubtkjXecA0dXSdhap6Cpr4q/OajQrnLJTjrsO1kfIzpRCq0IXdx3cKADwagjv6rEoh1I2+2tsk8vsTmugWh4Crxa/IXc/M/qRdVWjZu2RA442B4tB/APpYOOCoSMRQ6qPgw2OO68l/PiXw==";
  const unsalted = await subtle.sign({ name: "RSA-PSS", saltLength: 0 }, privateKey, data);
  // A salt makes each signature different; both verify with that salt length only.
  const salted = await subtle.sign({ name: "rsa-pss", saltLength: 32 }, privateKey, data);
  const saltedAgain = await subtle.sign({ name: "RSA-PSS", saltLength: 32 }, privateKey, data);

  // Generated keys, and the JWK of each hash ("PS1", "PS256", ...).
  const pair = await subtle.generateKey(
    { ...algo, modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) },
    true,
    ["sign", "verify"],
  );
  const publicJwk = await subtle.exportKey("jwk", pair.publicKey);
  const privateJwk = await subtle.exportKey("jwk", pair.privateKey);
  const jwkPrivate = await subtle.importKey("jwk", privateJwk, algo, true, ["sign"]);
  const algs = [];
  for (const hash of ["SHA-1", "SHA-256", "SHA-384", "SHA-512"]) {
    const key = await subtle.importKey("jwk", { kty: "RSA", n: publicJwk.n, e: publicJwk.e }, { ...algo, hash }, true, ["verify"]);
    algs.push((await subtle.exportKey("jwk", key)).alg);
  }
  const pss = (saltLength) => ({ name: "RSA-PSS", saltLength });
  const generatedSignature = await subtle.sign(pss(20), jwkPrivate, data);
  const rsassa = await subtle.importKey("spki", rsaTestKey.spki, { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, false, ["verify"]);
  // Each hash also drives MGF1.
  const hashRoundTrips = [];
  for (const hash of ["SHA-1", "SHA-384", "SHA-512"]) {
    const signer = await subtle.importKey("pkcs8", rsaTestKey.pkcs8, { name: "RSA-PSS", hash }, false, ["sign"]);
    const verifier = await subtle.importKey("spki", rsaTestKey.spki, { name: "RSA-PSS", hash }, false, ["verify"]);
    const signature = await subtle.sign(pss(16), signer, data);
    hashRoundTrips.push(await subtle.verify(pss(16), verifier, signature, data) && !(await subtle.verify(pss(16), publicKey, signature, data)));
  }
  // An invalid saltLength rejects the promise rather than throwing.
  const noSaltPromise = subtle.sign("RSA-PSS", privateKey, data);
  const noSaltIsPromise = noSaltPromise instanceof Promise;
  await noSaltPromise.catch(() => {});
  const hmac = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, true, ["sign"]);

  const results = {
    unsaltedValid: await subtle.verify(pss(0), publicKey, unsalted, data),
    saltedValid: await subtle.verify(pss(32), publicKey, salted, data),
    saltedAgainValid: await subtle.verify(pss(32), publicKey, saltedAgain, data),
    wrongSaltLength: await subtle.verify(pss(48), publicKey, salted, data),
    otherData: await subtle.verify(pss(32), publicKey, salted, new TextEncoder().encode("other")),
    generatedValid: await subtle.verify(pss(20), pair.publicKey, generatedSignature, data),
    // The salt must fit the key: 2048 bits with SHA-256 leave room for 222 bytes.
    maxSalt: await errorName(() => subtle.sign(pss(222), privateKey, data)),
    saltTooLong: await errorName(() => subtle.sign(pss(223), privateKey, data)),
    longSaltVerify: await subtle.verify(pss(1000), publicKey, salted, data),
    // The spec has no error here: past 2^31 - 1 too, it's a signature that
    // doesn't verify. (Chrome rejects those with OperationError.)
    hugeSaltVerify: await subtle.verify(pss(4294967295), publicKey, salted, data).catch((err) => err.name),
    // saltLength is a required [EnforceRange] unsigned long, checked before the key.
    noSalt: await errorName(() => subtle.sign("RSA-PSS", privateKey, data)),
    noSaltObject: await errorName(() => subtle.verify({ name: "RSA-PSS" }, publicKey, salted, data)),
    negativeSalt: await errorName(() => subtle.sign(pss(-1), privateKey, data)),
    saltOverflow: await errorName(() => subtle.sign(pss(4294967296), privateKey, data)),
    nanSalt: await errorName(() => subtle.sign(pss(NaN), privateKey, data)),
    noSaltOnHmac: await errorName(() => subtle.sign("RSA-PSS", hmac, data)),
    stringSalt: await errorName(() => subtle.sign(pss("32"), privateKey, data)),
    // null converts to 0, as for any unsigned long.
    nullSalt: await subtle.verify(pss(0), publicKey, await subtle.sign(pss(null), privateKey, data), data),
    // Other algorithms ignore the member.
    hmacWithSalt: await errorName(() => subtle.sign({ name: "HMAC", saltLength: -1 }, hmac, data)),
    // RSA-PSS and RSASSA-PKCS1-v1_5 keys don't mix.
    pssOnRsassa: await errorName(() => subtle.verify(pss(32), rsassa, salted, data)),
    rsassaOnPss: await errorName(() => subtle.sign("RSASSA-PKCS1-v1_5", privateKey, data)),
    // JWK: a "sig" key whose `alg` is the PS one of the requested hash.
    jwkAlgOtherHash: await errorName(() => subtle.importKey("jwk", { ...publicJwk, alg: "PS384" }, algo, true, ["verify"])),
    jwkAlgRs: await errorName(() => subtle.importKey("jwk", { ...publicJwk, alg: "RS256" }, algo, true, ["verify"])),
    jwkUseEnc: await errorName(() => subtle.importKey("jwk", { ...publicJwk, use: "enc" }, algo, true, ["verify"])),
    // Usages: sign for the private key, verify for the public one.
    verifyOnly: await errorName(() => subtle.generateKey(
      { ...algo, modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) }, true, ["verify"])),
    spkiForSign: await errorName(() => subtle.importKey("spki", rsaTestKey.spki, algo, true, ["sign"])),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual(expected, b64(unsalted));
    testing.expectEqual(true, results.unsaltedValid);
    testing.expectEqual(256, salted.byteLength);
    testing.expectEqual(false, b64(salted) === b64(saltedAgain));
    testing.expectEqual(true, results.saltedValid);
    testing.expectEqual(true, results.saltedAgainValid);
    testing.expectEqual(false, results.wrongSaltLength);
    testing.expectEqual(false, results.otherData);
    testing.expectEqual(true, results.generatedValid);
    testing.expectEqual(null, results.maxSalt);
    testing.expectEqual("OperationError", results.saltTooLong);
    testing.expectEqual(false, results.longSaltVerify);
    testing.expectEqual(false, results.hugeSaltVerify);
    testing.expectEqual("TypeError", results.noSalt);
    testing.expectEqual("TypeError", results.noSaltObject);
    testing.expectEqual("TypeError", results.negativeSalt);
    testing.expectEqual("TypeError", results.saltOverflow);
    testing.expectEqual("TypeError", results.nanSalt);
    testing.expectEqual("TypeError", results.noSaltOnHmac);
    testing.expectEqual(null, results.stringSalt);
    testing.expectEqual(true, results.nullSalt);
    testing.expectEqual("true,true,true", hashRoundTrips.join(","));
    testing.expectEqual(true, noSaltIsPromise);
    testing.expectEqual(null, results.hmacWithSalt);
    testing.expectEqual("InvalidAccessError", results.pssOnRsassa);
    testing.expectEqual("InvalidAccessError", results.rsassaOnPss);
    testing.expectEqual("DataError", results.jwkAlgOtherHash);
    testing.expectEqual("DataError", results.jwkAlgRs);
    testing.expectEqual("DataError", results.jwkUseEnc);
    testing.expectEqual("SyntaxError", results.verifyOnly);
    testing.expectEqual("SyntaxError", results.spkiForSign);
    testing.expectEqual("RSA-PSS", privateKey.algorithm.name);
    testing.expectEqual("RSA-PSS", jwkPrivate.algorithm.name);
    testing.expectEqual("PS256", publicJwk.alg);
    testing.expectEqual("sign", privateJwk.key_ops.join(","));
    testing.expectEqual("PS1,PS256,PS384,PS512", algs.join(","));
  });
</script>

    pkcs8: fromB64("MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgbrRKMgf6KKhsWivZyuUW3iAiSirTaww3eop42SkjMg2hRANCAASgt8aMvpGti5FrA9EdUxVVZt9CMDRJQ9VxfGPj46kB3RgYLqXPTNzB/DhP6MZy6cIxqBHDKEW+sZda1JR9MXCq"),
    // SHA-256.
    signature: fromB64("mJ/UOhqLiZvLoi3d+N93gDe2oNSOT69aUhAHVfAnX3fPK9LSkG/zJRoBhp6urX0wwL8ASw/e6ALW1G0tsZKYew=="),
  };

    spki: fromB64("MIGbMBAGByqGSM49AgEGBSuBBAAjA4GGAAQBRaetQGuHTbgL1x0ddDqG21VmJRsM1E9TgE8oGSz82+b0d9Zlwx6jaN5UQnEn0S/47b8hwxnrQIyXz45aiDlnaWgB9uH2ytl/9TA4W7gqMjK6zSsP13IgZeAc68s0PTRSubL2ipe7+rpJ6kJONBnUGSVZ5skllnLm1sQrKICI8kR4690="),

  };

  const privateKey = await subtle.importKey("pkcs8", p256.pkcs8, ecdsa("P-256"), false, ["sign"]);

  tampered[5] ^= 1;
  const n = sig.length / 2;

  // The hash is the operation's, not the key's: any of them, as a string or an object.
  const sha512 = await subtle.sign(withHash({ name: "SHA-512" }), privateKey, data);
  const pair = await subtle.generateKey(ecdsa("P-384"), true, ["sign", "verify"]);
  const p384Signature = await subtle.sign(withHash("SHA-1"), pair.privateKey, data);
  // P-521's scalars are 521 bits, so r and s are each padded to 66 bytes.
  const p521Pair = await subtle.generateKey(ecdsa("P-521"), true, ["sign", "verify"]);
  const p521Signatures = [];
  for (let i = 0; i < 8; i++) p521Signatures.push(await subtle.sign(withHash("SHA-512"), p521Pair.privateKey, data));
  const ecdh = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const hmac = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, true, ["sign"]);
  const noHashPromise = subtle.sign("ECDSA", privateKey, data);
  const noHashIsPromise = noHashPromise instanceof Promise;

    // Verifying OpenSSL's signatures.
    openssl: await subtle.verify(withHash("SHA-256"), publicKey, sig, data),
    opensslP521: await subtle.verify(withHash("SHA-384"), p521Public, p521.signature, data),
    otherHash: await subtle.verify(withHash("SHA-384"), publicKey, sig, data),
    otherData: await subtle.verify(withHash("SHA-256"), publicKey, sig, new TextEncoder().encode("other")),

    signedAgainValid: await subtle.verify(withHash("SHA-256"), publicKey, signedAgain, data),
    sha512Valid: await subtle.verify(withHash("SHA-512"), publicKey, sha512, data),
    sha512AsSha256: await subtle.verify(withHash("SHA-256"), publicKey, sha512, data),
    p384Valid: await subtle.verify(withHash("SHA-1"), pair.publicKey, p384Signature, data),
    p521Valid: (await Promise.all(p521Signatures.map((s) => subtle.verify(withHash("SHA-512"), p521Pair.publicKey, s, data)))).every((v) => v),
    // EcdsaParams: the hash is required (TypeError) and must be a known one
    // (NotSupportedError), checked before the key.
    noHash: await errorName(() => subtle.sign("ECDSA", privateKey, data)),
    noHashObject: await errorName(() => subtle.verify({ name: "ECDSA" }, publicKey, sig, data)),
    noDash: await errorName(() => subtle.verify(withHash("SHA256"), publicKey, sig, data)),
    // An object hash needs its name.
    hashWithoutName: await errorName(() => subtle.sign(withHash({}), privateKey, data)),
    sha224: await errorName(() => subtle.sign(withHash("SHA-224"), privateKey, data)),
    badHashOnHmac: await errorName(() => subtle.sign(withHash("SHA256"), hmac, data)),
    // The key: its own algorithm, its usage, its half.
    publicSign: await errorName(() => subtle.sign(withHash("SHA-256"), pair.publicKey, data)),
    privateVerify: await errorName(() => subtle.verify(withHash("SHA-256"), pair.privateKey, sig, data)),
    ecdhKey: await errorName(() => subtle.sign(withHash("SHA-256"), ecdh.privateKey, data)),
    // Other algorithms ignore a stray hash.
    hmacWithHash: await errorName(() => subtle.sign({ name: "HMAC", hash: "bogus" }, hmac, data)),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, results.openssl);
    testing.expectEqual(true, results.opensslP521);
    testing.expectEqual(false, results.otherHash);
    testing.expectEqual(false, results.otherData);
    testing.expectEqual(false, results.tampered);
    testing.expectEqual(false, results.truncated);
    testing.expectEqual(false, results.padded);
    testing.expectEqual(false, results.empty);
    testing.expectEqual(false, results.zeros);
    testing.expectEqual(64, signed.byteLength);
    testing.expectEqual(false, Array.from(new Uint8Array(signed)).join() === Array.from(new Uint8Array(signedAgain)).join());
    testing.expectEqual(true, results.signedValid);
    testing.expectEqual(true, results.signedAgainValid);
    testing.expectEqual(true, results.sha512Valid);
    testing.expectEqual(false, results.sha512AsSha256);
    testing.expectEqual(96, p384Signature.byteLength);
    testing.expectEqual(true, results.p384Valid);
    testing.expectEqual("132", p521Signatures.map((s) => s.byteLength).join().split(",").filter((l, i, all) => all.indexOf(l) === i).join());
    testing.expectEqual(true, results.p521Valid);
    testing.expectEqual("TypeError", results.noHash);
    testing.expectEqual("TypeError", results.noHashObject);
    testing.expectEqual(true, noHashIsPromise);
    testing.expectEqual("NotSupportedError", results.noDash);
    testing.expectEqual("TypeError", results.hashWithoutName);
    testing.expectEqual("NotSupportedError", results.sha224);
    testing.expectEqual("NotSupportedError", results.badHashOnHmac);
    testing.expectEqual("InvalidAccessError", results.publicSign);
    testing.expectEqual("InvalidAccessError", results.privateVerify);
    testing.expectEqual("InvalidAccessError", results.ecdhKey);
    testing.expectEqual(null, results.hmacWithHash);
  });

  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const b64urlLen = (s) => atob(s.replace(/-/g, "+").replace(/_/g, "/")).length;
  const ecdsa = (namedCurve) => ({ name: "ECDSA", namedCurve });
  const ecdh = (namedCurve) => ({ name: "ECDH", namedCurve });
  const data = new TextEncoder().encode("ec key formats");

  // Every format round trips: spki/pkcs8 byte for byte, raw as 0x04 || x || y.
  const pair = await subtle.generateKey(ecdsa("P-256"), true, ["sign", "verify"]);
  const raw = new Uint8Array(await subtle.exportKey("raw", pair.publicKey));
  const spki = await subtle.exportKey("spki", pair.publicKey);
  const pkcs8 = await subtle.exportKey("pkcs8", pair.privateKey);
  const publicJwk = await subtle.exportKey("jwk", pair.publicKey);
  const privateJwk = await subtle.exportKey("jwk", pair.privateKey);
  const fromRaw = await subtle.importKey("raw", raw, ecdsa("P-256"), true, ["verify"]);
  const fromSpki = await subtle.importKey("spki", spki, ecdsa("P-256"), true, ["verify"]);
  const fromPkcs8 = await subtle.importKey("pkcs8", pkcs8, ecdsa("P-256"), true, ["sign"]);
  const fromPublicJwk = await subtle.importKey("jwk", publicJwk, ecdsa("P-256"), true, ["verify"]);
  const fromPrivateJwk = await subtle.importKey("jwk", privateJwk, ecdsa("P-256"), true, ["sign"]);
  // A compressed point (0x02/0x03 || x) imports to the same key.
  const compressed = new Uint8Array(33);
  compressed[0] = raw[64] & 1 ? 3 : 2;
  compressed.set(raw.subarray(1, 33), 1);
  const fromCompressed = await subtle.importKey("raw", compressed, ecdsa("P-256"), true, ["verify"]);
  // The imported keys work: one signs, the others verify.
  const signature = await subtle.sign({ name: "ECDSA", hash: "SHA-256" }, fromPrivateJwk, data);
  const verified = [];
  for (const key of [fromRaw, fromSpki, fromPublicJwk, fromCompressed, pair.publicKey]) {
    verified.push(await subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, signature, data));
  }

  // ECDH: the sizes of each curve, and JWK keys that derive the same secret.
  const sizes = [];
  for (const curve of ["P-256", "P-384", "P-521"]) {
    const k = await subtle.generateKey(ecdh(curve), true, ["deriveBits"]);
    const j = await subtle.exportKey("jwk", k.privateKey);
    sizes.push(`${(await subtle.exportKey("raw", k.publicKey)).byteLength}/${b64urlLen(j.x)}/${b64urlLen(j.d)}`);
  }
  const alice = await subtle.generateKey(ecdh("P-384"), true, ["deriveBits"]);
  const bob = await subtle.generateKey(ecdh("P-384"), true, ["deriveBits"]);
  const aliceJwk = await subtle.importKey("jwk", await subtle.exportKey("jwk", alice.privateKey), ecdh("P-384"), false, ["deriveBits"]);
  const bobRaw = await subtle.importKey("raw", await subtle.exportKey("raw", bob.publicKey), ecdh("P-384"), true, []);
  const secret = hex(await subtle.deriveBits({ name: "ECDH", public: bob.publicKey }, alice.privateKey, 384));
  // P-521: 66-byte coordinates, compressed too, and ES512.
  const p521 = await subtle.generateKey(ecdsa("P-521"), true, ["sign", "verify"]);
  const p521Raw = new Uint8Array(await subtle.exportKey("raw", p521.publicKey));
  const p521Compressed = new Uint8Array(67);
  p521Compressed[0] = p521Raw[132] & 1 ? 3 : 2;
  p521Compressed.set(p521Raw.subarray(1, 67), 1);
  const p521FromCompressed = hex(await subtle.exportKey("raw", await subtle.importKey("raw", p521Compressed, ecdsa("P-521"), true, ["verify"])));
  const p521Jwk = await subtle.exportKey("jwk", p521.publicKey);
  const p521ES512 = await errorName(() => subtle.importKey("jwk", { ...p521Jwk, alg: "ES512" }, ecdsa("P-521"), true, ["verify"]));
  const p521ES256 = await errorName(() => subtle.importKey("jwk", { ...p521Jwk, alg: "ES256" }, ecdsa("P-521"), true, ["verify"]));
  const secretFromImports = hex(await subtle.deriveBits({ name: "ECDH", public: bobRaw }, aliceJwk, 384));
  const dhPublicJwk = await subtle.exportKey("jwk", alice.publicKey);
  const dhPrivateJwk = await subtle.exportKey("jwk", alice.privateKey);

  const other = await subtle.exportKey("jwk", (await subtle.generateKey(ecdsa("P-256"), true, ["sign"])).privateKey);
  const zeroPrefixed = (b64url) => btoa("\0" + atob(b64url.replace(/-/g, "+").replace(/_/g, "/"))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const offCurve = raw.slice();

  const { y: _y, ...noY } = publicJwk;
  const importPublic = (jwk) => errorName(() => subtle.importKey("jwk", jwk, ecdsa("P-256"), true, ["verify"]));

  const results = {
    // raw is the public point only, of the requested curve.
    rawShort: await errorName(() => subtle.importKey("raw", raw.slice(0, 64), ecdsa("P-256"), true, ["verify"])),
    rawOffCurve: await errorName(() => subtle.importKey("raw", offCurve, ecdsa("P-256"), true, ["verify"])),
    rawOtherCurve: await errorName(() => subtle.importKey("raw", raw, ecdsa("P-384"), true, ["verify"])),
    rawForSign: await errorName(() => subtle.importKey("raw", raw, ecdsa("P-256"), true, ["sign"])),
    rawOfPrivate: await errorName(() => subtle.exportKey("raw", pair.privateKey)),
    dhRawWithUsage: await errorName(() => subtle.importKey("raw", raw, ecdh("P-256"), true, ["deriveBits"])),
    // DER of another key type, or of another curve than the requested one, is DataError.
    rsaSpki: await errorName(() => subtle.importKey("spki", rsaTestKey.spki, ecdsa("P-256"), true, ["verify"])),
    rsaPkcs8: await errorName(() => subtle.importKey("pkcs8", rsaTestKey.pkcs8, ecdh("P-256"), true, ["deriveBits"])),
    spkiOtherCurve: await errorName(() => subtle.importKey("spki", spki, ecdsa("P-384"), true, ["verify"])),
    pkcs8OtherCurve: await errorName(() => subtle.importKey("pkcs8", pkcs8, ecdsa("P-521"), true, ["sign"])),
    spkiOfPrivate: await errorName(() => subtle.exportKey("spki", pair.privateKey)),
    pkcs8OfPublic: await errorName(() => subtle.exportKey("pkcs8", pair.publicKey)),
    // JWK: kty "EC" and crv, matched case-sensitively; ECDSA's alg names the curve.
    ktyLower: await importPublic({ ...publicJwk, kty: "ec" }),
    crvLower: await importPublic({ ...publicJwk, crv: "p-256" }),
    crvOther: await importPublic({ ...publicJwk, crv: "P-384" }),
    algES256: await importPublic({ ...publicJwk, alg: "ES256" }),
    algES384: await importPublic({ ...publicJwk, alg: "ES384" }),
    useEnc: await importPublic({ ...publicJwk, use: "enc" }),
    noY: await importPublic(noY),
    shortX: await importPublic({ ...publicJwk, x: publicJwk.x.slice(0, -2) }),
    paddedD: await errorName(() => subtle.importKey("jwk", { ...privateJwk, d: zeroPrefixed(privateJwk.d) }, ecdsa("P-256"), true, ["sign"])),
    otherD: await errorName(() => subtle.importKey("jwk", { ...privateJwk, d: other.d }, ecdsa("P-256"), true, ["sign"])),
    // ECDH ignores alg, and its keys are "enc" ones (checked when usages are asked for).
    dhAlg: await errorName(() => subtle.importKey("jwk", { ...dhPublicJwk, alg: "bogus" }, ecdh("P-384"), true, [])),
    dhPublicUseSig: await errorName(() => subtle.importKey("jwk", { ...dhPublicJwk, use: "sig" }, ecdh("P-384"), true, [])),
    dhPrivateUseSig: await errorName(() => subtle.importKey("jwk", { ...dhPrivateJwk, use: "sig" }, ecdh("P-384"), true, ["deriveBits"])),
    // Other algorithms ignore a stray namedCurve.
    aesWithCurve: await errorName(() => subtle.importKey("raw", new Uint8Array(16), { name: "AES-GCM", namedCurve: "P-256" }, true, ["encrypt"])),
  };
  const again = {
    raw: hex(await subtle.exportKey("raw", fromRaw)),
    compressed: hex(await subtle.exportKey("raw", fromCompressed)),
    spki: hex(await subtle.exportKey("spki", fromSpki)),
    pkcs8: hex(await subtle.exportKey("pkcs8", fromPkcs8)),
    privateJwk: JSON.stringify(await subtle.exportKey("jwk", fromPrivateJwk)),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual("65 4", `${raw.length} ${raw[0]}`);
    testing.expectEqual(hex(raw), again.raw);
    testing.expectEqual(hex(raw), again.compressed);
    testing.expectEqual(hex(spki), again.spki);
    testing.expectEqual(hex(pkcs8), again.pkcs8);
    testing.expectEqual(JSON.stringify(privateJwk), again.privateJwk);
    testing.expectEqual("crv,ext,key_ops,kty,x,y", Object.keys(publicJwk).join(","));
    testing.expectEqual("crv,d,ext,key_ops,kty,x,y", Object.keys(privateJwk).join(","));
    testing.expectEqual("P-256 EC verify sign", `${publicJwk.crv} ${publicJwk.kty} ${publicJwk.key_ops} ${privateJwk.key_ops}`);
    testing.expectEqual("ECDSA P-256 public", `${fromPublicJwk.algorithm.name} ${fromPublicJwk.algorithm.namedCurve} ${fromPublicJwk.type}`);
    testing.expectEqual("private", fromPrivateJwk.type);
    testing.expectEqual("true,true,true,true,true", verified.join(","));
    testing.expectEqual("65/32/32,97/48/48,133/66/66", sizes.join(","));
    testing.expectEqual(secret, secretFromImports);
    testing.expectEqual(hex(p521Raw), p521FromCompressed);
    testing.expectEqual(null, p521ES512);
    testing.expectEqual("DataError", p521ES256);
    testing.expectEqual("", dhPublicJwk.key_ops.join(","));
    testing.expectEqual("DataError", results.rawShort);
    testing.expectEqual("DataError", results.rawOffCurve);
    testing.expectEqual("DataError", results.rawOtherCurve);
    testing.expectEqual("SyntaxError", results.rawForSign);
    testing.expectEqual("InvalidAccessError", results.rawOfPrivate);
    testing.expectEqual("SyntaxError", results.dhRawWithUsage);
    testing.expectEqual("DataError", results.rsaSpki);
    testing.expectEqual("DataError", results.rsaPkcs8);
    testing.expectEqual("DataError", results.spkiOtherCurve);
    testing.expectEqual("DataError", results.pkcs8OtherCurve);
    testing.expectEqual("InvalidAccessError", results.spkiOfPrivate);
    testing.expectEqual("InvalidAccessError", results.pkcs8OfPublic);
    testing.expectEqual("DataError", results.ktyLower);
    testing.expectEqual("DataError", results.crvLower);
    testing.expectEqual("DataError", results.crvOther);
    testing.expectEqual(null, results.algES256);
    testing.expectEqual("DataError", results.algES384);
    testing.expectEqual("DataError", results.useEnc);
    testing.expectEqual("DataError", results.noY);
    testing.expectEqual("DataError", results.shortX);
    testing.expectEqual("DataError", results.paddedD);
    testing.expectEqual("DataError", results.otherD);
    testing.expectEqual(null, results.dhAlg);
    testing.expectEqual(null, results.dhPublicUseSig);

<script id=wrap-unwrap type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const gcm = { name: "AES-GCM", iv: new Uint8Array(12) };
  const cbc = { name: "AES-CBC", iv: new Uint8Array(16) };
  const rsaAlgo = { name: "RSA-OAEP", hash: "SHA-256" };
  const msg = new TextEncoder().encode("wrapped");

  const target = await subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  const rsa = await subtle.generateKey(
    { ...rsaAlgo, modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) },
    true,
    ["encrypt", "decrypt", "wrapKey", "unwrapKey"],
  );
  const kw = await subtle.generateKey({ name: "AES-KW", length: 128 }, true, ["wrapKey", "unwrapKey"]);
  const gcmWrapper = await subtle.generateKey({ name: "AES-GCM", length: 128 }, true, ["wrapKey", "unwrapKey", "decrypt"]);
  const cbcWrapper = await subtle.generateKey({ name: "AES-CBC", length: 128 }, true, ["wrapKey", "unwrapKey"]);
  const raw = hex(await subtle.exportKey("raw", target));

  // AES-KW (RFC 3394) wraps the raw key, 8 bytes longer.
  const kwWrapped = await subtle.wrapKey("raw", target, kw, "AES-KW");
  const kwBack = await subtle.unwrapKey("raw", kwWrapped, kw, { name: "AES-KW" }, "AES-GCM", true, ["encrypt"]);

  // AES-GCM wraps a JWK as the UTF-8 of JSON.stringify(exportKey("jwk", key)).
  const jwkWrapped = await subtle.wrapKey("jwk", rsa.privateKey, gcmWrapper, gcm);
  const jwkText = new TextDecoder().decode(await subtle.decrypt(gcm, gcmWrapper, jwkWrapped));
  const jwkBack = await subtle.unwrapKey("jwk", jwkWrapped, gcmWrapper, gcm, rsaAlgo, true, ["decrypt"]);
  const ct = await subtle.encrypt({ name: "RSA-OAEP" }, rsa.publicKey, msg);

  // RSA-OAEP wraps by encrypting; AES-CBC here wraps a pkcs8 key.
  const rsaWrapped = await subtle.wrapKey("raw", target, rsa.publicKey, { name: "RSA-OAEP" });
  const rsaBack = await subtle.unwrapKey("raw", rsaWrapped, rsa.privateKey, "RSA-OAEP", { name: "AES-GCM" }, false, ["decrypt"]);
  const p8Wrapped = await subtle.wrapKey("pkcs8", rsa.privateKey, cbcWrapper, cbc);
  const p8Back = await subtle.unwrapKey("pkcs8", p8Wrapped, cbcWrapper, cbc, rsaAlgo, true, ["decrypt"]);

  const results = {
    kwRaw: hex(await subtle.exportKey("raw", kwBack)),
    jwkJson: JSON.stringify(await subtle.exportKey("jwk", rsa.privateKey)),
    jwkDecrypt: new TextDecoder().decode(await subtle.decrypt({ name: "RSA-OAEP" }, jwkBack, ct)),
    rsaBackDecrypt: hex(await subtle.decrypt(gcm, rsaBack, await subtle.encrypt(gcm, target, msg))),
    p8: hex(await subtle.exportKey("pkcs8", p8Back)),
    p8Original: hex(await subtle.exportKey("pkcs8", rsa.privateKey)),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual(40, kwWrapped.byteLength);
    testing.expectEqual(raw, results.kwRaw);
    testing.expectEqual(results.jwkJson, jwkText);
    testing.expectEqual("private", jwkBack.type);
    testing.expectEqual("wrapped", results.jwkDecrypt);
    // The unwrapped key takes the extractable flag and usages asked for.
    testing.expectEqual(false, rsaBack.extractable);
    testing.expectEqual("decrypt", rsaBack.usages.join(","));
    testing.expectEqual(hex(msg), results.rsaBackDecrypt);
    testing.expectEqual(results.p8Original, results.p8);
  });

  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {

      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const gcm = { name: "AES-GCM", iv: new Uint8Array(12) };
  const cbc = { name: "AES-CBC", iv: new Uint8Array(16) };
  const aes = (name, usages, extractable = true) => subtle.generateKey({ name, length: 128 }, extractable, usages);

  const target = await aes("AES-GCM", ["encrypt"]);
  const locked = await aes("AES-GCM", ["encrypt"], false);
  const wrapper = await aes("AES-GCM", ["wrapKey", "unwrapKey"]);
  const encryptOnly = await aes("AES-GCM", ["encrypt", "decrypt"]);
  const encryptAndUnwrap = await aes("AES-GCM", ["encrypt", "unwrapKey"]);
  const kw = await aes("AES-KW", ["wrapKey", "unwrapKey"]);
  const otherKw = await aes("AES-KW", ["wrapKey", "unwrapKey"]);
  const hmac = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, true, ["sign"]);
  // 160 bits: 20 raw bytes, not a multiple of the 8 AES-KW needs.
  const hmac160 = await subtle.generateKey({ name: "HMAC", hash: "SHA-256", length: 160 }, true, ["sign"]);
  const rsa = await subtle.generateKey(
    { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) },
    true,
    ["decrypt"],
  );
  const ecdh = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const x25519 = await subtle.generateKey({ name: "X25519" }, true, ["deriveBits"]);
  const kwWrapped = await subtle.wrapKey("raw", target, kw, "AES-KW");
  const notJson = await subtle.wrapKey("raw", target, wrapper, gcm);
  const noKty = await subtle.encrypt(gcm, encryptAndUnwrap, new TextEncoder().encode(JSON.stringify({ k: "AAAAAAAAAAAAAAAAAAAAAA" })));
  const extFalse = await subtle.encrypt(gcm, encryptAndUnwrap, new TextEncoder().encode(JSON.stringify({ kty: "oct", k: "AAAAAAAAAAAAAAAAAAAAAA", ext: false })));

  const results = {
    // The wrapping key: an algorithm that wraps or encrypts, its own algorithm, and the wrapKey/unwrapKey usage.
    hmacAlgorithm: await errorName(() => subtle.wrapKey("raw", target, hmac, { name: "HMAC" })),
    nameMismatch: await errorName(() => subtle.wrapKey("raw", target, wrapper, cbc)),
    noWrapUsage: await errorName(() => subtle.wrapKey("raw", target, encryptOnly, gcm)),
    noUnwrapUsage: await errorName(() => subtle.unwrapKey("raw", notJson, encryptOnly, gcm, "AES-GCM", true, ["encrypt"])),
    // The wrapped key: exportable, in a format it has.
    notExtractable: await errorName(() => subtle.wrapKey("raw", locked, wrapper, gcm)),
    rsaRaw: await errorName(() => subtle.wrapKey("raw", rsa.privateKey, wrapper, gcm)),
    // Only a public key has a raw form (EC's is the public point).
    x25519PrivateRaw: await errorName(() => subtle.wrapKey("raw", x25519.privateKey, wrapper, gcm)),
    ecPrivateRaw: await errorName(() => subtle.wrapKey("raw", ecdh.privateKey, wrapper, gcm)),
    ecPublicRaw: await errorName(() => subtle.wrapKey("raw", ecdh.publicKey, wrapper, gcm)),
    x25519PublicRaw: await errorName(() => subtle.wrapKey("raw", x25519.publicKey, wrapper, gcm)),
    badFormat: await errorName(() => subtle.wrapKey("pem", target, wrapper, gcm)),
    // AES-KW only wraps: no encrypt, and its integrity check fails with another key.
    encryptWithKw: await errorName(() => subtle.encrypt({ name: "AES-KW" }, kw, new Uint8Array(16))),
    wrongKwKey: await errorName(() => subtle.unwrapKey("raw", kwWrapped, otherKw, "AES-KW", "AES-GCM", true, ["encrypt"])),
    kwTooShort: await errorName(() => subtle.unwrapKey("raw", new Uint8Array(8), kw, "AES-KW", "AES-GCM", true, ["encrypt"])),
    // The spec's AES-KW "wrap key" step says OperationError (Chrome reports DataError).
    kwNotMultipleOf8: await errorName(() => subtle.wrapKey("raw", hmac160, kw, "AES-KW")),
    // The unwrapped bytes go through importKey: a JWK must be JSON with a kty, and a secret key needs usages.
    notJson: await errorName(() => subtle.unwrapKey("jwk", notJson, wrapper, gcm, "AES-GCM", true, ["encrypt"])),
    jwkWithoutKty: await errorName(() => subtle.unwrapKey("jwk", noKty, encryptAndUnwrap, gcm, "AES-GCM", true, ["encrypt"])),
    // A JWK with ext: false can't be unwrapped as extractable, but can as not.
    extFalseExtractable: await errorName(() => subtle.unwrapKey("jwk", extFalse, encryptAndUnwrap, gcm, "AES-GCM", true, ["encrypt"])),
    extFalse: await errorName(() => subtle.unwrapKey("jwk", extFalse, encryptAndUnwrap, gcm, "AES-GCM", false, ["encrypt"])),
    emptyUsages: await errorName(() => subtle.unwrapKey("raw", kwWrapped, kw, "AES-KW", "AES-GCM", true, [])),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual("NotSupportedError", results.hmacAlgorithm);
    testing.expectEqual("InvalidAccessError", results.nameMismatch);
    testing.expectEqual("InvalidAccessError", results.noWrapUsage);
    testing.expectEqual("InvalidAccessError", results.noUnwrapUsage);
    testing.expectEqual("InvalidAccessError", results.notExtractable);
    testing.expectEqual("NotSupportedError", results.rsaRaw);
    testing.expectEqual("InvalidAccessError", results.x25519PrivateRaw);
    testing.expectEqual("InvalidAccessError", results.ecPrivateRaw);
    testing.expectEqual(null, results.ecPublicRaw);
    testing.expectEqual(null, results.x25519PublicRaw);
    testing.expectEqual("TypeError", results.badFormat);
    testing.expectEqual("NotSupportedError", results.encryptWithKw);
    testing.expectEqual("OperationError", results.wrongKwKey);
    testing.expectEqual("OperationError", results.kwTooShort);
    testing.expectEqual("OperationError", results.kwNotMultipleOf8);
    testing.expectEqual("DataError", results.notJson);
    testing.expectEqual("DataError", results.jwkWithoutKty);
    testing.expectEqual("DataError", results.extFalseExtractable);
    testing.expectEqual(null, results.extFalse);
    testing.expectEqual("SyntaxError", results.emptyUsages);
  });
</script>

<script id=jwk-symmetric type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const k16 = "AAAAAAAAAAAAAAAAAAAAAA"; // 16 bytes
  const k24 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"; // 24 bytes
  const k32 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"; // 32 bytes
  const aes = { kty: "oct", k: k16, alg: "A128GCM" };
  const hmac = { kty: "oct", k: k16, alg: "HS256" };
  const importAes =(jwk, usages = ["encrypt"], extractable = true, name = "AES-GCM") =>
    errorName(() => subtle.importKey("jwk", jwk, name, extractable, usages));
  const importHmac = (jwk, usages = ["sign"], hash = "SHA-256") =>
    errorName(() => subtle.importKey("jwk", jwk, { name: "HMAC", hash }, true, usages));

  // A non-extractable JWK, wrapped as JSON, must not come back extractable.
  const wrapper = await subtle.generateKey({ name: "AES-GCM", length: 128 }, true, ["encrypt", "unwrapKey"]);
  const gcm = { name: "AES-GCM", iv: new Uint8Array(12) };
  const lockedJson = new TextEncoder().encode(JSON.stringify({ ...aes, ext: false }));
  const wrappedLocked = await subtle.encrypt(gcm, wrapper, lockedJson);

  const results = {
    // Accepted: matching alg, use and key_ops, ext:false imported as non-extractable.
    aes: await importAes(aes),
    aesWithoutAlg: await importAes({ kty: "oct", k: k16 }),
    kw: await importAes({ kty: "oct", k: k16, alg: "A128KW" }, ["wrapKey"], true, "AES-KW"),
    cbc192: await importAes({ kty: "oct", k: k24, alg: "A192CBC" }, ["encrypt"], true, "AES-CBC"),
    ctr256: await importAes({ kty: "oct", k: k32, alg: "A256CTR" }, ["encrypt"], true, "AES-CTR"),
    hmac: await importHmac(hmac),
    hmacSha1: await importHmac({ kty: "oct", k: k16, alg: "HS1" }, ["sign"], "SHA-1"),
    useMatches: await importAes({ ...aes, use: "enc" }),
    extFalseLocked: await importAes({ ...aes, ext: false }, ["encrypt"], false),
    keyOpsWider: await importAes({ ...aes, key_ops: ["encrypt", "decrypt"] }),
    // kty, k and alg (case-sensitive, and naming this algorithm at this length / hash).
    ktyMissing: await importAes({ k: k16 }),
    ktyRsa: await importAes({ ...aes, kty: "RSA" }),
    kMissing: await importAes({ kty: "oct", alg: "A128GCM" }),
    algLength: await importAes({ ...aes, alg: "A256GCM" }),
    algMode: await importAes({ ...aes, alg: "A128CBC" }),
    algLowercase: await importAes({ ...aes, alg: "a128gcm" }),
    hmacAlgHash: await importHmac({ ...hmac, alg: "HS512" }),
    // use, key_ops and ext.
    aesUseSig: await importAes({ ...aes, use: "sig" }),
    hmacUseEnc: await importHmac({ ...hmac, use: "enc" }),
    keyOpsMissing: await importAes({ ...aes, key_ops: ["decrypt"] }),
    keyOpsDuplicate: await importAes({ ...aes, key_ops: ["encrypt", "encrypt"] }),
    aesExtFalse: await importAes({ ...aes, ext: false }),
    hmacExtFalse: await importHmac({ ...hmac, ext: false }),
    unwrapExtFalse: await errorName(() => subtle.unwrapKey("jwk", wrappedLocked, wrapper, gcm, "AES-GCM", true, ["encrypt"])),
    // The usages are checked before the JWK.
    badUsageBadKty: await importAes({ ...aes, kty: "RSA" }, ["sign"]),
    // HKDF and PBKDF2 keys only come in raw.
    hkdf: await errorName(() => subtle.importKey("jwk", { kty: "oct", k: k16 }, "HKDF", false, ["deriveBits"])),
    pbkdf2: await errorName(() => subtle.importKey("jwk", { kty: "oct", k: k16 }, "PBKDF2", false, ["deriveBits"])),
  };

  state.resolve();
  await state.done(() => {
    // Compared with the case name, so a failure says which one.
    for (const ok of ["aes", "aesWithoutAlg", "kw", "cbc192", "ctr256", "hmac", "hmacSha1", "useMatches", "extFalseLocked", "keyOpsWider"]) {
      testing.expectEqual(`${ok}: null`, `${ok}: ${results[ok]}`);
    }
    for (const bad of ["ktyMissing", "ktyRsa", "kMissing", "algLength", "algMode", "algLowercase", "hmacAlgHash",
      "aesUseSig", "hmacUseEnc", "keyOpsMissing", "keyOpsDuplicate", "aesExtFalse", "hmacExtFalse", "unwrapExtFalse"]) {
      testing.expectEqual(`${bad}: DataError`, `${bad}: ${results[bad]}`);
    }
    testing.expectEqual("SyntaxError", results.badUsageBadKty);
    testing.expectEqual("NotSupportedError", results.hkdf);
    testing.expectEqual("NotSupportedError", results.pbkdf2);
  });
</script>

<script id=aes-ctr-counter-wrap type=module>
  const state = await testing.async();
  // AES-CTR must increment only the rightmost `length` bits of the counter
  // block and leave the nonce bits fixed when that sub-counter wraps. Use a
  // 1-bit counter so it wraps after two blocks, and check each block's
  // keystream against an independent single-block encryption (the
  // non-wrapping path, used here as the oracle).
  const key = await crypto.subtle.importKey(
    "raw", new Uint8Array(16), { name: "AES-CTR" }, false, ["encrypt", "decrypt"],
  );

  // Counter with the low bit set; the wrap target is the same block with the
  // low bit cleared (which differs from a naive +1 carry).
  const counter = new Uint8Array(16); counter[15] = 0x01;
  const counter0 = new Uint8Array(16);

  const enc = (ctr, bits, data) =>
    crypto.subtle.encrypt({ name: "AES-CTR", counter: ctr, length: bits }, key, data);

  const ks1 = new Uint8Array(await enc(counter, 128, new Uint8Array(16)));
  const ks2 = new Uint8Array(await enc(counter0, 128, new Uint8Array(16)));
  const full = new Uint8Array(await enc(counter, 1, new Uint8Array(32)));

  // A message longer than the counter space (here 2 blocks for a 1-bit
  // counter) must reject rather than reuse counter values.
  let overLengthError = null;
  try {
    await enc(counter0, 1, new Uint8Array(48));
  } catch (err) {
    overLengthError = err;
  }

  state.resolve();
  await state.done(() => {
    testing.expectEqual(ks1.join(","), full.slice(0, 16).join(","));
    testing.expectEqual(ks2.join(","), full.slice(16).join(","));

    testing.expectEqual(true, overLengthError !== null);
    testing.expectEqual("OperationError", overLengthError.name);
  });
</script>

<script id=hmac-verify-length-mismatch type=module>
  const state = await testing.async();
  // A signature whose length differs from the MAC resolves to false rather
  // than rejecting (and a truncated-but-matching prefix must not pass).
  const key = await crypto.subtle.generateKey(
    { name: "HMAC", hash: "SHA-256" }, true, ["sign", "verify"],
  );
  const data = new TextEncoder().encode("over 9000");
  const sig = await crypto.subtle.sign("HMAC", key, data);

  const verifyFull = await crypto.subtle.verify("HMAC", key, sig, data);
  const verifyTruncated = await crypto.subtle.verify("HMAC", key, sig.slice(0, 16), data);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, verifyFull);
    testing.expectEqual(false, verifyTruncated);
  });
</script>

<script id=sign-verify-names type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const data = new TextEncoder().encode("names");
  const hmac = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, true, ["sign", "verify"]);
  const signOnly = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, true, ["sign"]);
  const verifyOnly = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, true, ["verify"]);
  const aes = await subtle.generateKey({ name: "AES-GCM", length: 128 }, true, ["encrypt"]);
  const ecdsa = await subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  const ecdh = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const x25519 = await subtle.generateKey({ name: "X25519" }, true, ["deriveBits"]);
  const ecdsaAlgo = { name: "ECDSA", hash: "SHA-256" };

  const mac = await subtle.sign("HMAC", hmac, data);
  const results = {
    // Algorithm names match case-insensitively, for HMAC as for RSA.
    lowerSign: hex(await subtle.sign("hmac", hmac, data)),
    mixedVerify: await subtle.verify({ name: "hMaC" }, hmac, mac, data),
    // A name that isn't a signing algorithm is NotSupportedError, whatever the key.
    prefixSign: await errorName(() => subtle.sign("HMACX", hmac, data)),
    prefixVerify: await errorName(() => subtle.verify("HMAC-SHA256", hmac, mac, data)),
    unknownOnEcdsa: await errorName(() => subtle.sign("foo", ecdsa.privateKey, data)),
    ecdhName: await errorName(() => subtle.sign("ECDH", ecdh.privateKey, data)),
    x25519Name: await errorName(() => subtle.sign("X25519", x25519.privateKey, data)),
    aesName: await errorName(() => subtle.sign("AES-GCM", aes, data)),
    // A signing algorithm other than the key's, or a key without the usage,
    // is InvalidAccessError.
    hmacOnAes: await errorName(() => subtle.sign("HMAC", aes, data)),
    hmacOnEcdsa: await errorName(() => subtle.sign("HMAC", ecdsa.privateKey, data)),
    ecdsaOnHmac: await errorName(() => subtle.verify(ecdsaAlgo, hmac, mac, data)),
    noSign: await errorName(() => subtle.sign("HMAC", verifyOnly, data)),
    noVerify: await errorName(() => subtle.verify("HMAC", signOnly, mac, data)),
    ecdsaPublicSign: await errorName(() => subtle.sign(ecdsaAlgo, ecdsa.publicKey, data)),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual(hex(mac), results.lowerSign);
    testing.expectEqual(true, results.mixedVerify);
    testing.expectEqual("NotSupportedError", results.prefixSign);
    testing.expectEqual("NotSupportedError", results.prefixVerify);
    testing.expectEqual("NotSupportedError", results.unknownOnEcdsa);
    testing.expectEqual("NotSupportedError", results.ecdhName);
    testing.expectEqual("NotSupportedError", results.x25519Name);
    testing.expectEqual("NotSupportedError", results.aesName);
    testing.expectEqual("InvalidAccessError", results.hmacOnAes);
    testing.expectEqual("InvalidAccessError", results.hmacOnEcdsa);
    testing.expectEqual("InvalidAccessError", results.ecdsaOnHmac);
    testing.expectEqual("InvalidAccessError", results.noSign);
    testing.expectEqual("InvalidAccessError", results.noVerify);
    testing.expectEqual("InvalidAccessError", results.ecdsaPublicSign);
  });
</script>

<script>
  // helper: runs generateKey and captures the rejection's error name (or null
  // if it unexpectedly resolved). Returns { algo, expected, actual } so the
  // caller can assert synchronously inside state.done.
  window.captureGenKeyReject = async function(algo, extractable, usages, expected) {
    try {
      await crypto.subtle.generateKey(algo, extractable, usages);
      return { algo, expected, actual: null };
    } catch (err) {
      return { algo, expected, actual: err.name };
    }
  };

  // assert a list of capture results synchronously.
  window.assertGenKeyRejects = function(results) {
    for (const r of results) {
      testing.expectEqual(r.expected, r.actual);
    }
  };
</script>
