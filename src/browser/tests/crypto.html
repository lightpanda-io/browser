    // A signing algorithm other than the key's, or a key without the usage,
    // is InvalidAccessError.
    hmacOnAes: await errorName(() => subtle.sign("HMAC", aes, data)),
    hmacOnEcdsa: await errorName(() => subtle.sign("HMAC", ecdsa.privateKey, data)),
    ecdsaOnHmac: await errorName(() => subtle.verify(ecdsaAlgo, hmac, mac, data)),
    noSign: await errorName(() => subtle.sign("HMAC", verifyOnly, data)),
    noVerify: await errorName(() => subtle.verify("HMAC", signOnly, mac, data)),
    ecdsaPublicSign: await errorName(() => subtle.sign(ecdsaAlgo, ecdsa.publicKey, data)),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual(hex(mac), results.lowerSign);
    testing.expectEqual(true, results.mixedVerify);
    testing.expectEqual("NotSupportedError", results.prefixSign);
    testing.expectEqual("NotSupportedError", results.prefixVerify);
    testing.expectEqual("NotSupportedError", results.unknownOnEcdsa);
    testing.expectEqual("NotSupportedError", results.ecdhName);
    testing.expectEqual("NotSupportedError", results.x25519Name);
    testing.expectEqual("NotSupportedError", results.aesName);
    testing.expectEqual("InvalidAccessError", results.hmacOnAes);
    testing.expectEqual("InvalidAccessError", results.hmacOnEcdsa);
    testing.expectEqual("InvalidAccessError", results.ecdsaOnHmac);
    testing.expectEqual("InvalidAccessError", results.noSign);
    testing.expectEqual("InvalidAccessError", results.noVerify);
    testing.expectEqual("InvalidAccessError", results.ecdsaPublicSign);
  });
</script>

<script>
  // helper: runs generateKey and captures the rejection's error name (or null
  // if it unexpectedly resolved). Returns { algo, expected, actual } so the
  // caller can assert synchronously inside state.done.
  window.captureGenKeyReject = async function(algo, extractable, usages, expected) {
    try {
      await crypto.subtle.generateKey(algo, extractable, usages);
      return { algo, expected, actual: null };
    } catch (err) {
      return { algo, expected, actual: err.name };
    }
  };

  // assert a list of capture results synchronously.
  window.assertGenKeyRejects = function(results) {
    for (const r of results) {
      testing.expectEqual(r.expected, r.actual);
    }
  };
</script>

<script id=generateKey-rsa-validation type=module>
  const state = await testing.async();
  const goodExp = new Uint8Array([1, 0, 1]); // 65537

  const results = [
    // Bad name: NotSupportedError.
    await captureGenKeyReject(
      { name: "RSA", hash: "SHA-256", modulusLength: 2048, publicExponent: goodExp },
      true, ["sign"], "NotSupportedError",
    ),
    // Bad hash: NotSupportedError.
    await captureGenKeyReject(
      { name: "RSA-PSS", hash: "SHA", modulusLength: 2048, publicExponent: goodExp },
      true, ["sign"], "NotSupportedError",
    ),
    // Bad usages: SyntaxError. RSASSA only allows sign/verify.
    await captureGenKeyReject(
      { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256", modulusLength: 2048, publicExponent: goodExp },
      true, ["encrypt"], "SyntaxError",
    ),
    // RSA-OAEP only allows encrypt/decrypt/wrapKey/unwrapKey.
    await captureGenKeyReject(
      { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 2048, publicExponent: goodExp },
      true, ["sign"], "SyntaxError",
    ),
    // Bad publicExponent: OperationError.
    await captureGenKeyReject(
      { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 2048, publicExponent: new Uint8Array([1]) },
      true, ["encrypt"], "OperationError",
    ),
    await captureGenKeyReject(
      { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 0]) },
      true, ["encrypt"], "OperationError",
    ),
    // Empty usages: SyntaxError.
    await captureGenKeyReject(
      { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 2048, publicExponent: goodExp },
      true, [], "SyntaxError",
    ),
  ];
  // modulusLength is an [EnforceRange] unsigned long: out of range is a
  // TypeError, before the usages are looked at (2^32 + 1024 used to wrap to a
  // 1024-bit key).
  for (const name of ["RSA-OAEP", "RSASSA-PKCS1-v1_5", "RSA-PSS"]) {
    const usages = name === "RSA-OAEP" ? ["decrypt"] : ["sign"];
    for (const modulusLength of [2 ** 32 + 1024, -1024, NaN, Infinity]) {
      const algo = { name, hash: "SHA-256", modulusLength, publicExponent: goodExp };
      results.push(await captureGenKeyReject(algo, true, usages, "TypeError"));
      results.push(await captureGenKeyReject(algo, true, [], "TypeError"));
    }
  }
  // An undefined modulusLength is a TypeError too.
  results.push(await captureGenKeyReject(
    { name: "RSA-OAEP", hash: "SHA-256", modulusLength: undefined, publicExponent: goodExp }, true, ["decrypt"], "TypeError",
  ));
  // Other algorithms ignore stray RSA members, valid or not.
  results.push(await captureGenKeyReject({ name: "HMAC", hash: "SHA-256", modulusLength: -1 }, true, ["sign"], null));
  results.push(await captureGenKeyReject({ name: "HMAC", hash: "SHA-256", publicExponent: goodExp }, true, ["sign"], null));
  // The TypeError rejects the promise; it isn't thrown.
  const rejected = crypto.subtle.generateKey(
    { name: "RSA-OAEP", hash: "SHA-256", modulusLength: -1, publicExponent: goodExp }, true, ["decrypt"],
  );
  const rejectedIsPromise = rejected instanceof Promise;
  await rejected.catch(() => {});
  // In range, the value is truncated as usual.
  const truncated = await crypto.subtle.generateKey(
    { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256", modulusLength: 1024.9, publicExponent: goodExp }, true, ["sign"],
  );
  state.resolve();
  await state.done(() => {
    assertGenKeyRejects(results);
    testing.expectEqual(true, rejectedIsPromise);
    testing.expectEqual(1024, truncated.privateKey.algorithm.modulusLength);
  });
</script>

<script id=hmac-length-and-hash type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const raw = new Uint8Array(32).map((_, i) => i + 1);
  const gen = (params) => subtle.generateKey({ name: "HMAC", hash: "SHA-256", ...params }, true, ["sign"]);
  const imp = (params) => subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256", ...params }, true, ["sign"]);

  // The hash matches case-insensitively and is reported in canonical form.
  const lowerHash = await gen({ hash: "sha-256" });
  const objectHash = await gen({ hash: { name: "sHa-384" } });
  const lowerImport = await imp({ hash: "sha-512" });
  const lowerJwk = await subtle.exportKey("jwk", lowerImport);

  // A generated length needn't be whole bytes: the bits past it are zero.
  let lowBits = 0;
  const sizes = new Set();
  for (let i = 0; i < 32; i++) {
    const seven = new Uint8Array(await subtle.exportKey("raw", await gen({ length: 7 })));
    const odd = new Uint8Array(await subtle.exportKey("raw", await gen({ length: 257 })));
    sizes.add(`${seven.length},${odd.length}`);
    lowBits |= (seven[0] & 0x01) | (odd[32] & 0x7f);
  }
  const k7 = await gen({ length: 7 });
  const k257 = await gen({ length: 257 });
  // A JWK has no length: re-imported, the key is whole bytes again.
  const k257Jwk = await subtle.exportKey("jwk", k257);
  const reimported = await subtle.importKey("jwk", k257Jwk, { name: "HMAC", hash: "SHA-256" }, true, ["sign"]);

  // Importing, a length must end in the key's last byte; the key isn't cut.
  const whole = await imp({});
  const k255 = await imp({ length: 255 });
  const sameMac = hex(await subtle.sign("HMAC", whole, raw)) === hex(await subtle.sign("HMAC", k255, raw));
  const k255Raw = await subtle.exportKey("raw", k255);
  const b64url = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/=+$/, "").replace(/\+/g, "-").replace(/\//g, "_");
  const jwk = { kty: "oct", k: b64url(raw), alg: "HS256" };
  const jwk250 = await subtle.importKey("jwk", jwk, { name: "HMAC", hash: "SHA-256", length: 250 }, true, ["sign"]);

  // deriveKey takes the same length, and a lowercase hash.
  const pbkdf2 = await subtle.importKey("raw", raw, "PBKDF2", false, ["deriveKey"]);
  const derived = await subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: new Uint8Array(8), iterations: 2 },
    pbkdf2,
    { name: "HMAC", hash: "sha-256", length: 128 },
    true,
    ["sign"],
  );

  const results = {
    // [EnforceRange] unsigned long: out of range is a TypeError, before the usages.
    genHuge: await errorName(() => gen({ length: 2 ** 32 + 128 })),
    genHugeNoUsages: await errorName(() => subtle.generateKey({ name: "HMAC", hash: "SHA-256", length: 2 ** 32 + 128 }, true, [])),
    genNegative: await errorName(() => gen({ length: -1 })),
    genNaN: await errorName(() => gen({ length: NaN })),
    genZero: await errorName(() => gen({ length: 0 })),
    importHuge: await errorName(() => imp({ length: 2 ** 32 + 8 })),
    deriveHuge: await errorName(() => subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: new Uint8Array(8), iterations: 2 }, pbkdf2,
      { name: "HMAC", hash: "SHA-256", length: -8 }, true, ["sign"])),
    import256: await errorName(() => imp({ length: 256 })),
    import249: await errorName(() => imp({ length: 249 })),
    import248: await errorName(() => imp({ length: 248 })),
    import257: await errorName(() => imp({ length: 257 })),
    import0: await errorName(() => imp({ length: 0 })),
    jwk200: await errorName(() => subtle.importKey("jwk", jwk, { name: "HMAC", hash: "SHA-256", length: 200 }, true, ["sign"])),
    // RSA imports share HMAC's dictionary shape, and ignore a stray length.
    rsaWithLength: await errorName(() => subtle.importKey("spki", rsaTestKey.spki, { name: "RSA-OAEP", hash: "SHA-256", length: -1 }, true, ["encrypt"])),
    // null converts to 0, as for any unsigned long.
    genNull: await errorName(() => gen({ length: null })),
    importNull: await errorName(() => imp({ length: null })),
    // Generation is capped at 2^16 bits: any longer key is hashed down to the
    // block size anyway, and an unsigned long could ask for 512MB.
    genMax: await errorName(() => gen({ length: 2 ** 16 })),
    genOverMax: await errorName(() => gen({ length: 2 ** 16 + 8 })),
    genGigantic: await errorName(() => gen({ length: 2 ** 31 })),
    // deriveKey goes by the name: not an HMAC key for another algorithm with a hash.
    deriveUnknown: await errorName(() => subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: new Uint8Array(8), iterations: 2 }, pbkdf2,
      { name: "Foo", hash: "SHA-256" }, true, ["sign"])),
  };
  const aesWithHash = await subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: new Uint8Array(8), iterations: 2 }, pbkdf2,
    { name: "AES-GCM", length: 128, hash: "SHA-256" }, true, ["encrypt"],
  );

  state.resolve();
  await state.done(() => {
    testing.expectEqual("SHA-256 512", `${lowerHash.algorithm.hash.name} ${lowerHash.algorithm.length}`);
    testing.expectEqual("SHA-384 1024", `${objectHash.algorithm.hash.name} ${objectHash.algorithm.length}`);
    testing.expectEqual("SHA-512 HS512", `${lowerImport.algorithm.hash.name} ${lowerJwk.alg}`);
    testing.expectEqual("1,33", [...sizes].join("|"));
    testing.expectEqual(0, lowBits);
    testing.expectEqual(7, k7.algorithm.length);
    testing.expectEqual(257, k257.algorithm.length);
    testing.expectEqual("HS256", k257Jwk.alg);
    testing.expectEqual(264, reimported.algorithm.length);
    testing.expectEqual(256, whole.algorithm.length);
    testing.expectEqual(255, k255.algorithm.length);
    testing.expectEqual(32, k255Raw.byteLength);
    testing.expectEqual(true, sameMac);
    testing.expectEqual(250, jwk250.algorithm.length);
    testing.expectEqual("SHA-256 128", `${derived.algorithm.hash.name} ${derived.algorithm.length}`);
    testing.expectEqual("TypeError", results.genHuge);
    testing.expectEqual("TypeError", results.genHugeNoUsages);
    testing.expectEqual("TypeError", results.genNegative);
    testing.expectEqual("TypeError", results.genNaN);
    testing.expectEqual("OperationError", results.genZero);
    testing.expectEqual("TypeError", results.importHuge);
    testing.expectEqual("TypeError", results.deriveHuge);
    testing.expectEqual(null, results.import256);
    testing.expectEqual(null, results.import249);
    testing.expectEqual("DataError", results.import248);
    testing.expectEqual("DataError", results.import257);
    testing.expectEqual("DataError", results.import0);
    testing.expectEqual("DataError", results.jwk200);
    testing.expectEqual(null, results.rsaWithLength);
    testing.expectEqual("OperationError", results.genNull);
    testing.expectEqual("DataError", results.importNull);
    testing.expectEqual(null, results.genMax);
    testing.diverges("Lightpanda caps generated HMAC keys at 2^16 bits; Chrome has no cap", () => {
      testing.expectEqual("OperationError", results.genOverMax);
      testing.expectEqual("OperationError", results.genGigantic);
    });
    testing.expectEqual("NotSupportedError", results.deriveUnknown);
    testing.expectEqual("AES-GCM 128", `${aesWithHash.algorithm.name} ${aesWithHash.algorithm.length}`);
  });
</script>

<script id=algorithm-without-name type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const raw = new Uint8Array(16);
  const data = new Uint8Array(8);
  const e = new Uint8Array([1, 0, 1]);
  const aes = await subtle.generateKey({ name: "AES-GCM", length: 128 }, true, ["encrypt", "decrypt"]);
  const kw = await subtle.generateKey({ name: "AES-KW", length: 128 }, true, ["wrapKey", "unwrapKey"]);
  const hmac = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, true, ["sign", "verify"]);
  const ecdsa = await subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign"]);
  const rsa = await subtle.generateKey({ name: "RSA-OAEP", modulusLength: 1024, publicExponent: e, hash: "SHA-256" }, true, ["encrypt", "decrypt"]);
  const spki = await subtle.exportKey("spki", rsa.publicKey);
  const pbkdf2 = await subtle.importKey("raw", raw, "PBKDF2", false, ["deriveBits", "deriveKey"]);
  const deriveKeyOnly = await subtle.importKey("raw", raw, "PBKDF2", false, ["deriveKey"]);
  const hkdf = await subtle.importKey("raw", raw, "HKDF", false, ["deriveBits"]);
  const pbkdf2Params = (hash) => ({ name: "PBKDF2", hash, salt: raw, iterations: 1 });
  const wrapped = await subtle.wrapKey("raw", aes, kw, "AES-KW");

  const results = {
    // An algorithm object without a name is a TypeError, whatever its other
    // members, instead of the name "[object Object]".
    importEmpty: await errorName(() => subtle.importKey("raw", raw, {}, true, ["encrypt"])),
    importHashOnly: await errorName(() => subtle.importKey("raw", raw, { hash: "SHA-256" }, true, ["sign"])),
    importCurveOnly: await errorName(() => subtle.importKey("raw", raw, { namedCurve: "P-256" }, true, [])),
    importArray: await errorName(() => subtle.importKey("raw", raw, [], true, ["encrypt"])),
    importJwk: await errorName(() => subtle.importKey("jwk", { kty: "oct", k: "AAAAAAAAAAAAAAAAAAAAAA" }, {}, true, ["encrypt"])),
    encrypt: await errorName(() => subtle.encrypt({ iv: new Uint8Array(12) }, aes, data)),
    decrypt: await errorName(() => subtle.decrypt({}, aes, data)),
    sign: await errorName(() => subtle.sign({ hash: "SHA-256" }, hmac, data)),
    verify: await errorName(() => subtle.verify({}, hmac, data, data)),
    deriveKeyType: await errorName(() => subtle.deriveKey(pbkdf2Params("SHA-256"), pbkdf2, { length: 128 }, true, ["encrypt"])),
    wrapKey: await errorName(() => subtle.wrapKey("raw", aes, kw, {})),
    unwrapKey: await errorName(() => subtle.unwrapKey("raw", wrapped, kw, {}, "AES-GCM", true, ["encrypt"])),
    unwrappedKey: await errorName(() => subtle.unwrapKey("raw", wrapped, kw, "AES-KW", {}, true, ["encrypt"])),
    // The unwrapping algorithm is normalized first, the unwrapped key's next,
    // and the key checks come after both.
    unwrapUnknownFirst: await errorName(() => subtle.unwrapKey("raw", wrapped, kw, "foo", {}, true, ["encrypt"])),
    unwrapBeforeKey: await errorName(() => subtle.unwrapKey("raw", wrapped, aes, "AES-KW", {}, true, ["encrypt"])),
    unwrapHashBeforeKey: await errorName(() => subtle.unwrapKey("raw", wrapped, aes, "AES-KW", { name: "HMAC", hash: {} }, true, ["sign"])),
    // For HMAC and RSA, which take a hash, a missing or unknown one is
    // rejected there too; another algorithm's stray hash is ignored.
    unwrapNoHashBeforeKey: await errorName(() => subtle.unwrapKey("raw", wrapped, aes, "AES-KW", "HMAC", true, ["sign"])),
    unwrapUnknownHashBeforeKey: await errorName(() => subtle.unwrapKey("raw", wrapped, aes, "AES-KW", { name: "HMAC", hash: "SHA-999" }, true, ["sign"])),
    unwrapRsaUnknownHash: await errorName(() => subtle.unwrapKey("raw", wrapped, aes, "AES-KW", { name: "RSA-OAEP", hash: "SHA-999" }, true, ["encrypt"])),
    unwrapAesStrayHash: await errorName(() => subtle.unwrapKey("raw", wrapped, kw, "AES-KW", { name: "AES-GCM", hash: {} }, true, ["encrypt"])),
    unwrapAesStrayHashKey: await errorName(() => subtle.unwrapKey("raw", wrapped, aes, "AES-KW", { name: "AES-GCM", hash: {} }, true, ["encrypt"])),
    // deriveKey normalizes the algorithm before derivedKeyType.
    deriveHashFirst: await errorName(() => subtle.deriveKey(pbkdf2Params({}), pbkdf2, "AES-FOO", true, ["encrypt"])),
    // A name that isn't a known algorithm stays NotSupportedError: a
    // function's own name (""), null as a string, a number.
    importFunction: await errorName(() => subtle.importKey("raw", raw, function () {}, true, ["encrypt"])),
    importNull: await errorName(() => subtle.importKey("raw", raw, null, true, ["encrypt"])),
    importNumberName: await errorName(() => subtle.importKey("raw", raw, { name: 1 }, true, ["encrypt"])),
    // So is a hash without a name, for every algorithm that takes one.
    generateHmacHash: await errorName(() => subtle.generateKey({ name: "HMAC", hash: {} }, true, ["sign"])),
    generateRsaHash: await errorName(() => subtle.generateKey({ name: "RSA-OAEP", modulusLength: 1024, publicExponent: e, hash: {} }, true, ["sign"])),
    importHmacHash: await errorName(() => subtle.importKey("raw", raw, { name: "HMAC", hash: {} }, true, ["sign"])),
    importRsaHash: await errorName(() => subtle.importKey("spki", spki, { name: "RSA-OAEP", hash: {} }, true, ["encrypt"])),
    pbkdf2Hash: await errorName(() => subtle.deriveBits(pbkdf2Params({}), pbkdf2, 128)),
    hkdfHash: await errorName(() => subtle.deriveBits({ name: "HKDF", hash: {}, salt: raw, info: raw }, hkdf, 128)),
    deriveHmacHash: await errorName(() => subtle.deriveKey(pbkdf2Params("SHA-256"), pbkdf2, { name: "HMAC", hash: {} }, true, ["sign"])),
    ecdsaHashArray: await errorName(() => subtle.sign({ name: "ECDSA", hash: [] }, ecdsa.privateKey, data)),
    ecdsaHashFunction: await errorName(() => subtle.sign({ name: "ECDSA", hash: function () {} }, ecdsa.privateKey, data)),
    // The hash is normalized before the base key's checks.

<script id=derive-algorithm-names type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const hex = (buf) => Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  const raw = new Uint8Array(16);
  const hkdfKey = await subtle.importKey("raw", raw, "HKDF", false, ["deriveBits", "deriveKey"]);
  const pbkdf2Key = await subtle.importKey("raw", raw, "PBKDF2", false, ["deriveBits"]);
  const ecdh = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
  const hkdf = { name: "HKDF", hash: "SHA-256", salt: raw, info: raw };
  const pbkdf2 = { name: "PBKDF2", hash: "SHA-256", salt: raw, iterations: 1 };
  const aes = { name: "AES-GCM", length: 128 };

  const results = {
    hkdf: hex(await subtle.deriveBits(hkdf, hkdfKey, 128)),
    pbkdf2: hex(await subtle.deriveBits(pbkdf2, pbkdf2Key, 128)),
    // The name picks the algorithm, case-insensitively for ASCII only
    // (U+212A KELVIN SIGN isn't "K").
    lower: hex(await subtle.deriveBits({ ...hkdf, name: "hkdf" }, hkdfKey, 128)),
    hkdfKelvin: await errorName(() => subtle.deriveBits({ ...hkdf, name: "H\u212ADF" }, hkdfKey, 128)),
    pbkdf2Kelvin: await errorName(() => subtle.deriveBits({ ...pbkdf2, name: "PB\u212ADF2" }, pbkdf2Key, 128)),
    unknownName: await errorName(() => subtle.deriveBits({ ...hkdf, name: "foo" }, hkdfKey, 128)),
    unknownString: await errorName(() => subtle.deriveBits("foo", pbkdf2Key, 128)),
    unknownNull: await errorName(() => subtle.deriveBits(null, pbkdf2Key, 128)),
    unknownDeriveKey: await errorName(() => subtle.deriveKey({ ...hkdf, name: "foo" }, hkdfKey, aes, true, ["encrypt"])),
    // Another algorithm's members are ignored, not taken as its params.
    hkdfIterations: hex(await subtle.deriveBits({ ...hkdf, iterations: 1 }, hkdfKey, 128)),
    pbkdf2Info: hex(await subtle.deriveBits({ ...pbkdf2, info: raw }, pbkdf2Key, 128)),
    // The params of the named algorithm are required: a TypeError without one
    // of its members, a bare string name, or an object without a name.
    hkdfMissingInfo: await errorName(() => subtle.deriveBits({ ...pbkdf2, name: "HKDF" }, hkdfKey, 128)),
    pbkdf2MissingIterations: await errorName(() => subtle.deriveBits({ ...hkdf, name: "PBKDF2" }, pbkdf2Key, 128)),
    ecdhMissingPublic: await errorName(() => subtle.deriveBits({ ...hkdf, name: "ECDH" }, ecdh.privateKey, 128)),
    bareName: await errorName(() => subtle.deriveBits("PBKDF2", pbkdf2Key, 128)),
    noName: await errorName(() => subtle.deriveBits({}, pbkdf2Key, 128)),
    badSalt: await errorName(() => subtle.deriveBits({ ...pbkdf2, salt: "x" }, pbkdf2Key, 128)),
    // iterations is an [EnforceRange] unsigned long: truncated, not wrapped.
    iterationsFraction: hex(await subtle.deriveBits({ ...pbkdf2, iterations: 1.9 }, pbkdf2Key, 128)),
    iterationsNegative: await errorName(() => subtle.deriveBits({ ...pbkdf2, iterations: -1 }, pbkdf2Key, 128)),
    iterationsTooLarge: await errorName(() => subtle.deriveBits({ ...pbkdf2, iterations: 2 ** 32 + 1 }, pbkdf2Key, 128)),
    iterationsNaN: await errorName(() => subtle.deriveBits({ ...pbkdf2, iterations: NaN }, pbkdf2Key, 128)),
    hashWithoutName: await errorName(() => subtle.deriveBits({ ...hkdf, hash: {} }, hkdfKey, 128)),
    unknownHash: await errorName(() => subtle.deriveBits({ ...hkdf, hash: "foo" }, hkdfKey, 128)),
    // The hash is normalized with the algorithm: matched case-insensitively,
    // and an unknown one is rejected before derivedKeyType.
    lowerHash: hex(await subtle.deriveBits({ ...pbkdf2, hash: "sha-256" }, pbkdf2Key, 128)),
    lowerHashObject: hex(await subtle.deriveBits({ ...hkdf, hash: { name: "sha-256" } }, hkdfKey, 128)),
    unknownHashBeforeDerived: await errorName(() => subtle.deriveKey({ ...hkdf, hash: "SHA-999" }, hkdfKey, {}, true, ["encrypt"])),
    // deriveKey normalizes the algorithm before derivedKeyType.
    unknownBeforeDerived: await errorName(() => subtle.deriveKey({ ...hkdf, name: "foo" }, hkdfKey, "AES-FOO", true, ["encrypt"])),
    missingBeforeDerived: await errorName(() => subtle.deriveKey({ ...hkdf, info: undefined }, hkdfKey, "AES-FOO", true, ["encrypt"])),
    // The key checks come after.
    otherKey: await errorName(() => subtle.deriveBits(hkdf, pbkdf2Key, 128)),
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual(32, results.hkdf.length);
    testing.expectEqual(32, results.pbkdf2.length);
    testing.expectEqual(results.hkdf, results.lower);
    testing.expectEqual("NotSupportedError", results.hkdfKelvin);
    testing.expectEqual("NotSupportedError", results.pbkdf2Kelvin);
    testing.expectEqual("NotSupportedError", results.unknownName);
    testing.expectEqual("NotSupportedError", results.unknownString);
    testing.expectEqual("NotSupportedError", results.unknownNull);
    testing.expectEqual("NotSupportedError", results.unknownDeriveKey);
    testing.expectEqual(results.hkdf, results.hkdfIterations);
    testing.expectEqual(results.pbkdf2, results.pbkdf2Info);
    testing.expectEqual("TypeError", results.hkdfMissingInfo);
    testing.expectEqual("TypeError", results.pbkdf2MissingIterations);
    testing.expectEqual("TypeError", results.ecdhMissingPublic);
    testing.expectEqual("TypeError", results.bareName);
    testing.expectEqual("TypeError", results.noName);
    testing.expectEqual("TypeError", results.badSalt);
    testing.expectEqual(results.pbkdf2, results.iterationsFraction);
    testing.expectEqual("TypeError", results.iterationsNegative);
    testing.expectEqual("TypeError", results.iterationsTooLarge);
    testing.expectEqual("TypeError", results.iterationsNaN);
    testing.expectEqual("TypeError", results.hashWithoutName);
    testing.expectEqual("NotSupportedError", results.unknownHash);
    testing.expectEqual(results.pbkdf2, results.lowerHash);
    testing.expectEqual(results.hkdf, results.lowerHashObject);
    testing.expectEqual("NotSupportedError", results.unknownHashBeforeDerived);
    testing.expectEqual("NotSupportedError", results.unknownBeforeDerived);
    testing.expectEqual("TypeError", results.missingBeforeDerived);
    testing.expectEqual("InvalidAccessError", results.otherKey);
  });
</script>

<script id=ed25519 type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;

  const describe = (key) => `${key.type}:${key.algorithm.name}:${key.extractable}:${key.usages.join("+")}`;

  // RFC 8032, section 7.1, test 1 (an empty message).
  const seed = unhex("9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60");
  const pub = unhex("d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a");
  const sig = "e5564300c360ac729086e2cc806e828a84877f1eb8e5d974d873e065224901555fb8821590a33bacc61e39701cf9b46bd25bf5f0595bbe24655141438e7a100b";
  const msg = new Uint8Array(0);
  const x = "11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo";
  const d = "nWGxne_9WmC6hEr0kuwsxERJxWl7MmkZcDusAxyuf2A";
  const jwkPublic = { kty: "OKP", crv: "Ed25519", x };
  const identity = new Uint8Array(32);

    algEd25519: describe(await subtle.importKey("jwk", { ...jwkPublic, alg: "Ed25519" }, "Ed25519", true, ["verify"])),
    algOther: await errorName(() => subtle.importKey("jwk", { ...jwkPublic, alg: "ES256" }, "Ed25519", true, ["verify"])),
    useEnc: await errorName(() => subtle.importKey("jwk", { ...jwkPublic, use: "enc" }, "Ed25519", true, ["verify"])),
    ktyEc: await errorName(() => subtle.importKey("jwk", { ...jwkPublic, kty: "EC" }, "Ed25519", true, ["verify"])),
    crvX25519: await errorName(() => subtle.importKey("jwk", { ...jwkPublic, crv: "X25519" }, "Ed25519", true, ["verify"])),
    crvLower: await errorName(() => subtle.importKey("jwk", { ...jwkPublic, crv: "ed25519" }, "Ed25519", true, ["verify"])),
    missingX: await errorName(() => subtle.importKey("jwk", { kty: "OKP", crv: "Ed25519", d }, "Ed25519", true, ["sign"])),
    shortX: await errorName(() => subtle.importKey("jwk", { ...jwkPublic, x: x.slice(0, -1) }, "Ed25519", true, ["verify"])),
    // A private JWK's x must be its d's public key.
    otherX: await errorName(() => subtle.importKey("jwk", { ...jwkPrivate, x: "hSDwCYkwp1R0i33ctD73Wg2_Og0mOBr066SpjqqbTmo" }, "Ed25519", true, ["sign"])),

    privateVerify: await errorName(() => subtle.importKey("jwk", jwkPrivate, "Ed25519", true, ["verify"])),
    rawShort: await errorName(() => subtle.importKey("raw", pub.slice(1), "Ed25519", true, ["verify"])),

<script id=x25519-peer-check type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {
    try {
      await fn();
      return null;
    } catch (err) {
      return err.name;
    }
  };
  const x25519 = await subtle.generateKey("X25519", false, ["deriveBits"]);
  const aes = await subtle.generateKey({ name: "AES-GCM", length: 128 }, false, ["encrypt"]);
  const hmac = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const ecdh = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
  const derive = (peer) => subtle.deriveBits({ name: "X25519", public: peer }, x25519.privateKey, 256);

  // The peer must be an X25519 public key. An AES or HMAC key, which holds
  // no EVP_PKEY, used to crash here.
  const results = {
    aes: await errorName(() => derive(aes)),
    hmac: await errorName(() => derive(hmac)),
    ecdh: await errorName(() => derive(ecdh.publicKey)),
    privateKey: await errorName(() => derive(x25519.privateKey)),
    publicKey: (await derive(x25519.publicKey)).byteLength,
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual("InvalidAccessError", results.aes);
    testing.expectEqual("InvalidAccessError", results.hmac);
    testing.expectEqual("InvalidAccessError", results.ecdh);
    testing.expectEqual("InvalidAccessError", results.privateKey);
    testing.expectEqual(32, results.publicKey);
  });
</script>

<script id=x25519-keys type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const errorName = async (fn) => {

      return null;

  const b64u = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const describe = (key) => `${key.type}:${key.algorithm.name}:${key.extractable}:${key.usages.join("+")}`;

  // RFC 7748, section 6.1.
  const alicePrivate = unhex("77076d0a7318a57d3c16c17251b26645df4c2f87ebc0992ab177fba51db92c2a");
  const alicePublic = unhex("8520f0098930a754748b7ddcb43ef75a0dbf3a0d26381af4eba4a98eaa9b4e6a");
  const bobPublic = unhex("de9edb7d7b7dc1b4d35b61c2ece435373f8343c85b78674dadfc7e146f882b4f");
  const shared = "4a5d9d5ba4ce2de1728e3bf480350f25e07e21c947d19e3376f09b3c1e161742";
  const pkcs8 = unhex("302e020100300506032b656e04220420" + hex(alicePrivate));

  const alice = await subtle.importKey("pkcs8", pkcs8, "X25519", true, ["deriveBits", "deriveKey"]);
  const bob = await subtle.importKey("raw", bobPublic, { name: "x25519" }, true, []);

  const results = {
    shared: hex(await derive(bob, 256)),

    shared12: hex(await derive(bob, 12)),
    tooLong: await errorName(() => derive(bob, 264)),
    // The peer must be an X25519 public key: not a key of another algorithm
    // (which used to crash here) nor a private key.
    aesPeer: await errorName(() => derive(aes, 256)),
    ed25519Peer: await errorName(() => derive(ed25519.publicKey, 256)),
    privatePeer: await errorName(() => derive(alice, 256)),
    // A peer of small order gives an all-zero secret.
    smallOrderPeer: await errorName(async () => derive(await subtle.importKey("raw", new Uint8Array(32), "X25519", false, []), 256)),
    raw: hex(await subtle.exportKey("raw", bob)),

<script id=generate-import-by-name type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const outcome = async (fn) => {
    try {
      const r = await fn();
      return r instanceof CryptoKey ? `${r.type}:${r.algorithm.name}` : `pair:${r.privateKey.algorithm.name}`;
    } catch (err) {
      return err.name;
    }
  };
  const e = new Uint8Array([1, 0, 1]);
  const raw = new Uint8Array(16);
  const ec = await subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  const spki = await subtle.exportKey("spki", ec.publicKey);
  const aes = await subtle.generateKey({ name: "AES-GCM", length: 128 }, true, ["encrypt"]);
  const kw = await subtle.generateKey({ name: "AES-KW", length: 128 }, true, ["wrapKey", "unwrapKey"]);
  const wrapped = await subtle.wrapKey("raw", aes, kw, "AES-KW");
  const gen = (algo, usages) => outcome(() => subtle.generateKey(algo, true, usages));

  // The name picks the algorithm, then its params are read: another
  // algorithm's member is ignored, a missing one of its own is a TypeError,
  // and an [EnforceRange] one out of range is a TypeError too.
  const results = {
    genAesStrayHash: await gen({ name: "AES-GCM", length: 128, hash: "SHA-256" }, ["encrypt"]),
    genEd25519StrayHash: await gen({ name: "Ed25519", hash: "SHA-256" }, ["sign"]),
    genEd25519StrayCurve: await gen({ name: "Ed25519", namedCurve: "P-256" }, ["sign"]),
    genX25519StrayCurve: await gen({ name: "X25519", namedCurve: "P-256" }, ["deriveBits"]),
    genHmacStrayCurve: await gen({ name: "HMAC", hash: "SHA-256", namedCurve: "P-256" }, ["sign"]),
    genAesLengthWrapped: await gen({ name: "AES-GCM", length: 2 ** 32 + 128 }, ["encrypt"]),
    genAesLengthOverShort: await gen({ name: "AES-GCM", length: 2 ** 16 + 128 }, ["encrypt"]),
    genAesLengthNegative: await gen({ name: "AES-GCM", length: -1 }, ["encrypt"]),
    genAesLengthFraction: await gen({ name: "AES-GCM", length: 128.9 }, ["encrypt"]),
    genAesNoLength: await gen({ name: "AES-GCM" }, ["encrypt"]),
    genHmacNoHash: await gen({ name: "HMAC" }, ["sign"]),
    genEcdsaNoCurve: await gen({ name: "ECDSA" }, ["sign"]),
    genRsaNoModulus: await gen({ name: "RSA-OAEP", hash: "SHA-256", publicExponent: e }, ["encrypt"]),
    // The hash is normalized with the algorithm, before the usages.
    genRsaBadHashBadUsage: await gen({ name: "RSA-OAEP", hash: "SHA-999", modulusLength: 2048, publicExponent: e }, ["sign"]),
    genHmacBadHashBadUsage: await gen({ name: "HMAC", hash: "SHA-999" }, ["encrypt"]),
    // Anything but an object converts to a name: an unknown one.
    genNumber: await gen(5, ["sign"]),
    genNull: await gen(null, ["sign"]),
    genHkdf: await gen("HKDF", ["deriveBits"]),
    importEcdsaStrayHash: await outcome(() => subtle.importKey("spki", spki, { name: "ECDSA", namedCurve: "P-256", hash: "SHA-256" }, true, ["verify"])),
    importAesStrayCurve: await outcome(() => subtle.importKey("raw", raw, { name: "AES-GCM", namedCurve: "P-256" }, true, ["encrypt"])),
    importEcdsaNoCurve: await outcome(() => subtle.importKey("spki", spki, { name: "ECDSA" }, true, ["verify"])),
    importHmacNoHash: await outcome(() => subtle.importKey("raw", raw, "HMAC", true, ["sign"])),
    importRsaBadHashBadUsage: await outcome(() => subtle.importKey("spki", spki, { name: "RSA-OAEP", hash: "SHA-999" }, true, ["sign"])),
    importUnknown: await outcome(() => subtle.importKey("raw", raw, "foo", true, ["encrypt"])),
    // unwrapKey normalizes the unwrapped key's algorithm before the key checks.
    unwrapUnknownWrongKey: await outcome(() => subtle.unwrapKey("raw", wrapped, aes, "AES-KW", "foo", true, ["encrypt"])),
    unwrapAesStrayHash: await outcome(() => subtle.unwrapKey("raw", wrapped, kw, "AES-KW", { name: "AES-GCM", hash: "SHA-256" }, true, ["encrypt"])),
  };
  const expected = {
    genAesStrayHash: "secret:AES-GCM",
    genEd25519StrayHash: "pair:Ed25519",
    genEd25519StrayCurve: "pair:Ed25519",
    genX25519StrayCurve: "pair:X25519",
    genHmacStrayCurve: "secret:HMAC",
    genAesLengthWrapped: "TypeError",
    genAesLengthOverShort: "TypeError",
    genAesLengthNegative: "TypeError",
    genAesLengthFraction: "secret:AES-GCM",
    genAesNoLength: "TypeError",
    genHmacNoHash: "TypeError",
    genEcdsaNoCurve: "TypeError",
    genRsaNoModulus: "TypeError",
    genRsaBadHashBadUsage: "NotSupportedError",
    genHmacBadHashBadUsage: "NotSupportedError",
    genNumber: "NotSupportedError",
    genNull: "NotSupportedError",
    genHkdf: "NotSupportedError",
    importEcdsaStrayHash: "public:ECDSA",
    importAesStrayCurve: "secret:AES-GCM",
    importEcdsaNoCurve: "TypeError",
    importHmacNoHash: "TypeError",
    importRsaBadHashBadUsage: "NotSupportedError",
    importUnknown: "NotSupportedError",
    unwrapUnknownWrongKey: "NotSupportedError",
    unwrapAesStrayHash: "secret:AES-GCM",
  };

  state.resolve();
  await state.done(() => {
    // Compared with the case name, so a failure says which one.
    for (const [name, want] of Object.entries(expected)) {
      testing.expectEqual(`${name}: ${want}`, `${name}: ${results[name]}`);
    }
  });
</script>

  const state = await testing.async();
  // encrypt/decrypt/wrapKey, sign/verify and deriveKey's derivedKeyType are
  // normalized by name: another algorithm's member is ignored, a missing one
  // of its own is a TypeError, [EnforceRange] members don't wrap, and the
  // key checks come after. Each line is "case=outcome", as Chrome gives it.
  const s = crypto.subtle;
  const out = [];
  const show = (r) => r instanceof CryptoKey ? `key:${r.type}:${r.algorithm.name}:${r.algorithm.length ?? ""}` : r instanceof ArrayBuffer ? `buf:${r.byteLength}` : String(r);
  const run = async (label, f) => { try { out.push(label + "=" + show(await f())); } catch (e) { out.push(label + "=" + e.name); } };
  const data = new Uint8Array(16);
  const gcmKey = await s.generateKey({ name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt", "wrapKey"]);
  const cbcKey = await s.generateKey({ name: "AES-CBC", length: 128 }, false, ["encrypt"]);
  const ctrKey = await s.generateKey({ name: "AES-CTR", length: 128 }, false, ["encrypt"]);
  const kw = await s.generateKey({ name: "AES-KW", length: 128 }, false, ["wrapKey"]);
  const target = await s.generateKey({ name: "AES-GCM", length: 128 }, true, ["encrypt"]);

  await run("enc GCM no iv", () => s.encrypt({ name: "AES-GCM" }, gcmKey, data));
  await run("enc GCM tag 2^32+128", () => s.encrypt({ name: "AES-GCM", iv: iv12, tagLength: 2 ** 32 + 128 }, gcmKey, data));
  await run("enc GCM tag 256", () => s.encrypt({ name: "AES-GCM", iv: iv12, tagLength: 256 }, gcmKey, data));
  await run("enc GCM tag 96", () => s.encrypt({ name: "AES-GCM", iv: iv12, tagLength: 96 }, gcmKey, data));

  await run("enc GCM stray counter", () => s.encrypt({ name: "AES-GCM", iv: iv12, counter: 5, length: 999 }, gcmKey, data));
  await run("enc CTR ok", () => s.encrypt({ name: "AES-CTR", counter: iv16, length: 64 }, ctrKey, data));
  await run("enc CTR len 2^32+64", () => s.encrypt({ name: "AES-CTR", counter: iv16, length: 2 ** 32 + 64 }, ctrKey, data));

  await run("enc unknown", () => s.encrypt("foo", gcmKey, data));
  await run("enc nameless", () => s.encrypt({ iv: iv12 }, gcmKey, data));
  await run("wrap KW stray iv", () => s.wrapKey("raw", target, kw, { name: "AES-KW", iv: 5 }));

  const hmac = await s.generateKey({ name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const ecdsa = await s.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign"]);
  const ed = await s.generateKey("Ed25519", false, ["sign"]);
  await run("sign HMAC stray hash", () => s.sign({ name: "HMAC", hash: "SHA-999" }, hmac, data));
  await run("sign HMAC stray saltLength", () => s.sign({ name: "HMAC", saltLength: -5 }, hmac, data));
  await run("sign ECDSA no hash", () => s.sign({ name: "ECDSA" }, ecdsa.privateKey, data));
  await run("sign ECDSA string", () => s.sign("ECDSA", ecdsa.privateKey, data));
  await run("sign ECDSA bad hash", () => s.sign({ name: "ECDSA", hash: "SHA-999" }, ecdsa.privateKey, data));
  await run("sign PSS no salt", () => s.sign({ name: "RSA-PSS" }, hmac, data));
  await run("sign PSS salt 2^32", () => s.sign({ name: "RSA-PSS", saltLength: 2 ** 32 }, hmac, data));
  await run("sign PSS on HMAC key", () => s.sign({ name: "RSA-PSS", saltLength: 32 }, hmac, data));
  await run("sign Ed448", () => s.sign("Ed448", ed.privateKey, data));
  await run("sign Ed25519 stray hash", () => s.sign({ name: "Ed25519", hash: "SHA-999" }, ed.privateKey, data));
  await run("sign unknown", () => s.sign("foo", hmac, data));

  const pb = await s.importKey("raw", data, "PBKDF2", false, ["deriveKey"]);
  const pbp = { name: "PBKDF2", hash: "SHA-256", salt: data, iterations: 1 };
  const ecdh = await s.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
  const ecdhBits = await s.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
  const x = await s.generateKey("X25519", false, ["deriveKey"]);
  const dk = (type, ext, usages, algo = pbp, key = pb) => s.deriveKey(algo, key, type, ext, usages);
  await run("dk AES len 2^32+128", () => dk({ name: "AES-GCM", length: 2 ** 32 + 128 }, true, ["encrypt"]));
  await run("dk AES len 100", () => dk({ name: "AES-GCM", length: 100 }, true, ["encrypt"]));
  await run("dk AES no length", () => dk({ name: "AES-GCM" }, true, ["encrypt"]));
  await run("dk AES string", () => dk("AES-GCM", true, ["encrypt"]));
  await run("dk AES stray hash", () => dk({ name: "AES-GCM", length: 128, hash: "SHA-999" }, true, ["encrypt"]));
  await run("dk HMAC length 0", () => dk({ name: "HMAC", hash: "SHA-256", length: 0 }, true, ["sign"]));
  // The base key checks come before "get key length".
  await run("dk AES len 100 wrong key", () => dk({ name: "AES-GCM", length: 100 }, true, ["encrypt"], { name: "ECDH", public: ecdh.publicKey }, pb));
  await run("dk HMAC length 0 no usage", () => dk({ name: "HMAC", hash: "SHA-256", length: 0 }, true, ["sign"], { name: "ECDH", public: ecdh.publicKey }, ecdhBits.privateKey));
  // But the dictionary's conversion comes before them.
  await run("dk HMAC length -1 wrong key", () => dk({ name: "HMAC", hash: "SHA-256", length: -1 }, true, ["sign"], { name: "ECDH", public: ecdh.publicKey }, pb));
  await run("dk HMAC ok", () => dk({ name: "HMAC", hash: "SHA-256" }, true, ["sign"]));
  await run("dk HKDF from PBKDF2", () => dk("HKDF", false, ["deriveBits"]));
  await run("dk HKDF from ECDH", () => dk("HKDF", false, ["deriveBits"], { name: "ECDH", public: ecdh.publicKey }, ecdh.privateKey));
  await run("dk HKDF from X25519", () => dk({ name: "HKDF" }, false, ["deriveKey"], { name: "X25519", public: x.publicKey }, x.privateKey));
  await run("dk HKDF extractable", () => dk("HKDF", true, ["deriveBits"], { name: "ECDH", public: ecdh.publicKey }, ecdh.privateKey));
  await run("dk PBKDF2 from ECDH", () => dk("PBKDF2", false, ["deriveBits"], { name: "ECDH", public: ecdh.publicKey }, ecdh.privateKey));
  await run("dk ECDSA", () => dk({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign"]));
  await run("dk unknown", () => dk("foo", true, ["sign"]));
  const expected = [
    "enc GCM ok=buf:32",
    "enc GCM string=TypeError",
    "enc GCM no iv=TypeError",
    "enc GCM tag 2^32+128=TypeError",
    "enc GCM tag 256=TypeError",
    "enc GCM tag 96=buf:28",
    "enc GCM tag null=OperationError",
    "enc GCM stray counter=buf:32",
    "enc CTR ok=buf:16",

    "enc CTR len 256=TypeError",
    "enc CTR len 129=OperationError",
    "enc CTR len 0=OperationError",
    "enc CTR no length=TypeError",
    "enc CBC no iv=TypeError",
    "enc CBC stray tag=buf:32",
    "enc GCM on CBC key=InvalidAccessError",
    "enc AES-KW=NotSupportedError",
    "enc unknown=NotSupportedError",
    "enc nameless=TypeError",
    "wrap KW stray iv=buf:24",
    "wrap GCM string=TypeError",
    "wrap unknown=NotSupportedError",
    "sign HMAC stray hash=buf:32",
    "sign HMAC stray saltLength=buf:32",
    "sign ECDSA no hash=TypeError",
    "sign ECDSA string=TypeError",
    "sign ECDSA bad hash=NotSupportedError",
    "sign PSS no salt=TypeError",
    "sign PSS salt 2^32=TypeError",
    "sign PSS on HMAC key=InvalidAccessError",
    "sign Ed448=NotSupportedError",
    "sign Ed25519 stray hash=buf:64",
    "sign unknown=NotSupportedError",
    "dk AES len 2^32+128=TypeError",
    "dk AES len 100=OperationError",
    "dk AES no length=TypeError",
    "dk AES string=TypeError",
    "dk AES stray hash=key:secret:AES-GCM:128",
    "dk HMAC length 0=TypeError",
    "dk AES len 100 wrong key=InvalidAccessError",
    "dk HMAC length 0 no usage=InvalidAccessError",
    "dk HMAC length -1 wrong key=TypeError",

    "dk HKDF from PBKDF2=OperationError",
    "dk HKDF from ECDH=key:secret:HKDF:",
    "dk HKDF from X25519=key:secret:HKDF:",

<script id=buffers-after-normalization type=module>
  const state = await testing.async();
  // An algorithm is normalized before the operation reads its buffers, and
  // its name is read once: a getter on it that transfers the data, keyData or
  // wrapped key leaves the operation with an empty buffer, not the old bytes.
  // The buffers' types are still checked first. As Chrome gives each case.
  const s = crypto.subtle; const out = [];
  const show = (r) => r instanceof CryptoKey ? `key:${r.algorithm.name}` : r instanceof ArrayBuffer ? `buf:${r.byteLength}` : String(r);
  const run = async (label, f) => { try { out.push(label + "=" + show(await f())); } catch (e) { out.push(label + "=" + e.name); } };
  const gcm = await s.generateKey({ name: "AES-GCM", length: 128 }, false, ["encrypt"]);
  const hmac = await s.generateKey({ name: "HMAC", hash: "SHA-256" }, false, ["sign", "verify"]);
  const kw = await s.generateKey({ name: "AES-KW", length: 128 }, true, ["wrapKey", "unwrapKey"]);
  const target = await s.generateKey({ name: "AES-GCM", length: 128 }, true, ["encrypt"]);
  const getterAlgo = (base, buf) => ({ ...base, get name() { buf.buffer.transfer(); return base.name; } });
  let data = new Uint8Array(16);
  await run("encrypt transferred", () => s.encrypt(getterAlgo({ name: "AES-GCM", iv: new Uint8Array(12) }, data), gcm, data));
  data = new Uint8Array(16);
  await run("sign transferred", () => s.sign(getterAlgo({ name: "HMAC" }, data), hmac, data));
  let keyData = new Uint8Array(16);
  await run("importKey transferred", () => s.importKey("raw", keyData, getterAlgo({ name: "AES-GCM" }, keyData), true, ["encrypt"]));
  const wrapped = new Uint8Array(await s.wrapKey("raw", target, kw, "AES-KW"));
  await run("unwrapKey transferred", () => s.unwrapKey("raw", wrapped, kw, getterAlgo({ name: "AES-KW" }, wrapped), "AES-GCM", true, ["encrypt"]));
  let getterCalls = 0;
  await run("name read once", async () => { await s.encrypt({ iv: new Uint8Array(12), get name() { getterCalls++; return "AES-GCM"; } }, gcm, new Uint8Array(4)); return getterCalls; });
  await run("sign string data", () => s.sign("HMAC", hmac, "abc"));
  await run("encrypt bad data bad algo", () => s.encrypt("foo", gcm, 5));
  // A BufferSource member is copied once the whole dictionary is read, so a
  // later member's getter that transfers it leaves it empty (the spec's
  // order; Chrome reads AES-GCM's tagLength before its iv, and keeps the iv).
  const hk = await s.importKey("raw", new Uint8Array(16).fill(3), "HKDF", false, ["deriveBits"]);
  const salt = new Uint8Array(8).fill(4);
  const fullInfo = await s.deriveBits({ name: "HKDF", hash: "SHA-256", salt, info: new Uint8Array(5).fill(5) }, hk, 128);
  await run("hkdf info transferred by salt", async () => {
    const info = new Uint8Array(5).fill(5);
    const bits = await s.deriveBits({ name: "HKDF", hash: "SHA-256", info, get salt() { info.buffer.transfer(); return salt; } }, hk, 128);
    const empty = await s.deriveBits({ name: "HKDF", hash: "SHA-256", salt, info: new Uint8Array(0) }, hk, 128);
    return new Uint8Array(bits).join() === new Uint8Array(empty).join() && new Uint8Array(bits).join() !== new Uint8Array(fullInfo).join();
  });
  await run("gcm iv transferred by tagLength", () => {
    const iv = new Uint8Array(12);
    return s.encrypt({ name: "AES-GCM", iv, get tagLength() { iv.buffer.transfer(); return 128; } }, gcm, new Uint8Array(4));
  });
  const expected = [
    "encrypt transferred=buf:16",
    "sign transferred=buf:32",
    "importKey transferred=DataError",
    "unwrapKey transferred=OperationError",
    "name read once=1",
    "sign string data=TypeError",
    "encrypt bad data bad algo=TypeError",
    "hkdf info transferred by salt=true",
  ];
  const gcmIv = out.pop();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(expected.length, out.length);
    for (let i = 0; i < expected.length; i++) {
      testing.expectEqual(expected[i], out[i]);
    }
    testing.diverges("Chrome reads AES-GCM's tagLength before its iv", () => {
      testing.expectEqual("gcm iv transferred by tagLength=OperationError", gcmIv);
    });
  });
</script>

<script id="digest" type=module>
  const state = await testing.async();
  async function hash(algo, data) {
    const buffer = await window.crypto.subtle.digest(algo, new TextEncoder().encode(data));
    return [...new Uint8Array(buffer)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  const sha1 = await hash('sha-1', 'over 9000');

<script>
  // Helper for worker-based crypto tests. Spawns a worker, waits for it to
  // signal readiness, then sends `kind` and forwards the worker's reply to
  // `state.resolve`. Avoids racing worker startup, which matters on slow CI.
  window.runCryptoInWorker = function(kind, state, extra = {}) {
    const worker = new Worker('./crypto-worker.js');
    worker.onmessage = (e) => {
      if (e.data && e.data.ready) {
        worker.postMessage({ kind, ...extra });
        return;
      }
      state.resolve(e.data);
    };
  };
</script>

<script id=algorithm-name-read-once type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const outcome = async (fn) => {
    try {
      const r = await fn();
      return r instanceof CryptoKey ? `${r.type}:${r.algorithm.name}` : `pair:${r.privateKey.algorithm.name}`;
    } catch (err) {
      return err.name;
    }
  };
  // A name getter that answers one algorithm, then another.
  const flip = (first, second, members) => {
    const counter = { calls: 0 };
    const algo = { get name() { return counter.calls++ === 0 ? first : second; }, ...members };
    return [counter, algo];
  };

  // The name is read once: its first answer picks the algorithm and is the
  // name of its params, so a getter can't make the two disagree.
  const [ecdsa, ecdsaAlgo] = flip("ECDSA", "RSA-OAEP", { namedCurve: "P-256" });
  const [aes, aesAlgo] = flip("AES-GCM", "HMAC", { length: 128, hash: "SHA-256" });
  const [hmac, hmacAlgo] = flip("HMAC", "AES-GCM", { length: 128, hash: "SHA-256" });
  const [hkdf, hkdfAlgo] = flip("HKDF", "PBKDF2", {
    hash: "SHA-256", salt: new Uint8Array(8), info: new Uint8Array(0), iterations: 1,
  });
  const hkdfKey = await subtle.importKey("raw", new Uint8Array(16), "HKDF", false, ["deriveBits"]);
  const results = {
    importEcdsa: await outcome(() => subtle.importKey("raw", new Uint8Array(16), ecdsaAlgo, true, ["encrypt"])),
    importEcdsaCalls: ecdsa.calls,
    generateAes: await outcome(() => subtle.generateKey(aesAlgo, true, ["encrypt"])),
    generateAesCalls: aes.calls,
    importHmac: await outcome(() => subtle.importKey("raw", new Uint8Array(16), hmacAlgo, true, ["sign"])),
    importHmacCalls: hmac.calls,
    deriveHkdf: (await subtle.deriveBits(hkdfAlgo, hkdfKey, 128)).byteLength,
    deriveHkdfCalls: hkdf.calls,
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual({
      importEcdsa: "SyntaxError",
      importEcdsaCalls: 1,
      generateAes: "secret:AES-GCM",
      generateAesCalls: 1,
      importHmac: "secret:HMAC",
      importHmacCalls: 1,
      deriveHkdf: 16,
      deriveHkdfCalls: 1,
    }, results);
  });
</script>

<script id=export-and-format-order type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const outcome = async (fn) => {
    try {
      const r = await fn();
      return r instanceof ArrayBuffer ? `bytes:${r.byteLength}` : typeof r;
    } catch (err) {
      return err.name;
    }
  };
  const hkdf = await subtle.importKey("raw", new Uint8Array(16), "HKDF", false, ["deriveBits"]);
  const pbkdf2 = await subtle.importKey("raw", new Uint8Array(16), "PBKDF2", false, ["deriveBits"]);
  const aesLocked = await subtle.importKey("raw", new Uint8Array(16), "AES-CBC", false, ["encrypt"]);
  const aes = await subtle.importKey("raw", new Uint8Array(16), "AES-CBC", true, ["encrypt"]);
  const kw = await subtle.importKey("raw", new Uint8Array(16), "AES-KW", false, ["wrapKey", "unwrapKey"]);
  const unwrapOnly = await subtle.importKey("raw", new Uint8Array(16), "AES-KW", false, ["unwrapKey"]);

  const results = {};
  // HKDF and PBKDF2 have no export operation: NotSupportedError comes before
  // the extractable check (Chrome 152 still gives InvalidAccessError).
  const noExport = {};
  for (const format of ["raw", "jwk", "spki", "pkcs8"]) {
    noExport[`hkdf ${format}`] = await outcome(() => subtle.exportKey(format, hkdf));
    noExport[`pbkdf2 ${format}`] = await outcome(() => subtle.exportKey(format, pbkdf2));
  }
  noExport["wrap hkdf"] = await outcome(() => subtle.wrapKey("raw", hkdf, kw, "AES-KW"));
  noExport["wrap pbkdf2"] = await outcome(() => subtle.wrapKey("raw", pbkdf2, kw, "AES-KW"));
  // The wrapping key's checks come first.
  results["wrap hkdf, unwrap-only key"] = await outcome(() => subtle.wrapKey("raw", hkdf, unwrapOnly, "AES-KW"));
  // An exportable algorithm still checks extractable before the format.
  results["aes locked raw"] = await outcome(() => subtle.exportKey("raw", aesLocked));
  results["aes locked spki"] = await outcome(() => subtle.exportKey("spki", aesLocked));
  results["aes spki"] = await outcome(() => subtle.exportKey("spki", aes));
  results["wrap aes locked"] = await outcome(() => subtle.wrapKey("raw", aesLocked, kw, "AES-KW"));
  // An unknown format is a TypeError before anything else; a raw-* one of the
  // Modern Algorithms draft is a known format, which an algorithm may not take.
  results["export bogus"] = await outcome(() => subtle.exportKey("bogus", aesLocked));
  results["export Raw"] = await outcome(() => subtle.exportKey("Raw", aes));
  results["export bogus hkdf"] = await outcome(() => subtle.exportKey("bogus", hkdf));
  results["import bogus"] = await outcome(() => subtle.importKey("bogus", new Uint8Array(16), "NOPE", true, ["encrypt"]));
  results["import raw-public aes"] = await outcome(() => subtle.importKey("raw-public", new Uint8Array(16), "AES-GCM", true, ["encrypt"]));
  results["export raw-secret aes"] = await outcome(() => subtle.exportKey("raw-secret", aes));
  const ec = await subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  const ecRaw = await subtle.exportKey("raw", ec.publicKey);
  results["export raw-public ec"] = await outcome(() => subtle.exportKey("raw-public", ec.publicKey));
  results["import raw-public ec"] = await outcome(() => subtle.importKey("raw-public", ecRaw, { name: "ECDSA", namedCurve: "P-256" }, true, ["verify"]));
  results["import raw-private ec"] = await outcome(() => subtle.importKey("raw-private", new Uint8Array(32), { name: "ECDSA", namedCurve: "P-256" }, true, ["sign"]));
  results["wrap bogus"] = await outcome(() => subtle.wrapKey("bogus", aes, kw, "NOPE"));
  results["unwrap bogus"] = await outcome(() => subtle.unwrapKey("bogus", new Uint8Array(24), kw, "NOPE", "AES-GCM", true, ["encrypt"]));

  state.resolve();
  await state.done(() => {
    testing.diverges("Chrome checks extractable before the export operation", () => {
      testing.expectEqual({
        "hkdf raw": "NotSupportedError",
        "pbkdf2 raw": "NotSupportedError",
        "hkdf jwk": "NotSupportedError",
        "pbkdf2 jwk": "NotSupportedError",
        "hkdf spki": "NotSupportedError",
        "pbkdf2 spki": "NotSupportedError",
        "hkdf pkcs8": "NotSupportedError",
        "pbkdf2 pkcs8": "NotSupportedError",
        "wrap hkdf": "NotSupportedError",
        "wrap pbkdf2": "NotSupportedError",
      }, noExport);
    });
    testing.expectEqual({
      "wrap hkdf, unwrap-only key": "InvalidAccessError",
      "aes locked raw": "InvalidAccessError",
      "aes locked spki": "InvalidAccessError",
      "aes spki": "NotSupportedError",
      "wrap aes locked": "InvalidAccessError",
      "export bogus": "TypeError",
      "export Raw": "TypeError",
      "export bogus hkdf": "TypeError",
      "import bogus": "TypeError",
      "import raw-public aes": "NotSupportedError",
      // raw-secret is raw for AES, raw-public for an EC public key.
      "export raw-secret aes": "bytes:16",
      "export raw-public ec": "bytes:65",
      "import raw-public ec": "object",
      "import raw-private ec": "NotSupportedError",
      "wrap bogus": "TypeError",
      "unwrap bogus": "TypeError",
    }, results);
  });
</script>

<script id=crypto-key-cached-slots type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const aes = await subtle.generateKey({ name: "AES-CTR", length: 256 }, true, ["encrypt", "decrypt"]);
  const pair = await subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  const hmac = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, true, ["sign"]);
  const rsa = await subtle.generateKey({ name: "RSA-PSS", hash: "SHA-256", modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) }, true, ["sign", "verify"]);

  // algorithm and usages return the key's cached object every time (Chrome
  // 152 still builds a new one per read). A change the page makes to it shows
  // on the next read, but not in what the key does.
  const algorithm = aes.algorithm;
  const usages = aes.usages;
  algorithm.name = "HMAC";
  algorithm.length = 1;
  usages.push("sign");
  const counter = new Uint8Array(16);
  const encrypted = await subtle.encrypt({ name: "AES-CTR", counter, length: 64 }, aes, new Uint8Array(4));
  const results = {
    stillEncrypts: encrypted.byteLength,
    stillNotSigning: await subtle.sign("HMAC", aes, new Uint8Array(1)).then(() => "signed", (e) => e.name),
    exportedAlg: (await subtle.exportKey("jwk", aes)).alg,
    // Each key has its own objects, even the two keys of a pair.
    pairAlgorithmsDiffer: pair.publicKey.algorithm !== pair.privateKey.algorithm,
    pairUsagesDiffer: pair.publicKey.usages !== pair.privateKey.usages,
  };
  const cached = {
    algorithmSame: aes.algorithm === algorithm,
    usagesSame: aes.usages === usages,
    algorithmSeen: `${aes.algorithm.name}/${aes.algorithm.length}`,
    usagesSeen: aes.usages.join(),
    publicAlgorithmSame: pair.publicKey.algorithm === pair.publicKey.algorithm,
    privateUsagesSame: pair.privateKey.usages === pair.privateKey.usages,
    // So are its nested members.
    hmacHashSame: hmac.algorithm.hash === hmac.algorithm.hash,
    rsaHashSame: rsa.publicKey.algorithm.hash === rsa.publicKey.algorithm.hash,
    rsaExponentSame: rsa.publicKey.algorithm.publicExponent === rsa.publicKey.algorithm.publicExponent,
  };

  state.resolve();
  await state.done(() => {
    testing.expectEqual({
      stillEncrypts: 4,
      stillNotSigning: "InvalidAccessError",
      exportedAlg: "A256CTR",
      pairAlgorithmsDiffer: true,
      pairUsagesDiffer: true,
    }, results);
    testing.diverges("Chrome builds a new algorithm/usages object on every read", () => {
      testing.expectEqual({
        algorithmSame: true,
        usagesSame: true,
        algorithmSeen: "HMAC/1",
        usagesSeen: "encrypt,decrypt,sign",
        publicAlgorithmSame: true,
        privateUsagesSame: true,
        hmacHashSame: true,
        rsaHashSame: true,
        rsaExponentSame: true,
      }, cached);
    });
  });
</script>

<script id=shared-buffers type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const outcome = async (fn) => {
    try {
      const r = await fn();
      return r instanceof ArrayBuffer ? `bytes:${r.byteLength}` : r instanceof CryptoKey ? "key" : typeof r;
    } catch (err) {
      return err.name;
    }
  };
  // None of SubtleCrypto's BufferSource arguments or members is
  // [AllowShared]: a SharedArrayBuffer, or a view onto one, is a TypeError.
  const sab = new SharedArrayBuffer(16);
  const view = new Uint8Array(sab);
  const data = new Uint8Array(16);
  const gcm = await subtle.generateKey({ name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
  const kw = await subtle.generateKey({ name: "AES-KW", length: 128 }, false, ["wrapKey", "unwrapKey"]);
  const hmac = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, false, ["sign", "verify"]);
  const hkdf = await subtle.importKey("raw", data, "HKDF", false, ["deriveBits"]);
  const pbkdf2 = await subtle.importKey("raw", data, "PBKDF2", false, ["deriveBits"]);
  const iv = new Uint8Array(12);
  const results = {};
  for (const [kind, buffer] of [["sab", sab], ["view", view], ["dataView", new DataView(sab)]]) {
    results[`digest ${kind}`] = await outcome(() => subtle.digest("SHA-256", buffer));
    results[`encrypt data ${kind}`] = await outcome(() => subtle.encrypt({ name: "AES-GCM", iv }, gcm, buffer));
    results[`encrypt iv ${kind}`] = await outcome(() => subtle.encrypt({ name: "AES-GCM", iv: buffer }, gcm, data));
    results[`encrypt aad ${kind}`] = await outcome(() => subtle.encrypt({ name: "AES-GCM", iv, additionalData: buffer }, gcm, data));
    results[`decrypt data ${kind}`] = await outcome(() => subtle.decrypt({ name: "AES-GCM", iv }, gcm, buffer));
    results[`sign data ${kind}`] = await outcome(() => subtle.sign("HMAC", hmac, buffer));
    results[`verify signature ${kind}`] = await outcome(() => subtle.verify("HMAC", hmac, buffer, data));
    results[`import ${kind}`] = await outcome(() => subtle.importKey("raw", buffer, "AES-GCM", false, ["encrypt"]));
    results[`unwrap ${kind}`] = await outcome(() => subtle.unwrapKey("raw", buffer, kw, "AES-KW", "AES-GCM", false, ["encrypt"]));
    results[`hkdf salt ${kind}`] = await outcome(() => subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: buffer, info: data }, hkdf, 128));
    results[`pbkdf2 salt ${kind}`] = await outcome(() => subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: buffer, iterations: 1 }, pbkdf2, 128));
  }
  // The same calls with a non-shared buffer.
  results["digest plain"] = await outcome(() => subtle.digest("SHA-256", data.buffer));
  results["encrypt plain"] = await outcome(() => subtle.encrypt({ name: "AES-GCM", iv, additionalData: data }, gcm, data));
  results["import plain"] = await outcome(() => subtle.importKey("raw", data, "AES-GCM", false, ["encrypt"]));
  // Any view of a non-shared buffer is a BufferSource, whatever its element type.
  results["digest Uint32Array"] = await outcome(() => subtle.digest("SHA-256", new Uint32Array([1, 2])));
  results["digest Float64Array"] = await outcome(() => subtle.digest("SHA-256", new Float64Array([1])));
  results["encrypt Uint16Array"] = await outcome(() => subtle.encrypt({ name: "AES-GCM", iv: new Uint16Array(6) }, gcm, new Uint16Array(8)));
  results["import Uint16Array"] = await outcome(() => subtle.importKey("raw", new Uint16Array(8), "AES-GCM", false, ["encrypt"]));
  results["import DataView"] = await outcome(() => subtle.importKey("raw", new DataView(new ArrayBuffer(16)), "AES-GCM", false, ["encrypt"]));
  results["sign Int32Array"] = await outcome(() => subtle.sign("HMAC", hmac, new Int32Array(3)));
  // RSA's publicExponent is a BigInteger: a Uint8Array, no other view or buffer.
  const rsa = (publicExponent) => outcome(() => subtle.generateKey({ name: "RSASSA-PKCS1-v1_5", hash: "SHA-256", modulusLength: 1024, publicExponent }, false, ["sign"]));
  results["publicExponent Uint8Array"] = await rsa(new Uint8Array([1, 0, 1]));
  results["publicExponent Uint16Array"] = await rsa(new Uint16Array([1, 1]));
  results["publicExponent DataView"] = await rsa(new DataView(new Uint8Array([1, 0, 1]).buffer));
  results["publicExponent ArrayBuffer"] = await rsa(new Uint8Array([1, 0, 1]).buffer);
  const sharedExponent = await rsa(new Uint8Array(new SharedArrayBuffer(3)));
  // A shared keyData is a TypeError of its conversion, before the algorithm.
  results["import view, unknown algorithm"] = await outcome(() => subtle.importKey("raw", view, "NOPE", false, ["encrypt"]));
  // A SharedArrayBuffer is a BufferSource that fails its conversion, not a
  // JsonWebKey, in any format.
  results["import jwk sab"] = await outcome(() => subtle.importKey("jwk", sab, "AES-GCM", false, ["encrypt"]));
  results["import jwk sab, unknown algorithm"] = await outcome(() => subtle.importKey("jwk", sab, "NOPE", false, ["encrypt"]));
  results["import jwk {}"] = await outcome(() => subtle.importKey("jwk", {}, "AES-GCM", false, ["encrypt"]));
  // getRandomValues' ArrayBufferView isn't [AllowShared] either.
  const random = (array) => { try { return crypto.getRandomValues(array) === array; } catch (err) { return err.name; } };
  results["getRandomValues view"] = random(view);
  results["getRandomValues plain"] = random(new Uint8Array(4));

  const expected = {};
  for (const kind of ["sab", "view", "dataView"]) {
    for (const name of ["digest", "encrypt data", "encrypt iv", "encrypt aad", "decrypt data", "sign data",
                        "verify signature", "import", "unwrap", "hkdf salt", "pbkdf2 salt"]) {
      expected[`${name} ${kind}`] = "TypeError";
    }
  }
  expected["digest plain"] = "bytes:32";
  expected["encrypt plain"] = "bytes:32";
  expected["import plain"] = "key";
  expected["digest Uint32Array"] = "bytes:32";
  expected["digest Float64Array"] = "bytes:32";
  expected["encrypt Uint16Array"] = "bytes:32";
  expected["import Uint16Array"] = "key";
  expected["import DataView"] = "key";
  expected["sign Int32Array"] = "bytes:32";
  expected["publicExponent Uint8Array"] = "object";
  expected["publicExponent Uint16Array"] = "TypeError";
  expected["publicExponent DataView"] = "TypeError";
  expected["publicExponent ArrayBuffer"] = "TypeError";
  expected["import view, unknown algorithm"] = "TypeError";
  expected["import jwk sab"] = "TypeError";
  expected["import jwk sab, unknown algorithm"] = "TypeError";
  expected["import jwk {}"] = "DataError";
  expected["getRandomValues view"] = "TypeError";
  expected["getRandomValues plain"] = true;

  state.resolve();
  await state.done(() => {
    testing.expectEqual(expected, results);
    testing.diverges("Chrome takes a shared publicExponent", () => {
      testing.expectEqual("TypeError", sharedExponent);
    });
  });
</script>

<script id=crypto-key-serialization type=module>
  const state = await testing.async();
  const subtle = crypto.subtle;
  const hex = (buffer) => Array.from(new Uint8Array(buffer), (b) => b.toString(16).padStart(2, "0")).join("");
  const exported = async (key, format) => format === "jwk"
    ? JSON.stringify(await subtle.exportKey("jwk", key))
    : hex(await subtle.exportKey(format, key));
  const data = new Uint8Array([1, 2, 3]);
  const results = {};

  // A clone keeps every slot of the key and its material.
  const same = async (label, key, format) => {
    const clone = structuredClone(key);
    results[label] = clone !== key && clone instanceof CryptoKey
      && clone.type === key.type && clone.extractable === key.extractable
      && JSON.stringify(clone.algorithm) === JSON.stringify(key.algorithm)
      && clone.usages.join() === key.usages.join()
      && (await exported(clone, format)) === (await exported(key, format));
  };
  await same("aes-gcm", await subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]), "raw");
  await same("aes-kw", await subtle.generateKey({ name: "AES-KW", length: 128 }, true, ["wrapKey"]), "raw");
  // A length that doesn't fill the last byte is kept (Chrome 152 clones this
  // key as null).
  await same("hmac", await subtle.generateKey({ name: "HMAC", hash: "SHA-384", length: 100 }, true, ["sign"]), "jwk");
  const hmacPartialByte = results["hmac"];
  delete results["hmac"];
  const ec = await subtle.generateKey({ name: "ECDSA", namedCurve: "P-384" }, true, ["sign", "verify"]);
  await same("ecdsa public", ec.publicKey, "spki");
  await same("ecdsa private", ec.privateKey, "pkcs8");
  const ecdh = await subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  await same("ecdh public", ecdh.publicKey, "raw");
  await same("ecdh private", ecdh.privateKey, "jwk");
  const rsa = await subtle.generateKey({ name: "RSA-PSS", hash: "SHA-256", modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) }, true, ["sign", "verify"]);
  await same("rsa public", rsa.publicKey, "jwk");
  await same("rsa private", rsa.privateKey, "pkcs8");
  const ed = await subtle.generateKey("Ed25519", true, ["sign", "verify"]);
  await same("ed25519 public", ed.publicKey, "raw");
  await same("ed25519 private", ed.privateKey, "pkcs8");
  const x = await subtle.generateKey("X25519", true, ["deriveBits"]);
  await same("x25519 public", x.publicKey, "raw");
  await same("x25519 private", x.privateKey, "pkcs8");

  // A non-extractable key clones too, and the clone works like it.
  const hmac = await subtle.generateKey({ name: "HMAC", hash: "SHA-256" }, false, ["sign", "verify"]);
  const hmacClone = structuredClone(hmac);
  results["locked hmac"] = hmacClone.extractable === false
    && hex(await subtle.sign("HMAC", hmacClone, data)) === hex(await subtle.sign("HMAC", hmac, data));
  const signer = await subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]);
  const { privateKey, publicKey } = structuredClone({ privateKey: signer.privateKey, publicKey: signer.publicKey });
  const es256 = { name: "ECDSA", hash: "SHA-256" };
  results["locked ecdsa"] = await subtle.verify(es256, signer.publicKey, await subtle.sign(es256, privateKey, data), data)
    && await subtle.verify(es256, publicKey, await subtle.sign(es256, signer.privateKey, data), data);
  results["locked export"] = await subtle.exportKey("pkcs8", privateKey).then(() => "exported", (e) => e.name);
  const hkdf = await subtle.importKey("raw", new Uint8Array(16), "HKDF", false, ["deriveBits"]);
  const derive = (key) => subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: data, info: data }, key, 128);
  results["hkdf"] = hex(await derive(structuredClone(hkdf))) === hex(await derive(hkdf));
  // One key reached twice clones to one object.
  const twice = structuredClone([hmac, hmac]);
  results["one clone"] = twice[0] === twice[1];

  state.resolve();
  await state.done(() => {
    testing.expectEqual({
      "aes-gcm": true,
      "aes-kw": true,
      "ecdsa public": true,
      "ecdsa private": true,
      "ecdh public": true,
      "ecdh private": true,
      "rsa public": true,
      "rsa private": true,
      "ed25519 public": true,
      "ed25519 private": true,
      "x25519 public": true,
      "x25519 private": true,
      "locked hmac": true,
      "locked ecdsa": true,
      "locked export": "InvalidAccessError",
      "hkdf": true,
      "one clone": true,
    }, results);
    testing.diverges("Chrome clones an HMAC key whose length isn't whole bytes as null", () => {
      testing.expectEqual(true, hmacPartialByte);
    });
  });
</script>

  {
    // A non-extractable key posted to a worker signs there, and the worker
    // posts back a key of its own.
    const state = await testing.async();
    const subtle = crypto.subtle;
    const es256 = { name: 'ECDSA', hash: 'SHA-256' };
    const data = new Uint8Array([7, 8, 9]);
    const pair = await subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']);
    runCryptoInWorker('posted-keys', state, { privateKey: pair.privateKey, data });
    const got = await state.promise;
    const signedThere = got.ok && await subtle.verify(es256, pair.publicKey, got.signature, data);
    const keyFromThere = got.ok && got.publicKey instanceof CryptoKey
      && await subtle.verify(es256, got.publicKey, got.theirs, data);
    await state.done((got) => {
      testing.expectTrue(got.ok);
      testing.expectEqual('private', got.type);
      testing.expectEqual(false, got.extractable);
      testing.expectEqual(true, signedThere);
      testing.expectEqual(true, keyFromThere);
    });
  }
</script>

<script id=raw-format-aliases type=module>
  // The Modern Algorithms draft's raw-* formats: raw-secret is raw for the
  // symmetric algorithms, raw-public is raw for an EC or OKP public key.
  const state = await testing.async();
  const subtle = crypto.subtle;
  const hex = (b) => Array.from(new Uint8Array(b), (x) => x.toString(16).padStart(2, "0")).join("");
  const outcome = async (fn) => {
    try {
      const r = await fn();
      return r instanceof ArrayBuffer ? `bytes:${r.byteLength}` : r instanceof CryptoKey ? `${r.type}:${r.algorithm.name}` : typeof r;
    } catch (err) {
      return err.name;
    }
  };
  const bytes16 = crypto.getRandomValues(new Uint8Array(16));
  const gcm = { name: "AES-GCM", iv: new Uint8Array(12) };
  const wrapper = await subtle.generateKey({ name: "AES-GCM", length: 128 }, false, ["wrapKey", "unwrapKey"]);
  const results = {};

  for (const [algo, usages, extractable] of [
    ["AES-CTR", ["encrypt"], true], ["AES-CBC", ["encrypt"], true], ["AES-GCM", ["encrypt"], true], ["AES-KW", ["wrapKey"], true],
    [{ name: "HMAC", hash: "SHA-256" }, ["sign"], true], ["HKDF", ["deriveBits"], false], ["PBKDF2", ["deriveBits"], false],
  ]) {
    const name = algo.name || algo;
    const key = await subtle.importKey("raw-secret", bytes16, algo, extractable, usages);
    results[`import ${name}`] = `${key.type}:${key.algorithm.name}`;
    if (extractable) {
      results[`export ${name}`] = hex(await subtle.exportKey("raw-secret", key)) === hex(bytes16);
      const wrapped = await subtle.wrapKey("raw-secret", key, wrapper, gcm);
      results[`unwrap ${name}`] = await outcome(() => subtle.unwrapKey("raw-secret", wrapped, wrapper, gcm, algo, true, usages));
    }
  }

  for (const [algo, usages, publicUsages] of [
    [{ name: "ECDSA", namedCurve: "P-256" }, ["sign", "verify"], ["verify"]],
    [{ name: "ECDH", namedCurve: "P-384" }, ["deriveBits"], []],
    ["Ed25519", ["sign", "verify"], ["verify"]],
    ["X25519", ["deriveBits"], []],
  ]) {
    const name = algo.name || algo;
    const pair = await subtle.generateKey(algo, true, usages);
    const raw = await subtle.exportKey("raw", pair.publicKey);
    results[`export ${name}`] = hex(await subtle.exportKey("raw-public", pair.publicKey)) === hex(raw);
    results[`import ${name}`] = await outcome(() => subtle.importKey("raw-public", raw, algo, true, publicUsages));
    const wrapped = await subtle.wrapKey("raw-public", pair.publicKey, wrapper, gcm);
    results[`unwrap ${name}`] = await outcome(() => subtle.unwrapKey("raw-public", wrapped, wrapper, gcm, algo, true, publicUsages));
    // Only a public key has a raw-public form.
    results[`private ${name}`] = await outcome(() => subtle.exportKey("raw-public", pair.privateKey));
  }

  // A raw-* format the algorithm doesn't take is NotSupportedError.
  const ec = await subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  const ecRaw = await subtle.exportKey("raw", ec.publicKey);
  const aes = await subtle.importKey("raw", bytes16, "AES-GCM", true, ["encrypt"]);
  const rsa = await subtle.generateKey({ name: "RSA-PSS", hash: "SHA-256", modulusLength: 1024, publicExponent: new Uint8Array([1, 0, 1]) }, true, ["sign", "verify"]);
  results["export raw-secret ec"] = await outcome(() => subtle.exportKey("raw-secret", ec.publicKey));
  results["import raw-secret ec"] = await outcome(() => subtle.importKey("raw-secret", ecRaw, { name: "ECDSA", namedCurve: "P-256" }, true, ["verify"]));
  results["export raw-public aes"] = await outcome(() => subtle.exportKey("raw-public", aes));
  results["export raw-public rsa"] = await outcome(() => subtle.exportKey("raw-public", rsa.publicKey));
  results["import raw-public rsa"] = await outcome(() => subtle.importKey("raw-public", ecRaw, { name: "RSA-PSS", hash: "SHA-256" }, true, ["verify"]));
  // raw-public is a public key: a private usage is a SyntaxError, as for raw.
  results["import raw-public ec sign"] = await outcome(() => subtle.importKey("raw-public", ecRaw, { name: "ECDSA", namedCurve: "P-256" }, true, ["sign"]));
  // HKDF and PBKDF2 still have no export operation.
  const hkdf = await subtle.importKey("raw-secret", bytes16, "HKDF", false, ["deriveBits"]);
  const hkdfExport = await outcome(() => subtle.exportKey("raw-secret", hkdf));

  state.resolve();
  await state.done(() => {
    testing.expectEqual({
      "import AES-CTR": "secret:AES-CTR", "export AES-CTR": true, "unwrap AES-CTR": "secret:AES-CTR",
      "import AES-CBC": "secret:AES-CBC", "export AES-CBC": true, "unwrap AES-CBC": "secret:AES-CBC",
      "import AES-GCM": "secret:AES-GCM", "export AES-GCM": true, "unwrap AES-GCM": "secret:AES-GCM",
      "import AES-KW": "secret:AES-KW", "export AES-KW": true, "unwrap AES-KW": "secret:AES-KW",
      "import HMAC": "secret:HMAC", "export HMAC": true, "unwrap HMAC": "secret:HMAC",
      "import HKDF": "secret:HKDF",
      "import PBKDF2": "secret:PBKDF2",
      "export ECDSA": true, "import ECDSA": "public:ECDSA", "unwrap ECDSA": "public:ECDSA", "private ECDSA": "InvalidAccessError",
      "export ECDH": true, "import ECDH": "public:ECDH", "unwrap ECDH": "public:ECDH", "private ECDH": "InvalidAccessError",
      "export Ed25519": true, "import Ed25519": "public:Ed25519", "unwrap Ed25519": "public:Ed25519", "private Ed25519": "InvalidAccessError",
      "export X25519": true, "import X25519": "public:X25519", "unwrap X25519": "public:X25519", "private X25519": "InvalidAccessError",
      "export raw-secret ec": "NotSupportedError",
      "import raw-secret ec": "NotSupportedError",
      "export raw-public aes": "NotSupportedError",
      "export raw-public rsa": "NotSupportedError",
      "import raw-public rsa": "NotSupportedError",
      "import raw-public ec sign": "SyntaxError",
    }, results);
    testing.diverges("Chrome checks extractable before the export operation", () => {
      testing.expectEqual("NotSupportedError", hkdfExport);
    });
  });
</script>
