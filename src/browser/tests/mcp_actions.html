<!DOCTYPE html>
<html>
<body>
    <button id="btn" onclick="window.clicked = true;">Click Me</button>
    <input id="inp" oninput="window.inputVal = this.value" onchange="window.changed = true;">
    <select id="sel" onchange="window.selChanged = this.value">
        <option value="opt1">Option 1</option>
        <option value="opt2">Option 2</option>
    </select>
    <div id="scrollbox" style="width: 100px; height: 100px; overflow: scroll;" onscroll="window.scrolled = true;">
        <div style="height: 500px;">Long content</div>
    </div>
    <div id="hoverTarget" onmouseover="window.hovered = true;">Hover Me</div>
    <input id="keyTarget" onkeydown="window.keyPressed = event.key;" onkeyup="window.keyReleased = event.key;">
    <select id="sel2" onchange="window.sel2Changed = this.value">
        <option value="a">Alpha</option>
        <option value="b">Beta</option>
        <option value="c">Gamma</option>
    </select>
    <input id="chk" type="checkbox">
    <input id="rad" type="radio" name="group1">
    <button id="btnPreventDefault">Prevent Default</button>
    <button id="btnDisabled" disabled>Disabled</button>
    <div id="focusTarget" tabindex="0" onclick="window.focusTargetFocused = document.activeElement === this;">Focus me</div>
    <div id="plain" onclick="window.plainBlurred = document.activeElement === document.body;">Not focusable</div>
    <script>
        window.seq = [];
        const btn = document.getElementById('btn');
        for (const t of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) {
            btn.addEventListener(t, function(e) { window.seq.push([e.type, e.button, e.buttons, e.pointerType, e.isTrusted].join(':')); });
        }

        // Regression coverage for pointerdown's preventDefault() suppressing
        // the compatibility mousedown/mouseup (click still fires).
        window.seqPrevented = [];
        const btnPreventDefault = document.getElementById('btnPreventDefault');
        btnPreventDefault.addEventListener('pointerdown', function(e) { e.preventDefault(); });
        for (const t of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) {
            btnPreventDefault.addEventListener(t, function(e) { window.seqPrevented.push(e.type); });
        }

        window.disabledEvents = [];
        const btnDisabled = document.getElementById('btnDisabled');
        for (const t of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) {
            btnDisabled.addEventListener(t, function(e) { window.disabledEvents.push(e.type); });
        }

        document.getElementById('chk').addEventListener('click', function() { window.chkClicked = true; });
        document.getElementById('chk').addEventListener('change', function() { window.chkChanged = true; });
        document.getElementById('rad').addEventListener('click', function() { window.radClicked = true; });
        document.getElementById('rad').addEventListener('change', function() { window.radChanged = true; });
    </script>
</body>
</html>
