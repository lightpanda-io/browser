  const result2 = await reader.read();

<script id=readable_stream_pull type=module>
  const state = await testing.async();

  let pullCount = 0;

  const stream3 = new ReadableStream({
    start(controller) {
      controller.enqueue("initial");
    },
    pull(controller) {
      pullCount++;
      if (pullCount <= 2) {
        controller.enqueue("pulled" + pullCount);
      }
      if (pullCount === 2) {
        controller.close();
      }
    }
  }, { highWaterMark: 1 });

  const reader3 = stream3.getReader();
  const data1 = await reader3.read();
  const data2 = await reader3.read();
  state.resolve();

  await state.done(() => {
    testing.expectEqual("initial", data1.value);
    testing.expectEqual(false, data1.done);
    testing.expectEqual("pulled1", data2.value);
    testing.expectEqual(false, data2.done);
  });
</script>

<script id=queuing_strategies>
  {
    const count = new CountQueuingStrategy({ highWaterMark: 3 });
    testing.expectEqual(3, count.highWaterMark);
    testing.expectEqual(1, count.size('anything'));

    const bytes = new ByteLengthQueuingStrategy({ highWaterMark: 1024 });
    testing.expectEqual(1024, bytes.highWaterMark);
    testing.expectEqual(4, bytes.size(new Uint8Array(4)));
    testing.expectEqual(8, bytes.size(new ArrayBuffer(8)));
    testing.expectEqual(undefined, bytes.size({}));
    testing.expectEqual(undefined, bytes.size(7));
    testing.expectError('TypeError', () => bytes.size(null));
    testing.expectError('TypeError', () => bytes.size());

    testing.expectError('TypeError', () => new CountQueuingStrategy());
    testing.expectError('TypeError', () => new ByteLengthQueuingStrategy({}));

    let desired;
    const stream = new ReadableStream({ start(c) { desired = c.desiredSize; } }, count);
    testing.expectEqual(3, desired);
    testing.expectEqual('function', typeof stream.getReader);
  }
</script>

<script id=promise_rejections type=module>
  // Each call returns a promise that rejects with a TypeError; none throws.
  async function rejection(fn) {
    const promise = fn();
    if (!(promise instanceof Promise)) {
      return 'not a promise';
    }
    try {
      await promise;
      return 'resolved';
    } catch (e) {
      return e.name;
    }
  }

  const state = await testing.async();

  const released = new WritableStream().getWriter();
  released.releaseLock();

  const closed = new WritableStream().getWriter();
  await closed.close();

  const reader = new ReadableStream().getReader();
  reader.releaseLock();

  const locked = new ReadableStream();
  locked.getReader();

  const results = [
    await rejection(() => released.write('x')),
    await rejection(() => released.close()),
    await rejection(() => released.closed),
    await rejection(() => closed.write('x')),
    await rejection(() => closed.close()),
    await rejection(() => reader.cancel()),
    await rejection(() => locked.pipeTo(new WritableStream())),
  ];
  state.resolve();

  await state.done(() => {
    testing.expectEqual(Array(7).fill('TypeError'), results);
  });
</script>

<script id=stored_error type=module>
  const state = await testing.async();

  // read(), cancel(), write() and closed reject with whatever
  // controller.error() was given; close() with a new TypeError.
  const errored = new ReadableStream({ start(c) { c.error('err!'); } }).getReader();
  const no_reason = new ReadableStream({ start(c) { c.error(); } }).getReader();
  const errored_sink = new WritableStream({ start(c) { c.error('err!'); } }).getWriter();
  const no_reason_sink = new WritableStream({ start(c) { c.error(); } }).getWriter();
  const results = [
    await errored.read().catch((e) => e),
    await errored.cancel().catch((e) => e),
    await no_reason.read().then(() => 'resolved', (e) => e),
    await errored_sink.write('a').catch((e) => e),
    await errored_sink.close().catch((e) => e.name),
    await no_reason_sink.close().then(() => 'resolved', (e) => e.name),
    await errored_sink.closed.catch((e) => e),
  ];

  state.resolve();
  await state.done(() => {
    testing.expectEqual(['err!', 'err!', undefined, 'err!', 'TypeError', 'TypeError', 'err!'], results);
  });
</script>

<script id=readable_stream_tee type=module>
  const state = await testing.async();

  async function readAll(stream) {
    const reader = stream.getReader();
    const out = [];
    for (;;) {
      const { done, value } = await reader.read();
      if (done) return out;
      out.push(value);
    }
  }

  const obj = { a: 1 };
  const source = new ReadableStream({
    start(c) {
      c.enqueue('a');
      c.enqueue(1);
      c.enqueue(undefined);
      c.enqueue(obj);
      c.close();
    },
  });

  const [branch1, branch2] = source.tee();
  const locked = [source.locked, branch1.locked, branch2.locked];
  const [b1, b2] = await Promise.all([readAll(branch1), readAll(branch2)]);
  state.resolve();

  await state.done(() => {
    // the source stays locked to the tee, the branches start unlocked
    testing.expectEqual([true, false, false], locked);
    testing.expectEqual(['a', 1, undefined, obj], b1);
    testing.expectEqual(['a', 1, undefined, obj], b2);
    // the default tee doesn't clone: both branches get the same object
    testing.expectEqual(true, b1[3] === obj && b2[3] === obj);
  });
</script>

<script id=readable_stream_tee_closed_or_errored type=module>
  const state = await testing.async();

  // Unlike Response.clone(), tee() accepts a closed or errored stream.
  const closed = new ReadableStream({ start(c) { c.close(); } });
  const errored = new ReadableStream({ start(c) { c.error('err!'); } });
  const cancelled = new ReadableStream();
  await cancelled.cancel();

  const [c1, c2] = closed.tee();
  const [e1, e2] = errored.tee();
  const [cancelled_branch] = cancelled.tee();
  const results = [
    (await c1.getReader().read()).done,
    (await c2.getReader().read()).done,
    await e1.getReader().read().catch((e) => e),
    await e2.getReader().read().catch((e) => e),
    (await cancelled_branch.getReader().read()).done,
  ];
  state.resolve();

  await state.done(() => {
    testing.expectEqual([true, true, 'err!', 'err!', true], results);
  });
</script>

<script id=readable_stream_tee_cancel type=module>
  const state = await testing.async();

  let controller;
  const cancelled = [];
  const source = new ReadableStream({
    start(c) { controller = c; },
    cancel(reason) { cancelled.push(reason); },
  });
  const [b1, b2] = source.tee();
  const r2 = b2.getReader();

  // cancelling one branch leaves the source and the other branch alone, and
  // its promise waits for the other branch
  let first_settled = false;
  const first = b1.cancel('r1').then((v) => { first_settled = true; return v; });
  controller.enqueue('still flowing');
  const chunk = await r2.read();
  const after_first = cancelled.length;
  const first_settled_early = first_settled;

  // cancelling both cancels the source with both reasons, and settles both
  const values = await Promise.all([first, r2.cancel('r2')]);
  state.resolve();

  await state.done(() => {
    testing.expectEqual(0, after_first);
    testing.expectEqual(false, first_settled_early);
    testing.expectEqual([undefined, undefined], values);
    testing.expectEqual('still flowing', chunk.value);
    testing.expectEqual(1, cancelled.length);
    testing.expectEqual(['r1', 'r2'], cancelled[0]);
  });
</script>

<script id=readable_stream_cancel_source_promise type=module>
  const state = await testing.async();

  // cancel() waits on the promise the source's cancel returns, and resolves
  // with undefined rather than its value.
  let finish;
  const waiting = new ReadableStream({
    cancel() { return new Promise((r) => { finish = r; }); },
  });
  let settled = false;
  const cancelled = waiting.cancel().then((v) => { settled = true; return v; });
  await Promise.resolve();
  const settled_early = settled;
  finish('ignored');
  const value = await cancelled;

  // A source cancel that throws, or whose promise rejects, rejects cancel().
  const error = new Error('boom');
  const thrown = await new ReadableStream({ cancel() { throw error; } }).cancel().catch((e) => e);
  const rejected = await new ReadableStream({ cancel() { return Promise.reject(error); } }).cancel().catch((e) => e);

  // The stream is closed as soon as cancel() runs: a second cancel() resolves
  // right away, without waiting on (or sharing) the first one's outcome.
  let reject_first;
  const pending = new ReadableStream({
    cancel() { return new Promise((_, r) => { reject_first = r; }); },
  });
  const first = pending.cancel().catch((e) => e);
  const second = await pending.cancel();
  reject_first(error);
  const first_value = await first;
  state.resolve();

  await state.done(() => {
    testing.expectEqual(false, settled_early);
    testing.expectEqual(undefined, value);
    testing.expectEqual(true, thrown === error);
    testing.expectEqual(true, rejected === error);
    testing.expectEqual(undefined, second);
    testing.expectEqual(true, first_value === error);
  });
</script>

<script id=readable_stream_tee_pull type=module>
  const state = await testing.async();

  // A source that only produces when pulled: the tee reads it as the
  // branches are read, not ahead of them.
  let pulls = 0;
  const source = new ReadableStream({
    pull(c) {
      pulls += 1;
      if (pulls > 100) {
        c.close();
      } else {
        c.enqueue(pulls);
      }
    },
  });

  const [b1, b2] = source.tee();
  const r1 = b1.getReader();
  const first = [(await r1.read()).value, (await r1.read()).value];
  const pulls_after_two = pulls;

  // the branch that wasn't read still gets every chunk
  const all = [];
  for await (const chunk of b2) {
    all.push(chunk);
  }
  state.resolve();

  await state.done(() => {
    testing.expectEqual([1, 2], first);
    testing.expectEqual(true, pulls_after_two < 10);
    testing.expectEqual(Array.from({ length: 100 }, (_, i) => i + 1), all);
  });
</script>

<script id=readable_stream_tee_response_body type=module>
  const state = await testing.async();

  // the shape Next.js uses: tee a byte stream, decode both halves
  const [for_react, for_cache] = new Response('hello world').body.tee();
  async function decoded(stream) {
    let out = '';
    for await (const text of stream.pipeThrough(new TextDecoderStream())) {
      out += text;
    }
    return out;
  }
  const [a, b] = await Promise.all([new Response(for_react).text(), decoded(for_cache)]);
  state.resolve();

  await state.done(() => {
    testing.expectEqual('hello world', a);
    testing.expectEqual('hello world', b);
  });
</script>
