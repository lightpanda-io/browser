<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="../testing.js"></script>

<script id=transform_stream_basic>
  {
    const ts = new TransformStream();
    testing.expectEqual('object', typeof ts);
    testing.expectEqual('object', typeof ts.readable);
    testing.expectEqual('object', typeof ts.writable);
  }
</script>

<script id=transform_stream_with_transformer type=module>
  const state = await testing.async();

  const ts = new TransformStream({
    transform(chunk, controller) {
      controller.enqueue(chunk.toUpperCase());
    }
  });

  const writer = ts.writable.getWriter();
  const reader = ts.readable.getReader();

  // Not awaited: transform() only runs once a read is pending.
  writer.write('hello');
  writer.close();

  const result = await reader.read();
  const result2 = await reader.read();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(false, result.done);
    testing.expectEqual('HELLO', result.value);
    testing.expectEqual(true, result2.done);
  });
</script>

<script id=text_encoder_stream_encoding>
  {
    const tes = new TextEncoderStream();
    testing.expectEqual('utf-8', tes.encoding);
    testing.expectEqual('object', typeof tes.readable);
    testing.expectEqual('object', typeof tes.writable);
  }
</script>

<script id=text_encoder_stream_encode type=module>
  const state = await testing.async();

  const tes = new TextEncoderStream();
  const writer = tes.writable.getWriter();
  const reader = tes.readable.getReader();

  writer.write('hi');
  writer.close();

  const result = await reader.read();
  const result2 = await reader.read();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(false, result.done);
    testing.expectEqual(true, result.value instanceof Uint8Array);
    // 'hi' in UTF-8 is [104, 105]
    testing.expectEqual([104, 105], Array.from(result.value));
    testing.expectEqual(true, result2.done);
  });
</script>

<script id=pipe_through_basic type=module>
  const state = await testing.async();

  const input = new ReadableStream({
    start(controller) {
      controller.enqueue('hello');
      controller.close();
    }
  });

  const ts = new TransformStream({
    transform(chunk, controller) {
      controller.enqueue(chunk.toUpperCase());
    }
  });

  const reader = input.pipeThrough(ts).getReader();
  const result = await reader.read();
  const result2 = await reader.read();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(false, result.done);
    testing.expectEqual('HELLO', result.value);
    testing.expectEqual(true, result2.done);
  });
</script>

<script id=pipe_to_basic type=module>
  const state = await testing.async();

  const chunks = [];
  const input = new ReadableStream({
    start(controller) {
      controller.enqueue('a');
      controller.enqueue('b');
      controller.close();
    }
  });

  await input.pipeTo(new WritableStream({ write(chunk) { chunks.push(chunk); } }));

  state.resolve();
  await state.done(() => {
    testing.expectEqual(['a', 'b'], chunks);
  });
</script>

<script id=pipe_through_text_decoder type=module>
  const state = await testing.async();

  const bytes = new Uint8Array([104, 101, 108, 108, 111]);
  const input = new ReadableStream({
    start(controller) {

  });
</script>

<script id=transform_error_both_sides type=module>
  const state = await testing.async();

  // controller.error(e) errors the readable and the writable side with e.
  // close() on the errored writable rejects with a new TypeError.
  const err = new Error('boom');
  const ts = new TransformStream({ transform(chunk, controller) { controller.error(err); } });
  const writer = ts.writable.getWriter();
  const reader = ts.readable.getReader();
  // The readable starts with backpressure: transform() only runs once a read
  // is pending, so the read has to start before the write is awaited.
  const read = reader.read().catch((e) => e);
  await writer.write('a').catch(() => {});
  const errors = [
    await read,
    await writer.write('b').catch((e) => e),
    await writer.close().catch((e) => e),
  ];

  state.resolve();
  await state.done(() => {
    testing.expectEqual([true, true, false], errors.map((e) => e === err));
    testing.expectEqual(true, errors[2] instanceof TypeError);
  });
</script>

<script id=pipe_to_undefined_chunk type=module>
  const state = await testing.async();

  // undefined is a valid chunk: only `done` ends the pipe.
  const chunks = [];
  const input = new ReadableStream({
    start(controller) {
      controller.enqueue('a');
      controller.enqueue(undefined);
      controller.enqueue('b');
      controller.close();
    }
  });
  await input.pipeTo(new WritableStream({ write(chunk) { chunks.push(chunk); } }));

  // The identity transform passes values through untouched.
  const obj = { x: 1 };
  const piped = [];
  const reader = new ReadableStream({
    start(controller) {
      controller.enqueue(undefined);
      controller.enqueue('c');
      controller.enqueue(obj);
      controller.close();
    }
  }).pipeThrough(new TransformStream()).getReader();
  for (let r = await reader.read(); !r.done; r = await reader.read()) {
    piped.push(r.value);
  }

  state.resolve();
  await state.done(() => {
    testing.expectEqual(['a', undefined, 'b'], chunks);
    testing.expectEqual([undefined, 'c', obj], piped);
    testing.expectEqual(true, piped[2] === obj);
  });
</script>
