<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="testing.js"></script>

<script id=url_updates>
  {
    const originalUrl = location.href;

    // pushState updates the URL
    history.pushState(null, '', '/test-push-path');
    testing.expectEqual('/test-push-path', location.pathname);

    // replaceState updates the URL
    history.replaceState(null, '', '/test-replace-path');
    testing.expectEqual('/test-replace-path', location.pathname);

    // Restore original URL so other tests aren't affected
    history.replaceState(null, '', originalUrl);

    // pushState/replaceState must not be able to rewrite the URL to a
    // different origin (CWE-346 origin validation error).
    testing.expectError('SecurityError', () => history.pushState(null, '', 'http://localhost:9582/'));
    testing.expectError('SecurityError', () => history.replaceState(null, '', 'http://localhost:9582/'));
    testing.expectEqual(originalUrl, location.href);

    // Nor to a URL with no origin at all.
    testing.expectError('SecurityError', () => history.replaceState(null, '', 'data:text/html,hello'));
    testing.expectError('SecurityError', () => history.replaceState(null, '', 'javascript:void(0)'));
    testing.expectEqual(originalUrl, location.href);
  }
</script>
