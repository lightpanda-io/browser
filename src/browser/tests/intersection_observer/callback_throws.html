<!DOCTYPE html>
<script src="../testing.js"></script>
<div id="target">Target Element</div>

<script id=expectReportedErrors>
  let reported = 0;
  window.addEventListener('error', (e) => {
    reported += 1;
    e.preventDefault();
  });
  testing.expectEqual(0, reported);
</script>

<script id=callbackThrowsDOMException>
  {
    // Reporting reads the exception's message through a native accessor. The
    // delivered entries must survive that call.
    let calls = 0;
    const io = new IntersectionObserver(() => {
      calls += 1;
      throw new DOMException('nope', 'SyntaxError');
    });
    io.observe(document.getElementById('target'));

    testing.onload(() => {
      testing.expectEqual(1, calls);
      testing.expectEqual(1, reported);
      io.disconnect();
    });
  }
</script>
