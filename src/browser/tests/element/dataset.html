<!DOCTYPE html>
<script src="../testing.js"></script>

<div id="test" data-foo="bar" data-hello-world="test"></div>
<div id="test-write"></div>
<div id="test-bracket"></div>

<script id=basic>
{
  const el = document.getElementById('test');
  testing.expectEqual('object', typeof el.dataset);
}
</script>

<script id=readExistingAttributes>
{
  const el = document.getElementById('test');
  testing.expectEqual('bar', el.dataset.foo);
  testing.expectEqual('test', el.dataset.helloWorld);
}
</script>

<script id=camelCaseConversion>
{
  const el = document.getElementById('test');

  // Reading kebab-case as camelCase
  testing.expectEqual('test', el.dataset.helloWorld);
}
</script>

<script id=writeNewAttribute>
{
  const el = document.getElementById('test-write');
  el.dataset.newAttr = 'value';

  testing.expectEqual('value', el.dataset.newAttr);
  testing.expectEqual('value', el.getAttribute('data-new-attr'));

  el.dataset.newAttr = true;

  testing.expectEqual('true', el.dataset.newAttr);
  testing.expectEqual('true', el.getAttribute('data-new-attr'));
}
</script>

<script id=writeExistingAttribute>
{
  const el = document.getElementById('test-write');
  el.setAttribute('data-foo', 'original');
  el.dataset.foo = 'updated';

  testing.expectEqual('updated', el.dataset.foo);
  testing.expectEqual('updated', el.getAttribute('data-foo'));
}
</script>

<script id=writeCamelCaseConversion>
{
  const el = document.getElementById('test-write');

  // Writing camelCase creates kebab-case attribute
  el.dataset.fooBarBaz = 'qux';
  testing.expectEqual('qux', el.getAttribute('data-foo-bar-baz'));
}
</script>

<script id=undefinedForNonExistent>
{
  const el = document.getElementById('test');
  testing.expectEqual(undefined, el.dataset.nonExistent);
}
</script>

<script id=bracketNotation>
{
  const el = document.getElementById('test-bracket');
  el.setAttribute('data-foo', 'bar');
  el.setAttribute('data-hello-world', 'test');

  // Bracket notation should work the same as dot notation
  testing.expectEqual('bar', el.dataset['foo']);
  testing.expectEqual('test', el.dataset['helloWorld']);

  // Non-existent should return undefined
  testing.expectEqual(undefined, el.dataset['nonExistent']);
}
</script>

<script id=edgeCases>
{
  const el = document.createElement('div');
  el.setAttribute('data-x', 'single-letter');
  el.setAttribute('data-foo-bar-baz', 'multiple-dashes');

  // Single letter key
  testing.expectEqual('single-letter', el.dataset['x']);
  testing.expectEqual('single-letter', el.dataset.x);

  // Multiple dashes
  testing.expectEqual('multiple-dashes', el.dataset['fooBarBaz']);
  testing.expectEqual('multiple-dashes', el.dataset.fooBarBaz);

  // Empty string key (data- attribute) - should be accessible as empty string
  el.setAttribute('data-', 'empty');
  testing.expectEqual('empty', el.dataset['']);
}
</script>

<script id=propertyPresence>
{
  const el = document.getElementById('test');

  testing.expectEqual(true, 'foo' in el.dataset);
  testing.expectEqual(true, Object.hasOwn(el.dataset, 'foo'));
  testing.expectEqual(true, 'helloWorld' in el.dataset);

  testing.expectEqual(false, 'nonExistent' in el.dataset);
  testing.expectEqual(false, Object.hasOwn(el.dataset, 'nonExistent'));
  testing.expectEqual(false, Object.hasOwn(el.dataset, 'fooBar'));
}
</script>

<script id=propertyEnumeration>
{
  const el = document.getElementById('test');

  // dataset is not [LegacyUnenumerableNamedProperties]: the names enumerate.
  testing.expectEqual('foo,helloWorld', Object.keys(el.dataset).join(','));
  testing.expectEqual('foo,helloWorld', Object.getOwnPropertyNames(el.dataset).join(','));
  testing.expectEqual('{"foo":"bar","helloWorld":"test"}', JSON.stringify(el.dataset));

  const desc = Object.getOwnPropertyDescriptor(el.dataset, 'foo');
  testing.expectEqual('bar', desc.value);
  testing.expectEqual(true, desc.enumerable);
  testing.expectEqual(true, desc.configurable);
  testing.expectEqual(true, desc.writable);
  testing.expectEqual(undefined, Object.getOwnPropertyDescriptor(el.dataset, 'nonExistent'));

  // inherited properties are still found by `in`, but are not own
  testing.expectEqual(true, 'toString' in el.dataset);
  testing.expectEqual(false, Object.hasOwn(el.dataset, 'toString'));
}
</script>

<script id=presenceTracksAttribute>
{
  const el = document.createElement('div');
  const ds = el.dataset;

  testing.expectEqual(false, 'live' in ds);
  el.setAttribute('data-live', 'x');
  testing.expectEqual(true, 'live' in ds);
  el.removeAttribute('data-live');
  testing.expectEqual(false, 'live' in ds);

  ds.viaSetter = 'y';
  testing.expectEqual(true, 'viaSetter' in ds);
  delete ds.viaSetter;
  testing.expectEqual(false, 'viaSetter' in ds);

  // an empty value is still a present property
  el.setAttribute('data-empty', '');
  testing.expectEqual(true, 'empty' in ds);
  testing.expectEqual('', ds.empty);

  // the bare data- attribute maps to the empty name
  el.setAttribute('data-', 'bare');
  testing.expectEqual(true, '' in ds);
  testing.expectEqual('bare', ds['']);

  // deleting a name that was never there succeeds
  testing.expectEqual(true, delete ds.neverThere);
}
</script>

<script id=numericPropertyNames>
{
  const el = document.createElement('div');

  el.dataset[0] = 'zero';
  testing.expectEqual('zero', el.getAttribute('data-0'));
  testing.expectEqual('zero', el.dataset[0]);
  testing.expectEqual('zero', el.dataset['0']);
  testing.expectEqual(true, '0' in el.dataset);
  testing.expectEqual(true, Object.hasOwn(el.dataset, '0'));
  testing.expectEqual('0', Object.keys(el.dataset).join(','));

  delete el.dataset[0];
  testing.expectEqual(null, el.getAttribute('data-0'));
  testing.expectEqual(undefined, el.dataset[0]);
  testing.expectEqual(false, '0' in el.dataset);

  el.setAttribute('data-12', 'twelve');
  testing.expectEqual('twelve', el.dataset[12]);
  testing.expectEqual('twelve', el.dataset['12']);
  testing.expectEqual(true, '12' in el.dataset);
  testing.expectEqual(false, '13' in el.dataset);
}
</script>

<script id=indexedSetRunsCustomElementReactions>
{
  const seen = [];
  class DataWatcher extends HTMLElement {
    static get observedAttributes() { return ['data-0', 'data-name']; }
    attributeChangedCallback(name, oldValue, newValue) {
      seen.push(name + '=' + newValue);
    }
  }
  customElements.define('data-watcher', DataWatcher);

  const el = document.createElement('data-watcher');
  el.dataset.name = 'named';
  el.dataset[0] = 'indexed';
  delete el.dataset[0];

  testing.expectEqual('data-name=named,data-0=indexed,data-0=null', seen.join(','));
}
</script>

<script id=identityCheck>
{
  const el = document.getElementById('test');
  const ds1 = el.dataset;
  const ds2 = el.dataset;

  // Should return the same object instance
  testing.expectEqual(true, ds1 === ds2);
}
</script>

<script id=deleteProperty>
{
  const el = document.createElement('div');
  el.setAttribute('data-foo', 'bar');
  el.setAttribute('data-hello-world', 'test');

  testing.expectEqual('bar', el.dataset.foo);
  testing.expectEqual('test', el.dataset.helloWorld);

  // Delete using dot notation
  delete el.dataset.foo;
  testing.expectEqual(undefined, el.dataset.foo);
  testing.expectEqual(null, el.getAttribute('data-foo'));

  // Delete using bracket notation
  delete el.dataset['helloWorld'];
  testing.expectEqual(undefined, el.dataset.helloWorld);
  testing.expectEqual(null, el.getAttribute('data-hello-world'));
}
</script>

<script id=independentInstances>
{
  const el1 = document.getElementById('test');
  const el2 = document.createElement('div');

  el1.dataset.test1 = 'value1';
  el2.dataset.test2 = 'value2';

  testing.expectEqual('value1', el1.dataset.test1);
  testing.expectEqual(undefined, el1.dataset.test2);
  testing.expectEqual(undefined, el2.dataset.test1);
  testing.expectEqual('value2', el2.dataset.test2);
}
</script>
