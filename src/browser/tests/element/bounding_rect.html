<!DOCTYPE html>
<head>
  <title>Lightpanda Browser demo</title>
  <meta charset="UTF-8">
</head>
<body>
  <h1>Lightpanda Browser Demo</h1>

  <h2><a href="campfire-commerce/">Campfire Commerce</a></h2>
  <a href="campfire-commerce/"><img src="campfire-commerce/images/logo.jpg"></a>
  <p>
    Demo of an e-commerce product offer page with data loaded from XHR request.
    <br>
    All images and texts have been generated with AI.
    Template by <a href="https://codepen.io/Sunil_Pradhan/pen/qBqgLxK">Sunil Pradhan</a>
  </p>

  <h2><a href="amiibo/">Amiibo characters</a></h2>
  <a href="amiibo/"><img src="https://raw.githubusercontent.com/N3evin/AmiiboAPI/master/images/icon_04380001-03000502.png"></a>
  <p>
    Pages of Amiibo characters generated from
    <a href="https://www.amiiboapi.com">Amiibo API</a>.
  </p>
</body>
<script src="../testing.js"></script>
<script id="rect">
  const a1 = document.querySelector('[href="campfire-commerce/"]');
  const rect1 = a1.getBoundingClientRect();
  console.log("a1:", { x: rect1.x, y: rect1.y });

  const a2 = document.querySelector('[href="amiibo/"]');
  const rect2 = a2.getBoundingClientRect();

  // Each link starts its heading's line
  testing.expectEqual(rect1.x, rect2.x);
  testing.expectTrue(rect1.y != rect2.y);
  testing.expectEqual(a1, document.elementFromPoint(rect1.x, rect1.y))
  testing.expectEqual(a2, document.elementFromPoint(rect2.x, rect2.y))
</script>

<script id="fresh_rect">
{
  // The rect has no identity entry: it still behaves as a full DOMRect when
  // it comes back from JS.
  const el = document.querySelector('[href="amiibo/"]');
  const r1 = el.getBoundingClientRect();
  const r2 = el.getBoundingClientRect();
  testing.expectTrue(r1 !== r2);
  testing.expectTrue(r1 instanceof DOMRect);
  testing.expectTrue(r1 instanceof DOMRectReadOnly);

  r1.tag = 'kept';
  r1.x = 12;
  testing.expectEqual(12, r1.left);
  testing.expectEqual('kept', r1.tag);
  testing.expectEqual(r2.width, r1.width);

  const copy = DOMRect.fromRect(r1);
  testing.expectEqual(12, copy.x);
  testing.expectEqual(r1.height, copy.height);
  testing.expectEqual(12, structuredClone(r1).x);
  testing.expectEqual(12, r1.toJSON().x);

  const c1 = el.getClientRects();
  const c2 = el.getClientRects();
  testing.expectEqual(1, c1.length);
  testing.expectTrue(c1[0] !== c2[0]);
  testing.expectTrue(c1[0] instanceof DOMRect);
  testing.expectEqual(r2.width, DOMRect.fromRect(c1[0]).width);

  const range = document.createRange();
  range.selectNode(el);
  const b1 = range.getBoundingClientRect();
  testing.expectTrue(b1 !== range.getBoundingClientRect());
  testing.expectEqual(b1.width, DOMRect.fromRect(b1).width);
  const rr = range.getClientRects();
  testing.expectTrue(rr.length > 0);
  testing.expectTrue(rr[0] instanceof DOMRect);
  testing.expectTrue(rr[0] !== range.getClientRects()[0]);
}
</script>
