<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="../../testing.js"></script>

<audio id="audio1" src="test.mp3"></audio>
<video id="video1" src="test.mp4"></video>

<script id="canPlayType_audio">
  {
    const audio = document.getElementById('audio1');
    // single-codec types are "probably" on their own, containers "maybe"
    testing.expectEqual('probably', audio.canPlayType('audio/mp3'));
    testing.expectEqual('probably', audio.canPlayType('audio/mpeg'));
    testing.expectEqual('probably', audio.canPlayType(' AUDIO/MPEG '));
    testing.expectEqual('probably', audio.canPlayType('audio/aac'));
    testing.expectEqual('probably', audio.canPlayType('audio/flac'));
    testing.expectEqual('maybe', audio.canPlayType('audio/webm'));
    testing.expectEqual('maybe', audio.canPlayType('audio/ogg'));
    testing.expectEqual('maybe', audio.canPlayType('audio/wav'));
    testing.expectEqual('maybe', audio.canPlayType('audio/mp4'));
    testing.expectEqual('', audio.canPlayType('audio/wave'));
    testing.expectEqual('', audio.canPlayType('audio/invalid'));
    testing.expectEqual('', audio.canPlayType('video/invalid'));
  }
</script>

<script id="canPlayType_video">
  {
    const video = document.getElementById('video1');
    testing.expectEqual('maybe', video.canPlayType('video/mp4'));
    testing.expectEqual('maybe', video.canPlayType('video/webm'));
    testing.expectEqual('maybe', video.canPlayType('video/ogg'));
    testing.expectEqual('', video.canPlayType('video/quicktime'));
    testing.expectEqual('', video.canPlayType('video/invalid'));
  }
</script>

<script id="canPlayType_with_codecs">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual('probably', audio.canPlayType('video/mp4; codecs="avc1.42E01E"'));
    testing.expectEqual('probably', audio.canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"'));
    testing.expectEqual('probably', audio.canPlayType('video/webm;codecs=vp8'));
    testing.expectEqual('probably', audio.canPlayType('video/webm; codecs="vp9, opus"'));
    testing.expectEqual('probably', audio.canPlayType('audio/ogg; codecs="flac"'));
    testing.expectEqual('probably', audio.canPlayType('audio/wav; codecs="1"'));
    testing.expectEqual('probably', audio.canPlayType('audio/mpeg; codecs="mp3"'));
    testing.expectEqual('probably', audio.canPlayType('audio/mpeg; codecs='));

    // no profile
    testing.expectEqual('maybe', audio.canPlayType('video/mp4; codecs="avc1"'));
    testing.expectEqual('maybe', audio.canPlayType('audio/mp4; codecs="mp4a.40"'));

    // single-codec types take no codecs parameter
    testing.expectEqual('', audio.canPlayType('audio/mp3; codecs="mp3"'));
    testing.expectEqual('', audio.canPlayType('audio/flac; codecs="flac"'));

    // a codec the container can't hold, or an unknown one, sinks the whole list
    testing.expectEqual('', audio.canPlayType('audio/webm; codecs="vp8"'));
    testing.expectEqual('', audio.canPlayType('video/ogg; codecs="vp9"'));
    testing.expectEqual('', audio.canPlayType('video/mp4; codecs="avc1.42E01E, bogus"'));
    testing.expectEqual('', audio.canPlayType('video/mp4; codecs="AVC1.42E01E"'));
  }
</script>

<script id="play_pause">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual(true, audio.paused);

    // Chrome rejects it: pause() interrupts the load
    var resolved = false;
    audio.play().then(() => {
      resolved = true;
    }, () => {});
    testing.expectEqual(false, audio.paused);

    audio.pause();
    testing.expectEqual(true, audio.paused);
    testing.onload(() => {
      testing.diverges('Lightpanda fakes playback', () => {
        testing.expectEqual(true, resolved);
      });
    })
  }
</script>

<script id="play_pause_events">
  {
    const audio = document.createElement('audio');
    const events = [];

    audio.addEventListener('play', () => events.push('play'));
    audio.addEventListener('playing', () => events.push('playing'));
    audio.addEventListener('pause', () => events.push('pause'));
    audio.addEventListener('emptied', () => events.push('emptied'));

    // Chrome queues play, and fires playing only once media is loaded
    testing.diverges('Lightpanda fakes playback', () => {
      // First play: paused -> playing, fires play + playing
      audio.play().catch(() => {});
      testing.expectEqual('play,playing', events.join(','));

      // Second play: already playing, no events
      audio.play().catch(() => {});
      testing.expectEqual('play,playing', events.join(','));

      // Pause: playing -> paused, fires pause
      audio.pause();
      testing.expectEqual('play,playing,pause', events.join(','));

      // Second pause: already paused, no event
      audio.pause();
      testing.expectEqual('play,playing,pause', events.join(','));

      // Third play: resume from pause, fires play + playing
      audio.play().catch(() => {});
      testing.expectEqual('play,playing,pause,play,playing', events.join(','));

      // Pause again
      audio.pause();
      testing.expectEqual('play,playing,pause,play,playing,pause', events.join(','));

      // Load: resets state, fires emptied
      audio.load();
      testing.expectEqual('play,playing,pause,play,playing,pause,emptied', events.join(','));

      // Play after load: fires play + playing
      audio.play().catch(() => {});
      testing.expectEqual('play,playing,pause,play,playing,pause,emptied,play,playing', events.join(','));
    });
  }
</script>

<script id="volume_muted">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual(1.0, audio.volume);
    testing.expectEqual(false, audio.muted);

    audio.volume = 0.5;
    testing.expectEqual(0.5, audio.volume);

    testing.expectError('IndexSizeError', () => { audio.volume = 1.5; });
    testing.expectError('IndexSizeError', () => { audio.volume = -0.5; });
    testing.expectEqual(0.5, audio.volume);

    audio.muted = true;
    testing.expectEqual(true, audio.muted);
  }
</script>

<script id="playback_rate">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual(1.0, audio.playbackRate);

    audio.playbackRate = 2.0;
    testing.expectEqual(2.0, audio.playbackRate);

    audio.playbackRate = 0.5;
    testing.expectEqual(0.5, audio.playbackRate);
  }
</script>

<script id="currentTime">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual(0, audio.currentTime);

    audio.currentTime = 10.5;
    testing.expectEqual(10.5, audio.currentTime);
  }
</script>

<script id="duration_nan">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual(true, isNaN(audio.duration));
  }
</script>

<script id="ended_seeking">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual(false, audio.ended);
    testing.expectEqual(false, audio.seeking);
  }
</script>

<script id="ready_state_network_state">
  {
    // Create a fresh element to test initial state
    const audio = document.createElement('audio');
    testing.expectEqual(0, audio.readyState); // HAVE_NOTHING initially
    testing.expectEqual(0, audio.networkState); // NETWORK_EMPTY initially

    audio.play().catch(() => {});
    testing.diverges('Lightpanda fakes playback', () => {
      testing.expectEqual(4, audio.readyState);
      testing.expectEqual(1, audio.networkState);
    });
  }
</script>

<script id="load_reset">
  {
    // Create a fresh element to test load() behavior
    const audio = document.createElement('audio');
    audio.currentTime = 50;
    audio.play().catch(() => {});

    audio.load();
    testing.expectEqual(true, audio.paused);
    testing.expectEqual(0, audio.readyState);
    testing.diverges('Chrome: load() of an element without a source keeps the position', () => {
      testing.expectEqual(0, audio.currentTime);
    });
  }
</script>

<script id="attributes_autoplay">
  {
    const video = document.createElement('video');
    testing.expectEqual(false, video.autoplay);

    video.setAttribute('autoplay', '');
    testing.expectEqual(true, video.autoplay);

    video.autoplay = false;
    testing.expectEqual(false, video.autoplay);

    video.autoplay = true;
    testing.expectEqual(true, video.autoplay);
  }
</script>

<script id="attributes_controls">
  {
    const video = document.createElement('video');
    testing.expectEqual(false, video.controls);

    video.controls = true;
    testing.expectEqual(true, video.controls);

    video.controls = false;
    testing.expectEqual(false, video.controls);
  }
</script>

<script id="attributes_loop">
  {
    const audio = document.createElement('audio');
    testing.expectEqual(false, audio.loop);

    audio.loop = true;
    testing.expectEqual(true, audio.loop);
  }
</script>

<script id="attributes_preload">
  {
    const audio = document.createElement('audio');
    testing.expectEqual('metadata', audio.preload);

    audio.preload = '';
    testing.expectEqual('auto', audio.preload);

    audio.preload = 'bogus';
    testing.expectEqual('metadata', audio.preload);

    audio.preload = 'AUTO';
    testing.expectEqual('auto', audio.preload);

    audio.preload = 'none';
    testing.expectEqual('none', audio.preload);

    audio.preload = 'metadata';
    testing.expectEqual('metadata', audio.preload);
  }
</script>

<script id="attributes_src">
  {
    const audio = document.createElement('audio');
    testing.expectEqual('', audio.src);
    testing.expectEqual('', audio.currentSrc);

    audio.src = 'test.mp3';
    testing.expectEqual(testing.BASE_URL + 'element/html/test.mp3', audio.src);
    testing.diverges('Lightpanda sets currentSrc without running resource selection', () => {
      testing.expectEqual(testing.BASE_URL + 'element/html/test.mp3', audio.currentSrc);
    });
  }
</script>

<script id="video_poster">

    const video = document.createElement('video');
    testing.expectEqual('', video.poster);

    video.poster = 'poster.jpg';
    testing.expectEqual(testing.BASE_URL + 'element/html/poster.jpg', video.poster);
  }
</script>

<script id="video_dimensions">
  {
    const video = document.getElementById('video1');
    testing.expectEqual(0, video.videoWidth);

<script id="constants">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual(0, audio.NETWORK_EMPTY);
    testing.expectEqual(1, audio.NETWORK_IDLE);
    testing.expectEqual(2, audio.NETWORK_LOADING);
    testing.expectEqual(3, audio.NETWORK_NO_SOURCE);

    testing.expectEqual(0, audio.HAVE_NOTHING);
    testing.expectEqual(1, audio.HAVE_METADATA);
    testing.expectEqual(2, audio.HAVE_CURRENT_DATA);

<script id="create_audio_element">
  {
    const audio = document.createElement('audio');
    testing.expectEqual('[object HTMLAudioElement]', audio.toString());
    testing.expectEqual(true, audio.paused);
  }

  // Create with `Audio` constructor.
  {
    const audio = new Audio();
    testing.expectEqual(true, audio instanceof HTMLAudioElement);
    testing.expectEqual("[object HTMLAudioElement]", audio.toString());
    testing.expectEqual(true, audio.paused);
    testing.expectEqual("auto", audio.getAttribute("preload"));
  }
</script>

<script id="create_video_element">
  {
    const video = document.createElement('video');
    testing.expectEqual('[object HTMLVideoElement]', video.toString());
    testing.expectEqual(true, video.paused);
  }
</script>

<script id="legacy_factory_function">
  // https://webidl.spec.whatwg.org/#legacy-factory-functions
  testing.expectEqual(true, Audio !== HTMLAudioElement)
  testing.expectEqual('Audio', Audio.name)
  testing.expectEqual(0, Audio.length)
  testing.expectEqual(HTMLAudioElement.prototype, Audio.prototype)
  testing.expectEqual(HTMLAudioElement, new Audio().constructor)
  testing.expectEqual('audio', new Audio().localName)
  testing.expectError('TypeError', () => new HTMLAudioElement())
  testing.expectError('TypeError', () => Audio())

  const desc = Object.getOwnPropertyDescriptor(Audio, 'prototype')
  testing.expectEqual(false, desc.writable)
  testing.expectEqual(false, desc.enumerable)
  testing.expectEqual(false, desc.configurable)

  testing.expectEqual(false, Object.keys(window).includes('Audio'))
  testing.expectEqual(false, Object.keys(window).includes('HTMLAudioElement'))
</script>
