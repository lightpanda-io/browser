<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="../../testing.js"></script>

<!-- Dialog elements -->
<dialog id="dialog1">Dialog content</dialog>
<dialog id="dialog2" open>Open dialog</dialog>

<script id="open_initial">
  testing.expectEqual(false, $('#dialog1').open)
  testing.expectEqual(true, $('#dialog2').open)
</script>

<script id="open_set">
  {
    $('#dialog1').open = true
    testing.expectEqual(true, $('#dialog1').open)

    $('#dialog2').open = false
    testing.expectEqual(false, $('#dialog2').open)
  }
</script>

<script id="open_reflects_to_attribute">
  {
    const dialog = document.createElement('dialog')
    testing.expectEqual(null, dialog.getAttribute('open'))
    testing.expectFalse(dialog.outerHTML.includes('open'))

    dialog.open = true
    testing.expectEqual('', dialog.getAttribute('open'))
    testing.expectTrue(dialog.outerHTML.includes('open'))

    dialog.open = false
    testing.expectEqual(null, dialog.getAttribute('open'))
    testing.expectFalse(dialog.outerHTML.includes('open'))
  }
</script>

<script id="returnValue_initial">
  {
    const dialog = document.createElement('dialog')
    testing.expectEqual('', dialog.returnValue)
  }
</script>

<script id="returnValue_set">
  {
    const dialog = document.createElement('dialog')
    testing.expectEqual('', dialog.returnValue)

    dialog.returnValue = 'success'
    testing.expectEqual('success', dialog.returnValue)

    dialog.returnValue = 'cancel'
    testing.expectEqual('cancel', dialog.returnValue)
  }
</script>

<script id="returnValue_is_not_an_attribute">
  {
    const dialog = document.createElement('dialog')
    dialog.returnValue = 'confirmed'
    testing.expectEqual(null, dialog.getAttribute('returnvalue'))

    dialog.setAttribute('returnvalue', 'other')
    testing.expectEqual('confirmed', dialog.returnValue)
    testing.expectEqual('', dialog.cloneNode().returnValue)
  }
</script>

<script id="element_type">
  {
    const dialog = document.createElement('dialog')
    testing.expectEqual('DIALOG', dialog.tagName)
    testing.expectTrue(dialog instanceof HTMLDialogElement)
  }
</script>

<script id="show_sets_open">
  {
    const dialog = document.createElement('dialog')
    testing.expectEqual(false, dialog.open)

    dialog.show()
    testing.expectEqual(true, dialog.open)
    testing.expectEqual('', dialog.getAttribute('open'))
  }
</script>

<script id="show_noop_when_already_open">
  {
    const dialog = document.createElement('dialog')
    dialog.setAttribute('open', '')
    testing.expectEqual(true, dialog.open)

    dialog.show()
    testing.expectEqual(true, dialog.open)
  }
</script>

<script id="showModal_sets_open">
  {
    const dialog = document.createElement('dialog')
    document.body.append(dialog)
    testing.expectEqual(false, dialog.open)

    dialog.showModal()
    testing.expectEqual(true, dialog.open)
    testing.expectEqual('', dialog.getAttribute('open'))

    // already modal: a no-op
    dialog.showModal()
    testing.expectEqual(true, dialog.open)
    dialog.close()
    dialog.remove()
  }
</script>

<script id="showModal_throws_when_disconnected">
  {
    const dialog = document.createElement('dialog')
    testing.expectError('InvalidStateError', () => dialog.showModal())
    testing.expectEqual(false, dialog.open)
  }
</script>

<script id="showModal_throws_when_open_non_modal">
  {
    const dialog = document.createElement('dialog')
    document.body.append(dialog)
    dialog.show()
    testing.expectError('InvalidStateError', () => dialog.showModal())
    dialog.close()
    dialog.remove()
  }
</script>

<script id="showModal_throws_when_popover_showing">
  {
    const dialog = document.createElement('dialog')
    dialog.popover = 'manual'
    document.body.append(dialog)
    dialog.showPopover()
    testing.expectError('InvalidStateError', () => dialog.showModal())
    testing.expectEqual(false, dialog.open)
    dialog.hidePopover()
    dialog.remove()
  }
</script>

<script id="showModal_throws_when_already_open">
  {
    const dialog = document.createElement('dialog')
    dialog.setAttribute('open', '')

    testing.expectError('InvalidStateError', () => dialog.showModal())
    testing.expectEqual(true, dialog.open)
  }
</script>

<script id="close_removes_open">
  {
    const dialog = document.createElement('dialog')
    dialog.show()
    testing.expectEqual(true, dialog.open)

    dialog.close()
    testing.expectEqual(false, dialog.open)
    testing.expectEqual(null, dialog.getAttribute('open'))
  }
</script>

<script id="close_noop_when_not_open">
  {
    const dialog = document.createElement('dialog')
    testing.expectEqual(false, dialog.open)

    dialog.close()
    testing.expectEqual(false, dialog.open)
  }
</script>

<script id="close_sets_returnValue_when_arg_given">
  {
    const dialog = document.createElement('dialog')
    dialog.show()

    dialog.close('confirmed')
    testing.expectEqual('confirmed', dialog.returnValue)
  }
</script>

<script id="close_preserves_returnValue_when_no_arg">
  {
    const dialog = document.createElement('dialog')
    dialog.returnValue = 'preset'
    dialog.show()

    dialog.close()
    testing.expectEqual('preset', dialog.returnValue)
  }
</script>

<script id="close_fires_close_event">
  {
    const dialog = document.createElement('dialog')
    document.body.appendChild(dialog)
    dialog.show()

    let fired = 0
    let bubbled = false
    let cancelable = null
    dialog.addEventListener('close', (e) => {
      fired++
      cancelable = e.cancelable
    })
    document.addEventListener('close', () => { bubbled = true })

    dialog.close('done')
    // queued, not fired synchronously
    testing.expectEqual(0, fired)
    testing.onload(() => {
      testing.expectEqual(1, fired)
      testing.expectEqual(false, bubbled)
      testing.expectEqual(false, cancelable)
    })
  }
</script>

<script id="close_does_not_fire_event_when_not_open">
  {
    const dialog = document.createElement('dialog')
    document.body.appendChild(dialog)

    let fired = 0
    dialog.addEventListener('close', () => fired++)

    dialog.close()
    testing.expectEqual(0, fired)
  }
</script>

<script id="dialog_method_closes_with_submitter_value">
  {
    document.body.insertAdjacentHTML('beforeend',
      '<dialog id="d_submit"><form method="dialog">' +
      '<button type="submit" value="confirm" id="b_submit">ok</button>' +
      '</form></dialog>')

    const dialog = $('#d_submit')
    dialog.showModal()

    let fired = 0
    dialog.addEventListener('close', () => fired++)

    $('#b_submit').click()

    testing.expectEqual(false, dialog.open)
    testing.expectEqual('confirm', dialog.returnValue)
    testing.onload(() => testing.expectEqual(1, fired))
  }
</script>

<script id="dialog_method_keeps_returnValue_when_submitter_has_no_value">
  {
    document.body.insertAdjacentHTML('beforeend',
      '<dialog id="d_novalue"><form method="dialog">' +
      '<button type="submit" id="b_novalue">ok</button>' +
      '</form></dialog>')

    const dialog = $('#d_novalue')
    dialog.returnValue = 'preset'
    dialog.showModal()

    $('#b_novalue').click()

    // no value attribute: the result is null, which keeps returnValue
    testing.expectEqual(false, dialog.open)
    testing.expectEqual('preset', dialog.returnValue)
  }
</script>

<script id="dialog_method_closes_nearest_ancestor_dialog">
  {
    document.body.insertAdjacentHTML('beforeend',
      '<dialog id="d_outer"><dialog id="d_inner"><form method="dialog">' +
      '<button type="submit" value="inner" id="b_nested">ok</button>' +
      '</form></dialog></dialog>')

    const outer = $('#d_outer')
    const inner = $('#d_inner')
    outer.show()
    inner.show()

    $('#b_nested').click()

    testing.expectEqual(false, inner.open)
    testing.expectEqual('inner', inner.returnValue)
    testing.expectEqual(true, outer.open)
  }
</script>

<script id="dialog_method_is_inert_without_ancestor_dialog">
  {
    // No ancestor dialog: the submission is dropped. It must not fall through
    // to a GET submission either, so the form's own submit handler is the only
    // thing that runs.
    document.body.insertAdjacentHTML('beforeend',
      '<form method="dialog" id="f_orphan">' +
      '<button type="submit" value="x" id="b_orphan">ok</button>' +
      '</form>')

    let submits = 0
    $('#f_orphan').addEventListener('submit', () => submits++)

    $('#b_orphan').click()
    testing.expectEqual(1, submits)
  }
</script>

<script id="dialog_method_honors_formmethod_on_submitter">
  {
    // formmethod on the submit button overrides the form's method, so a GET
    // form can still close its dialog.
    document.body.insertAdjacentHTML('beforeend',
      '<dialog id="d_formmethod"><form method="get">' +
      '<button type="submit" formmethod="dialog" value="via-formmethod" id="b_formmethod">ok</button>' +
      '</form></dialog>')

    const dialog = $('#d_formmethod')
    dialog.showModal()

    $('#b_formmethod').click()

    testing.expectEqual(false, dialog.open)
    testing.expectEqual('via-formmethod', dialog.returnValue)
  }
</script>
