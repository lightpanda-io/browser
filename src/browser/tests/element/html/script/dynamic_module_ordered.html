<!DOCTYPE html>
<head></head>
<meta name=lp-mode content=test>
<script src="../../../testing.js"></script>

<!-- Alone in its document: this test observes DOMContentLoaded, which any
     other script in the page could delay. -->
<script id=dynamic_module_ordered>
{
  // Dynamic module scripts with async = false run in insertion order and do
  // not delay DOMContentLoaded.
  window.moduleOrderedList = '';
  let atDomContentLoaded = null;
  document.addEventListener('DOMContentLoaded', () => {
    atDomContentLoaded = moduleOrderedList;
  });
  function insertOrderedModule(src) {
    const s = document.createElement('script');
    s.type = 'module';
    s.src = src;
    s.async = false;
    document.head.appendChild(s);
  }
  insertOrderedModule('dynamic_module_ordered1.js?delay_ms=200');
  insertOrderedModule('dynamic_module_ordered2.js');
  testing.onload(() => {
    testing.expectEqual('', atDomContentLoaded);
    testing.expectEqual('12', moduleOrderedList);
  });
}
</script>
