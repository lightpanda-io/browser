<!DOCTYPE html>
<head></head>
<meta name=lp-mode content=test>
<script src="../../../testing.js"></script>

<script>
  window.domLoaded = false;
  document.addEventListener('DOMContentLoaded', () => window.domLoaded = true);

  // Delayed scripts come from the other loopback name: Chrome allows 6
  // connections per host, so on the page's own host the delayed requests
  // can hold every socket and make the fast ones wait just as long.
  function slow(name, ms = 200) {
    const url = new URL(name, location.href);
    url.hostname = url.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
    url.search = `delay_ms=${ms}`;
    return url.href;
  }

  function insertScript(src, async, onerror) {
    const s = document.createElement('script');
    s.src = src;
    if (async === false) s.async = false;
    if (onerror) s.onerror = onerror;
    document.head.appendChild(s);
  }
</script>

<script>
  window.inlineModuleList = '';
  // A slow parser-inserted defer script, which async inline modules don't
  // wait for. Shorter than the other delays: it holds DOMContentLoaded.
  document.write(`<script defer src="${slow('dynamic_order_inline_defer.js', 100)}"><\/script>`);
</script>

<script id=insertion_order>
{
  // The first script finishes downloading last, but still runs first.
  window.orderedList = '';
  insertScript(slow('dynamic_order1.js'), false);
  insertScript('dynamic_order2.js', false);
  testing.onload(() => {
    testing.expectEqual('12', orderedList);
    // Ordered scripts don't delay DOMContentLoaded.
    testing.expectEqual(true, window.domLoadedBefore1);
  });
}
</script>

<script id=failure_does_not_block>
{
  window.failedOrderedError = false;
  window.failureOrderedList = '';
  insertScript(slow('dynamic_order_missing.js', 100), false, () => window.failedOrderedError = true);
  insertScript('dynamic_order3.js', false);
  testing.onload(() => {
    testing.expectEqual(true, failedOrderedError);
    testing.expectEqual('3', failureOrderedList);
  });
}
</script>

<script id=force_async_not_ordered>
{
  // A default (force-async) dynamic script doesn't wait for ordered ones.
  window.mixedList = '';
  insertScript(slow('dynamic_order_mixed_ordered.js'), false);
  insertScript('dynamic_order_mixed_async.js');
  testing.onload(() => {
    testing.expectEqual('async,ordered', mixedList);
  });
}
</script>

<script id=defer_ignored>
{
  // defer has no effect on a dynamic script: it stays async, so it runs in
  // completion order and doesn't wait for parsing.
  window.deferIgnoredList = '';
  for (const src of [slow('dynamic_order_defer1.js'), 'dynamic_order_defer2.js']) {
    const s = document.createElement('script');
    s.src = src;
    s.defer = true;
    document.head.appendChild(s);
  }
  testing.onload(() => {
    testing.expectEqual('21', deferIgnoredList);
    testing.expectEqual(true, window.domLoadedBeforeDefer1);
  });
}
</script>

<script id=async_attribute_clears_force_async>
{
  // Adding the async attribute clears force-async, so once it's removed
  // again the script is ordered.
  window.attributeList = '';
  for (const src of [slow('dynamic_order_attribute1.js'), 'dynamic_order_attribute2.js']) {
    const s = document.createElement('script');
    s.src = src;
    s.setAttribute('async', '');
    s.removeAttribute('async');
    document.head.appendChild(s);
  }
  testing.onload(() => {
    testing.expectEqual('12', attributeList);
  });
}
</script>

<script id=module_ordered>
{
  // A dynamic module with async = false is ordered, not deferred.
  window.moduleOrderedList = '';
  for (const src of [slow('dynamic_order_module1.js'), 'dynamic_order_module2.js']) {
    const s = document.createElement('script');
    s.type = 'module';
    s.src = src;
    s.async = false;
    document.head.appendChild(s);
  }
  testing.onload(() => {
    testing.expectEqual('12', moduleOrderedList);
    testing.expectEqual(true, window.domLoadedBeforeModule1);
  });
}
</script>

<script id=module_force_async>
{
  // A default dynamic module is async, not deferred.
  window.moduleAsyncList = '';
  for (const src of [slow('dynamic_order_module_async1.js'), 'dynamic_order_module_async2.js']) {
    const s = document.createElement('script');
    s.type = 'module';
    s.src = src;
    document.head.appendChild(s);
  }
  testing.onload(() => {
    testing.expectEqual('21', moduleAsyncList);
  });
}
</script>

<script id=inline_module_ordered>
{
  // A dynamic inline module with async = false waits behind an ordered
  // remote script that's still downloading.
  insertScript(slow('dynamic_order_inline_slow.js'), false);
  const s = document.createElement('script');
  s.type = 'module';
  s.async = false;
  s.textContent = "window.inlineModuleList += 'ordered,';";
  document.head.appendChild(s);
  // modules never run synchronously
  testing.expectEqual('', inlineModuleList);
}
</script>

<script>
{
  // A default dynamic inline module is async: it doesn't wait for the
  // parser-inserted defer script.
  const s = document.createElement('script');
  s.type = 'module';
  s.textContent = "window.inlineModuleList += 'dynamic,';";
  document.head.appendChild(s);
}
</script>

<script type=module async>
  window.inlineModuleList += 'async,';
</script>

<script id=inline_module_async>
{
  testing.onload(() => {
    const at = (name) => inlineModuleList.split(',').indexOf(name);
    // async inline modules (parser or dynamic) don't wait for the defer script
    testing.expectTrue(at('async') !== -1 && at('async') < at('defer'));
    testing.expectTrue(at('dynamic') !== -1 && at('dynamic') < at('defer'));
    testing.expectTrue(at('slow') !== -1 && at('slow') < at('ordered'));
  });
}
</script>
