<div id="attr-scroll" onscroll="window.x = 1"></div>

<script id="attr_listener_returns_function">
{
    // Inline listeners set via HTML attributes should return a function
    testing.expectEqual('function', typeof $('#attr-click').onclick);
    testing.expectEqual('function', typeof $('#attr-load').onload);
    testing.expectEqual('function', typeof $('#attr-error').onerror);
    testing.expectEqual('function', typeof $('#attr-focus').onfocus);

    testing.expectEqual('function', typeof $('#attr-keydown').onkeydown);
    testing.expectEqual('function', typeof $('#attr-mousedown').onmousedown);

    testing.expectEqual('function', typeof $('#attr-wheel').onwheel);
    testing.expectEqual('function', typeof $('#attr-scroll').onscroll);
    testing.expectEqual('function', typeof $('#attr-contextmenu').oncontextmenu);
}
</script>

<script id="js_setter_getter">
{
    // Test setting and getting listeners via JavaScript property
    const div = document.createElement('div');

    // Initially null
    testing.expectEqual(null, div.onclick);
    testing.expectEqual(null, div.onload);
    testing.expectEqual(null, div.onerror);

    // Set listeners
    const clickHandler = () => {};
    const loadHandler = () => {};
    const errorHandler = () => {};

    div.onclick = clickHandler;
    div.onload = loadHandler;
    div.onerror = errorHandler;

    // Verify they can be retrieved and are functions
    testing.expectEqual('function', typeof div.onclick);
    testing.expectEqual('function', typeof div.onload);
    testing.expectEqual('function', typeof div.onerror);
}
</script>

<script id="js_listener_invoke">
{
    // Test that JS-set listeners can be invoked directly
    const div = document.createElement('div');
    window.jsInvokeResult = 0;

    div.onclick = () => { window.jsInvokeResult = 100; };
    div.onclick();
    testing.expectEqual(100, window.jsInvokeResult);

    div.onload = () => { window.jsInvokeResult = 200; };
    div.onload();
    testing.expectEqual(200, window.jsInvokeResult);

    div.onfocus = () => { window.jsInvokeResult = 300; };
    div.onfocus();
    testing.expectEqual(300, window.jsInvokeResult);
}
</script>

<script id="js_listener_invoke_with_return">
{
    // Test that JS-set listeners return values when invoked
    const div = document.createElement('div');

    div.onclick = () => { return 'click-result'; };
    testing.expectEqual('click-result', div.onclick());

    div.onload = () => { return 42; };
    testing.expectEqual(42, div.onload());

    div.onfocus = () => { return { key: 'value' }; };
    testing.expectEqual('value', div.onfocus().key);
}
</script>

<script id="js_listener_invoke_with_args">
{
    // Test that JS-set listeners can receive arguments when invoked
    const div = document.createElement('div');

    div.onclick = (a, b) => { return a + b; };
    testing.expectEqual(15, div.onclick(10, 5));

    div.onload = (msg) => { return 'Hello, ' + msg; };
    testing.expectEqual('Hello, World', div.onload('World'));
}
</script>

<script id="js_setter_override">
{
    // Test that setting a new listener overrides the old one
    const div = document.createElement('div');

    const first = () => { return 1; };
    const second = () => { return 2; };

    div.onclick = first;
    testing.expectEqual('function', typeof div.onclick);
    testing.expectEqual(1, div.onclick());

    div.onclick = second;
    testing.expectEqual('function', typeof div.onclick);
    testing.expectEqual(2, div.onclick());
}
</script>

<script id="js_setter_null_clears_listener">
{
    // Setting an event handler property to null must silently clear it (not throw).
    // Browsers also accept undefined and non-function values without throwing.
    const div = document.createElement('div');

    div.onload = () => 42;
    testing.expectEqual('function', typeof div.onload);

    // Setting to null removes the listener; getter returns null
    div.onload = null;
    testing.expectEqual(null, div.onload);

    div.onerror = () => {};
    div.onerror = null;
    testing.expectEqual(null, div.onerror);

    div.onclick = () => {};
    div.onclick = null;
    testing.expectEqual(null, div.onclick);
}
</script>

<script id="different_event_types_independent">
{
    // Test that different event types are stored independently
    const div = document.createElement('div');

    const clickFn = () => {};
    const focusFn = () => {};
    const blurFn = () => {};

    div.onclick = clickFn;
    testing.expectEqual('function', typeof div.onclick);
    testing.expectEqual(null, div.onfocus);
    testing.expectEqual(null, div.onblur);

    div.onfocus = focusFn;
    testing.expectEqual('function', typeof div.onclick);
    testing.expectEqual('function', typeof div.onfocus);
    testing.expectEqual(null, div.onblur);

    div.onblur = blurFn;
    testing.expectEqual('function', typeof div.onclick);
    testing.expectEqual('function', typeof div.onfocus);
    testing.expectEqual('function', typeof div.onblur);
}
</script>

<div id="order-attr" onclick="window.order.push('attr')"><span id="order-attr-child"></span></div>
<div id="bad-attr" onclick="this is not valid js("></div>

<script id="handler_order_property">
{
    const r = [];
    const a = document.createElement('a');
    a.addEventListener('click', () => r.push(1));
    a.onclick = () => r.push(2);
    a.addEventListener('click', () => r.push(3));
    a.click();
    testing.expectEqual('1,2,3', r.join());

    // Replacing a non-null handler keeps its position.
    r.length = 0;
    a.onclick = () => r.push('b');
    a.click();
    testing.expectEqual('1,b,3', r.join());

    // Setting it to null removes it; setting it again appends it.
    r.length = 0;
    a.onclick = null;
    a.click();
    testing.expectEqual('1,3', r.join());

    r.length = 0;
    a.onclick = () => r.push('c');
    a.click();
    testing.expectEqual('1,3,c', r.join());

    // At the target, capture listeners run before the handler.
    r.length = 0;
    a.addEventListener('click', () => r.push('capture'), true);
    a.click();
    testing.expectEqual('capture,1,3,c', r.join());

    // A non-object value clears it.
    a.onclick = 5;
    testing.expectEqual(null, a.onclick);
}
</script>

<script id="handler_return_value">
{
    const a = document.createElement('a');
    a.onclick = () => false;
    let e = new MouseEvent('click', { cancelable: true });
    a.dispatchEvent(e);
    testing.expectEqual(true, e.defaultPrevented);

    // Only false cancels; and not for a passive-looking undefined.
    a.onclick = () => undefined;
    e = new MouseEvent('click', { cancelable: true });
    a.dispatchEvent(e);
    testing.expectEqual(false, e.defaultPrevented);

    // An element's onerror isn't special: false cancels it too.
    const img = document.createElement('img');
    img.onerror = () => false;
    e = new Event('error', { cancelable: true });
    img.dispatchEvent(e);
    testing.expectEqual(true, e.defaultPrevented);
}
</script>

<script id="handler_order_content_attribute">
{
    window.order = [];
    const div = $('#order-attr');
    div.addEventListener('click', () => window.order.push('listener'));
    $('#order-attr-child').click();
    testing.expectEqual('attr,listener', window.order.join());

    // Setting the content attribute replaces the property's value, and
    // removing it removes the handler.
    window.order = [];
    div.onclick = () => window.order.push('property');
    div.setAttribute('onclick', "window.order.push('attr2')");
    div.click();
    testing.expectEqual('attr2,listener', window.order.join());

    window.order = [];
    div.removeAttribute('onclick');
    testing.expectEqual(null, div.onclick);
    div.click();
    testing.expectEqual('listener', window.order.join());

    window.order = [];
    div.setAttribute('onclick', "window.order.push('attr3')");
    div.click();
    testing.expectEqual('listener,attr3', window.order.join());

    // Cloning keeps the attribute's handler.
    window.order = [];
    const clone = div.cloneNode();
    clone.addEventListener('click', () => window.order.push('clone listener'));
    clone.click();
    testing.expectEqual('attr3,clone listener', window.order.join());

    // So does innerHTML.
    window.order = [];
    const holder = document.createElement('div');
    holder.innerHTML = `<span onclick="window.order.push('inner')"></span>`;
    holder.firstChild.click();
    testing.expectEqual('inner', window.order.join());
}
</script>

<script id="handler_content_attribute_invalid">
{
    // An attribute that doesn't compile reports a SyntaxError and leaves the
    // handler null.
    let reported = null;
    const onError = (e) => { reported = e.error; e.preventDefault(); };
    window.addEventListener('error', onError);
    const div = $('#bad-attr');
    testing.expectEqual(null, div.onclick);
    window.removeEventListener('error', onError);
    testing.expectEqual(true, reported instanceof SyntaxError);

    let fired = false;
    div.addEventListener('click', () => fired = true);
    div.click();
    testing.expectEqual(true, fired);
}
</script>

<script id="handler_body_reflects_window">
{
    const r = [];
    document.body.onresize = () => r.push('body');
    testing.expectEqual(true, window.onresize === document.body.onresize);
    window.dispatchEvent(new Event('resize'));
    testing.expectEqual('body', r.join());

    document.body.setAttribute('onresize', "window.resized_by_attr = true");
    testing.expectEqual('function', typeof window.onresize);
    window.dispatchEvent(new Event('resize'));
    testing.expectEqual(true, window.resized_by_attr);
    // ...and not as a handler on the body element itself.
    testing.expectEqual('body', r.join());

    document.body.removeAttribute('onresize');
    testing.expectEqual(null, window.onresize);
}
</script>

<script id="handler_non_node_targets">
{
    const r = [];
    const xhr = new XMLHttpRequest();
    xhr.addEventListener('load', () => r.push(1));
    xhr.onload = () => r.push(2);
    xhr.addEventListener('load', () => r.push(3));
    xhr.dispatchEvent(new Event('load'));
    testing.expectEqual('1,2,3', r.join());
    xhr.onload = null;
    testing.expectEqual(null, xhr.onload);

    r.length = 0;
    const ac = new AbortController();
    ac.signal.addEventListener('abort', () => r.push(1));
    ac.signal.onabort = () => r.push(2);
    ac.abort();
    testing.expectEqual('1,2', r.join());
}
</script>

<script id="mouseenter_mouseleave">
{
    const div = $('#attr-mouseenter');
    testing.expectEqual('function', typeof div.onmouseenter);
    div.dispatchEvent(new MouseEvent('mouseenter'));
    testing.expectEqual('mouseenter', div.dataset.seen);

    let left = 0;
    div.onmouseleave = () => left++;
    div.dispatchEvent(new MouseEvent('mouseleave'));
    testing.expectEqual(1, left);

    testing.expectEqual(true, 'onmouseenter' in window);
    testing.expectEqual(true, 'onmouseleave' in document);
}
</script>

<script>

  // We should get this fired at capturing phase when a resource loaded.
  const documentElementLoad = new Promise((resolve) => {
    document.documentElement.addEventListener("load", e => resolve(e.eventPhase), { capture: true, once: true });
  });
</script>
