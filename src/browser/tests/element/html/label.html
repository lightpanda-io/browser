<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="../../testing.js"></script>

<label id="l1" for="input1">Name</label>
<input id="input1">

<script id="htmlFor">
  {
    const l1 = document.getElementById('l1');
    testing.expectEqual('input1', l1.htmlFor);

    l1.htmlFor = 'input2';
    testing.expectEqual('input2', l1.htmlFor);

    const l2 = document.createElement('label');
    testing.expectEqual('', l2.htmlFor);
  }
</script>

<label id="l2" for="input1"><span>Name</span></label>
<input id="input2" type="text">
<input id="input-hidden" type="hidden">
<select id="sel1"><option>a</option></select>
<button id="btn1">Click</button>
<label id="l3"><input id="input3"><span>desc</span></label>
<label id="l4"><span>no control here</span></label>
<label id="l5"><label id="l5-inner"><input id="input5"></label></label>

<script id="control">
  {
    // for attribute pointing to a text input
    const l2 = document.getElementById('l2');
    testing.expectEqual('input1', l2.control.id);

    // for attribute pointing to a non-existent id
    const lMissing = document.createElement('label');
    lMissing.htmlFor = 'does-not-exist';
    testing.expectEqual(null, lMissing.control);

    // for attribute pointing to a hidden input -> not labelable, returns null
    const lHidden = document.createElement('label');
    lHidden.htmlFor = 'input-hidden';
    document.body.appendChild(lHidden);
    testing.expectEqual(null, lHidden.control);

    // for attribute pointing to a select
    const lSel = document.createElement('label');
    lSel.htmlFor = 'sel1';
    document.body.appendChild(lSel);
    testing.expectEqual('sel1', lSel.control.id);

    // for attribute pointing to a button
    const lBtn = document.createElement('label');
    lBtn.htmlFor = 'btn1';
    document.body.appendChild(lBtn);
    testing.expectEqual('btn1', lBtn.control.id);

    // no for attribute: first labelable descendant
    const l3 = document.getElementById('l3');
    testing.expectEqual('input3', l3.control.id);

    // no for attribute: no labelable descendant -> null
    const l4 = document.getElementById('l4');
    testing.expectEqual(null, l4.control);

    // no for attribute: nested labels, first labelable in tree order
    const l5 = document.getElementById('l5');
    testing.expectEqual('input5', l5.control.id);

    // label with no for and not in document -> null
    const lDetached = document.createElement('label');
    testing.expectEqual(null, lDetached.control);
  }
</script>

<div id="labels-fixture">
  <label id="lb-before" for="lb-both-input">Before</label>
  <label id="lb-both" for="lb-both-input">Both <input id="lb-both-input"></label>
  <label id="lb-other" for="lb-outside">Other <input id="lb-wrapped-elsewhere"></label>
  <input id="lb-outside">
  <label id="lb-two">Two <input id="lb-first"><input id="lb-second"></label>
  <label id="lb-after" for="lb-both-input">After</label>
</div>

<script id="labels">
  {
    function ids(el) {
      return Array.from(el.labels, (l) => l.id);
    }

    // #4030: wrapping + matching for = one entry, all in tree order
    testing.expectEqual(['lb-before', 'lb-both', 'lb-after'], ids(document.getElementById('lb-both-input')));

    // a wrapping label whose for points elsewhere doesn't label the wrapped input
    testing.expectEqual([], ids(document.getElementById('lb-wrapped-elsewhere')));
    testing.expectEqual(['lb-other'], ids(document.getElementById('lb-outside')));

    // a label without for labels only its first labelable descendant
    testing.expectEqual(['lb-two'], ids(document.getElementById('lb-first')));
    testing.expectEqual([], ids(document.getElementById('lb-second')));

    // detached tree (as Chrome): no labels at all; control resolves only
    // through wrapping, not for
    const div = document.createElement('div');
    div.innerHTML = '<label id="d-for" for="d-input">A</label><input id="d-input"><label id="d-wrap"><input id="d-wrapped"></label><label id="d-both" for="d-inner"><input id="d-inner"></label>';
    testing.expectEqual([], ids(div.querySelector('#d-input')));
    testing.expectEqual([], ids(div.querySelector('#d-wrapped')));
    testing.expectEqual([], ids(div.querySelector('#d-inner')));
    testing.expectEqual(null, div.querySelector('#d-for').control);
    testing.expectEqual('d-wrapped', div.querySelector('#d-wrap').control.id);
    testing.expectEqual(null, div.querySelector('#d-both').control);

    // once attached, all resolve
    document.body.appendChild(div);
    testing.expectEqual(['d-for'], ids(div.querySelector('#d-input')));
    testing.expectEqual(['d-wrap'], ids(div.querySelector('#d-wrapped')));
    testing.expectEqual(['d-both'], ids(div.querySelector('#d-inner')));
    div.remove();

    // shadow trees count as attached, even under a detached host
    const host = document.createElement('div');
    document.body.appendChild(host);
    const sr = host.attachShadow({ mode: 'open' });
    sr.innerHTML = '<label id="s-for" for="s-in">A</label><input id="s-in"><label id="s-wrap"><input id="s-w"></label>';
    testing.expectEqual(['s-for'], ids(sr.querySelector('#s-in')));
    testing.expectEqual(['s-wrap'], ids(sr.querySelector('#s-w')));
    host.remove();
    testing.expectEqual(['s-for'], ids(sr.querySelector('#s-in')));
    testing.expectEqual('s-in', sr.querySelector('#s-for').control.id);
    testing.expectEqual(['s-wrap'], ids(sr.querySelector('#s-w')));

    // nested labels without for: both label the input, outermost first
    const nested = document.createElement('div');
    nested.innerHTML = '<label id="n-outer">A <label id="n-inner">B <input></label></label>';
    document.body.appendChild(nested);
    testing.expectEqual(['n-outer', 'n-inner'], ids(nested.querySelector('input')));
    nested.remove();

    // a duplicate id that isn't first in the tree gets no for labels, only its wrapper
    const dup = document.createElement('div');
    dup.innerHTML = '<input id="dup"><label id="dup-for" for="dup">A</label><label id="dup-wrap"><input id="dup"></label>';
    document.body.appendChild(dup);
    const dupInputs = dup.querySelectorAll('input');
    testing.expectEqual(['dup-for'], ids(dupInputs[0]));
    testing.expectEqual(['dup-wrap'], ids(dupInputs[1]));
    dup.remove();

    // a document label with a matching for doesn't label a detached control
    const detached = document.createElement('input');
    detached.id = 'lb-both-input';
    testing.expectEqual([], ids(detached));
  }
</script>
