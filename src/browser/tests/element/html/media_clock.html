<!DOCTYPE html>
<meta name=lp-mode content=test>
<script src="../../testing.js"></script>

<script>
  // A silent 8-bit mono PCM file of `seconds`, as a data: URL.
  function wav(seconds) {
    const rate = 8000;
    const frames = Math.round(rate * seconds);
    const bytes = new Uint8Array(44 + frames).fill(128);
    const view = new DataView(bytes.buffer);
    const ascii = (at, text) => {
      for (let i = 0; i < text.length; i++) bytes[at + i] = text.charCodeAt(i);
    };
    ascii(0, 'RIFF');
    view.setUint32(4, 36 + frames, true);
    ascii(8, 'WAVEfmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, 1, true); // channels
    view.setUint32(24, rate, true);
    view.setUint32(28, rate, true); // bytes per second
    view.setUint16(32, 1, true); // block align
    view.setUint16(34, 8, true); // bits per sample
    ascii(36, 'data');
    view.setUint32(40, frames, true);
    let binary = '';
    for (const byte of bytes) binary += String.fromCharCode(byte);
    return 'data:audio/wav;base64,' + btoa(binary);
  }

  function record(media, names) {
    const events = [];
    for (const name of names) {
      media.addEventListener(name, () => events.push(name));
    }
    return events;
  }

  const once = (media, name) => new Promise((resolve) => {
    media.addEventListener(name, resolve, {once: true});
  });

  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
</script>

<script id="metadata" type=module>
  const state = await testing.async();
  const audio = new Audio();
  const events = record(audio, ['loadstart', 'durationchange', 'loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough']);
  audio.src = wav(0.5);
  const before = audio.duration;
  await once(audio, 'canplaythrough');

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, isNaN(before));
    testing.expectEqual('loadstart,durationchange,loadedmetadata,loadeddata,canplay,canplaythrough', events.join(','));
    testing.expectEqual(0.5, audio.duration);
    testing.expectEqual(4, audio.readyState);
    testing.expectEqual(1, audio.networkState);
    testing.expectEqual(0, audio.currentTime);
    testing.expectEqual(true, audio.paused);
    testing.expectEqual(false, audio.ended);
  });
</script>

<script id="source_child" type=module>
  const state = await testing.async();
  const video = document.createElement('video');
  const unknown = document.createElement('source');
  unknown.src = 'data:video/mp4;base64,AAAA';
  const source = document.createElement('source');
  source.src = wav(0.25);
  video.append(unknown, source);
  await once(video, 'loadedmetadata');

  state.resolve();
  await state.done(() => {
    testing.expectEqual(0.25, video.duration);
  });
</script>

<script id="playback" type=module>
  const state = await testing.async();
  const audio = new Audio(wav(10));
  // so that the clock starts with play()
  await once(audio, 'loadedmetadata');
  await audio.play();
  await sleep(20);
  const midway = audio.currentTime;
  const ended_midway = audio.ended;
  audio.pause();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, midway < 10);
    // Chrome's clock starts with the audio output, which takes a while
    if (testing.IS_TEST_RUNNER) {
      testing.expectEqual(true, midway > 0);
    }
    testing.expectEqual(false, ended_midway);
  });
</script>

<script id="play_to_end" type=module>
  // From 0.1s before the end, so that it doesn't take long.
  const state = await testing.async();
  const audio = new Audio(wav(10));
  await once(audio, 'loadedmetadata');
  audio.currentTime = 9.9;
  await once(audio, 'seeked');

  const events = record(audio, ['timeupdate', 'pause', 'ended']);
  let last = audio.currentTime;
  let backwards = false;
  audio.addEventListener('timeupdate', () => {
    backwards ||= audio.currentTime < last;
    last = audio.currentTime;
  });
  await audio.play();
  await once(audio, 'ended');

  state.resolve();
  await state.done(() => {
    testing.expectEqual(false, backwards);
    testing.expectEqual('timeupdate,pause,ended', events.slice(-3).join(','));
    testing.expectEqual(10, audio.currentTime);
    testing.expectEqual(true, audio.ended);
    testing.expectEqual(true, audio.paused);
  });
</script>

<script id="pause_holds_position" type=module>
  const state = await testing.async();
  const audio = new Audio(wav(5));
  await once(audio, 'loadedmetadata');
  await audio.play();
  await sleep(20);
  audio.pause();
  const paused_at = audio.currentTime;
  await sleep(20);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, paused_at < 5);
    if (testing.IS_TEST_RUNNER) {
      testing.expectEqual(true, paused_at > 0);
    }
    testing.expectEqual(paused_at, audio.currentTime);
  });
</script>

<script id="seek" type=module>
  const state = await testing.async();
  const audio = new Audio(wav(2));
  await once(audio, 'loadedmetadata');

  const events = record(audio, ['seeking', 'timeupdate', 'seeked']);
  audio.currentTime = 1.5;
  const seeking = audio.seeking;
  const position = audio.currentTime;
  await once(audio, 'seeked');
  const seeking_after = audio.seeking;

  // past the end
  audio.currentTime = 10;
  await once(audio, 'seeked');

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, seeking);
    testing.expectEqual(1.5, position);
    testing.expectEqual('seeking,timeupdate,seeked', events.slice(0, 3).join(','));
    testing.expectEqual(false, seeking_after);
    testing.expectEqual(2, audio.currentTime);
    testing.expectEqual(true, audio.ended);
    testing.expectEqual(true, audio.paused);
  });
</script>

<script id="play_after_ended" type=module>
  const state = await testing.async();
  const audio = new Audio(wav(5));
  await once(audio, 'loadedmetadata');
  audio.currentTime = 5;
  await once(audio, 'seeked');
  const ended = audio.ended;

  // back to the start
  const restarted = once(audio, 'seeked');
  await audio.play();
  await restarted;
  const position = audio.currentTime;
  const ended_playing = audio.ended;
  audio.pause();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, ended);
    testing.expectEqual(true, position < 1);
    testing.expectEqual(false, ended_playing);
  });
</script>

<script id="playback_rate" type=module>
  const state = await testing.async();
  const audio = new Audio(wav(10));
  await once(audio, 'loadedmetadata');
  audio.playbackRate = 10;
  await audio.play();
  await sleep(20);
  const position = audio.currentTime;
  audio.pause();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, position < 10);
    // At least 20ms, at 10x. Chrome's clock starts with the audio output,
    // which takes a while.
    if (testing.IS_TEST_RUNNER) {
      testing.expectEqual(true, position >= 0.19);
    }
  });
</script>

<script id="loop" type=module>
  const state = await testing.async();
  const audio = new Audio(wav(10));
  audio.loop = true;
  await once(audio, 'loadedmetadata');
  audio.currentTime = 9.95;
  await once(audio, 'seeked');
  const events = record(audio, ['ended']);
  // wraps around
  const wrapped = once(audio, 'seeked');
  await audio.play();
  await wrapped;
  const paused = audio.paused;
  const ended = audio.ended;
  const position = audio.currentTime;
  audio.pause();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(false, paused);
    testing.expectEqual(false, ended);
    testing.expectEqual(true, position < 9);
    testing.expectEqual('', events.join(','));
  });
</script>

<script id="load_and_src_change" type=module>
  const state = await testing.async();
  const audio = new Audio(wav(1));
  await once(audio, 'loadedmetadata');

  audio.currentTime = 0.5;
  audio.load();
  const reloading = [audio.duration, audio.currentTime, audio.readyState, audio.seeking];
  await once(audio, 'loadedmetadata');
  const reloaded = audio.duration;

  audio.src = wav(2);
  const changing = audio.duration;
  await once(audio, 'loadedmetadata');
  const changed = audio.duration;

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, isNaN(reloading[0]));
    testing.expectEqual(0, reloading[1]);
    testing.expectEqual(0, reloading[2]);
    testing.expectEqual(false, reloading[3]);
    testing.expectEqual(1, reloaded);
    testing.expectEqual(true, isNaN(changing));
    testing.expectEqual(2, changed);
  });
</script>

<script id="non_finite" type=module>
  const state = await testing.async();
  const audio = new Audio(wav(2));
  await once(audio, 'loadedmetadata');
  audio.currentTime = 1;

  state.resolve();
  await state.done(() => {
    testing.expectError('TypeError', () => { audio.currentTime = NaN; });
    testing.expectError('TypeError', () => { audio.currentTime = undefined; });
    testing.expectError('TypeError', () => { audio.currentTime = Infinity; });
    testing.expectError('TypeError', () => { audio.playbackRate = NaN; });
    testing.expectEqual(1, audio.currentTime);
    testing.expectEqual(false, audio.ended);
    testing.expectEqual(1, audio.playbackRate);
  });
</script>

<script id="removed_from_document" type=module>
  const state = await testing.async();
  const audio = new Audio(wav(5));
  document.body.append(audio);
  await once(audio, 'loadedmetadata');
  const moved = record(audio, ['pause']);
  await audio.play();

  // still in a document once the task runs
  const div = document.body.appendChild(document.createElement('div'));
  div.append(audio);
  await sleep(10);
  const paused_moved = audio.paused;

  const paused = once(audio, 'pause');
  div.remove();
  await paused;
  const position = audio.currentTime;
  await sleep(20);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(false, paused_moved);
    testing.expectEqual('pause', moved.join(','));
    testing.expectEqual(true, audio.paused);
    testing.expectEqual(position, audio.currentTime);
  });
</script>

<script id="frame_removed" type=module>
  // The element outlives its frame, and its clock doesn't.
  const state = await testing.async();
  const iframe = document.body.appendChild(document.createElement('iframe'));
  const audio = new iframe.contentWindow.Audio(wav(5));
  await once(audio, 'loadedmetadata');
  await audio.play();
  await sleep(20);
  iframe.remove();

  const stopped_at = audio.currentTime;
  await sleep(20);
  const later = audio.currentTime;
  audio.currentTime = 1;
  await sleep(20);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(stopped_at, later);
    testing.diverges('Chrome also pauses the element and takes it back to 0', () => {
      testing.expectEqual(true, stopped_at > 0);
    });
    testing.expectEqual(1, audio.currentTime);
    testing.expectEqual(false, audio.seeking);
  });
</script>

<script id="unreadable_source" type=module>
  const state = await testing.async();
  const audio = new Audio('data:audio/wav;base64,AAAA');
  let resolved = false;
  await audio.play().then(() => { resolved = true; }, () => {});
  await sleep(10);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, isNaN(audio.duration));
    testing.expectEqual(0, audio.currentTime);
    testing.expectEqual(false, audio.ended);
    // Chrome fires error and rejects play()
    testing.diverges('Lightpanda fakes playback of a source it cannot read', () => {
      testing.expectEqual(true, resolved);
    });
  });
</script>

<script id="unreadable_source_state" type=module>
  // A source that isn't read changes nothing: no selection, no reset.
  const state = await testing.async();
  const video = document.createElement('video');
  testing.beginBrowserLog('missing media files');
  video.src = 'movie.mp4';
  const source_set = video.networkState;
  await video.play().catch(() => {});
  video.src = 'other.mp4';
  await sleep(10);
  testing.endBrowserLog();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, isNaN(video.duration));
    testing.diverges('Lightpanda does not run resource selection for a source it cannot read', () => {
      testing.expectEqual(0, source_set);
      testing.expectEqual(false, video.paused);
      testing.expectEqual(4, video.readyState);
      testing.expectEqual(1, video.networkState);
    });
  });
</script>
