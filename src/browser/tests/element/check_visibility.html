<script id="inline_visibility_hidden">
  {
    const el = document.createElement("div");
    document.body.appendChild(el);

    el.style.visibility = "hidden";
    // Without visibilityProperty option, visibility:hidden is not checked
    testing.expectEqual(true, el.checkVisibility());
    // With visibilityProperty: true, visibility:hidden is detected
    testing.expectEqual(false, el.checkVisibility({ visibilityProperty: true }));

    el.style.visibility = "collapse";
    testing.expectEqual(false, el.checkVisibility({ visibilityProperty: true }));

    el.style.visibility = "visible";
    testing.expectEqual(true, el.checkVisibility({ visibilityProperty: true }));

    el.remove();
  }

<script id="inline_opacity_zero">
  {
    const el = document.createElement("div");
    document.body.appendChild(el);

    el.style.opacity = "0";
    // Without checkOpacity option, opacity:0 is not checked
    testing.expectEqual(true, el.checkVisibility());
    // With checkOpacity: true, opacity:0 is detected
    testing.expectEqual(false, el.checkVisibility({ checkOpacity: true }));

    el.style.opacity = "0.5";
    testing.expectEqual(true, el.checkVisibility({ checkOpacity: true }));

    el.style.opacity = "1";
    testing.expectEqual(true, el.checkVisibility({ checkOpacity: true }));

<script id="parent_hidden_hides_child">
  {
    const parent = document.createElement("div");
    const child = document.createElement("span");
    parent.appendChild(child);
    document.body.appendChild(parent);

    testing.expectEqual(true, child.checkVisibility());

    // display:none on parent hides children (no option needed)
    parent.style.display = "none";
    testing.expectEqual(false, child.checkVisibility());

    // visibility:hidden on parent - needs visibilityProperty option
    parent.style.display = "block";
    parent.style.visibility = "hidden";
    testing.expectEqual(true, child.checkVisibility()); // without option
    testing.expectEqual(false, child.checkVisibility({ visibilityProperty: true }));

    // opacity:0 on parent - needs checkOpacity option
    parent.style.visibility = "visible";
    parent.style.opacity = "0";
    testing.expectEqual(true, child.checkVisibility()); // without option
    testing.expectEqual(false, child.checkVisibility({ checkOpacity: true }));

    parent.remove();
  }
</script>

<script id="ua_unrendered_tags_are_display_none">
  {
    // Per HTML Rendering §15.3.1 "Hidden elements", these tags get
    // display:none from the UA stylesheet.
    // (basefont/noembed/noframes/rp are obsolete and not represented in
    // Lightpanda's Element.Tag enum.)
    const tags = [
      'area', 'base', 'datalist', 'link', 'meta', 'param',
      'script', 'style', 'template', 'title',
    ];
    for (const t of tags) {
      const el = document.createElement(t);
      document.body.appendChild(el);
      testing.expectEqual('none', window.getComputedStyle(el).display);
      testing.expectEqual(false, el.checkVisibility());
      el.remove();
    }

    // <noscript> isn't rendered while scripting is on, but Chrome does that
    // without the UA stylesheet, so its computed display stays inline.
    const noscript = document.createElement('noscript');
    document.body.appendChild(noscript);
    testing.expectEqual(false, noscript.checkVisibility());
    testing.diverges('Chrome: noscript computes display:inline', () => {
      testing.expectEqual('none', window.getComputedStyle(noscript).display);
    });
    noscript.remove();

    // The spec doesn't hide source/track (WPT hidden-elements.html).
    for (const t of ['source', 'track']) {
      const el = document.createElement(t);
      document.body.appendChild(el);
      testing.expectEqual('inline', window.getComputedStyle(el).display);
      testing.expectEqual(true, el.checkVisibility());
      el.remove();
    }

    // <head> itself
    testing.expectEqual('none', window.getComputedStyle(document.head).display);
    testing.expectEqual(false, document.head.checkVisibility());
  }
</script>

<script id="ua_closed_details_hides_non_summary_children">
  {
    // details:not([open]) > *:not(summary) { display: none }
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = 'header';
    const child = document.createElement('p');
    child.textContent = 'body';
    details.appendChild(summary);
    details.appendChild(child);
    document.body.appendChild(details);

    // Closed: <summary> visible, body child hidden
    testing.expectEqual(true, summary.checkVisibility());
    testing.expectEqual(false, child.checkVisibility());
    testing.diverges('Chrome hides closed details content via ::details-content, child keeps display:block', () => {
      testing.expectEqual('none', window.getComputedStyle(child).display);
    });

    // Open: child visible
    details.setAttribute('open', '');
    testing.expectEqual(true, child.checkVisibility());

    // Closed again
    details.removeAttribute('open');
    testing.expectEqual(false, child.checkVisibility());

    // Descendants of a closed-details child are hidden via the ancestor walk.
    const grandchild = document.createElement('span');
    child.appendChild(grandchild);
    testing.expectEqual(false, grandchild.checkVisibility());

    details.remove();
  }
</script>

<script id="ua_closed_popover_is_hidden">
  {
    // [popover]:not(:popover-open):not(dialog[open]) { display: none }
    const pop = document.createElement('div');
    pop.setAttribute('popover', '');
    const child = document.createElement('p');
    pop.appendChild(child);
    document.body.appendChild(pop);

    testing.expectEqual(false, pop.checkVisibility());
    testing.expectEqual(false, child.checkVisibility());
    testing.expectEqual('none', window.getComputedStyle(pop).display);

    pop.showPopover();
    testing.expectEqual(true, pop.checkVisibility());
    testing.expectEqual(true, child.checkVisibility());

    pop.hidePopover();
    testing.expectEqual(false, pop.checkVisibility());

    // Any popover value counts, and an author `display` still wins over the
    // UA rule, as for every other UA display:none fallback.
    pop.setAttribute('popover', 'manual');
    testing.expectEqual(false, pop.checkVisibility());
    pop.style.display = 'block';
    testing.expectEqual(true, pop.checkVisibility());

    // A modal/non-modal <dialog> that is also a popover is shown by [open].
    const dialog = document.createElement('dialog');
    dialog.setAttribute('popover', '');
    document.body.appendChild(dialog);
    testing.expectEqual(false, dialog.checkVisibility());
    dialog.show();
    testing.expectEqual(true, dialog.checkVisibility());

    dialog.close();
    testing.expectEqual(false, dialog.checkVisibility());
    // dialog:popover-open { display: block } overrides dialog:not([open]).
    dialog.showPopover();
    testing.expectEqual(true, dialog.checkVisibility());
    dialog.hidePopover();
    testing.expectEqual(false, dialog.checkVisibility());

    dialog.remove();
    pop.remove();
  }
</script>

<script id="author_class_display_overrides_hidden_attr">
  {
    // Regression: author `.x { display: flex }` must beat UA `[hidden] {
    // display: none }` per CSS Cascade §6.1 — any normal-origin author rule
    // wins over UA origin regardless of specificity. Before the fix, the UA
    // short-circuit in `isElementHidden` fired before the author rule walk,
    // so `[hidden]` always won regardless of the class rule.
    const el = document.createElement("div");
    el.className = "cv-author-flex";
    el.setAttribute("hidden", "");
    document.body.appendChild(el);

    testing.expectEqual(true, el.checkVisibility());
    // Invariant from `StyleManager.zig:329-331`: checkVisibility() and
    // `getComputedStyle().display === "none"` must agree.
    testing.expectEqual(true, window.getComputedStyle(el).display !== "none");

    el.remove();
  }
</script>

<script id="author_wildcard_overrides_hidden_attr">
  {
    // `*` lives in the `other_rules` bucket. Per CSS Cascade §6.1, any author
    // rule for `display` — even a wildcard — beats UA origin regardless of
    // specificity. The style is added dynamically and removed at teardown so
    // the wildcard doesn't leak onto adjacent tests in the file.
    const style = document.createElement("style");
    style.textContent = "* { display: block; }";
    document.head.appendChild(style);

    const el = document.createElement("div");
    el.setAttribute("hidden", "");
    document.body.appendChild(el);

    testing.expectEqual(true, el.checkVisibility());
    testing.expectEqual(true, window.getComputedStyle(el).display !== "none");

    el.remove();
    style.remove();
  }
</script>

<script id="deep_nesting">
  {
    const levels = 5;
    let current = document.body;
    const elements = [];

    for (let i = 0; i < levels; i++) {
      const el = document.createElement("div");
      current.appendChild(el);
      elements.push(el);
      current = el;
    }

    // All should be visible
    for (let i = 0; i < levels; i++) {
      testing.expectEqual(true, elements[i].checkVisibility());
    }

    // Hide middle element
    elements[2].style.display = "none";

    // Elements 0, 1 should still be visible
    testing.expectEqual(true, elements[0].checkVisibility());
    testing.expectEqual(true, elements[1].checkVisibility());

    // Elements 2, 3, 4 should be hidden
    testing.expectEqual(false, elements[2].checkVisibility());
    testing.expectEqual(false, elements[3].checkVisibility());
    testing.expectEqual(false, elements[4].checkVisibility());

    elements[0].remove();
  }
</script>

<script id="memo_attribute_mutations">
  {
    const el = document.createElement("div");
    document.body.appendChild(el);
    const check = (visible) => {
      testing.expectEqual(visible, el.checkVisibility());
      testing.expectEqual(visible ? "block" : "none", getComputedStyle(el).display);
      testing.expectEqual(visible, el.offsetWidth > 0);
    };

    check(true);
    el.hidden = true;
    check(false);
    el.hidden = false;
    check(true);

    el.classList.add("memo-hide");
    check(false);
    el.classList.remove("memo-hide");
    check(true);

    el.style.display = "none";
    check(false);
    el.style.display = "";
    check(true);

    el.setAttribute("style", "display: none");
    check(false);
    el.style.cssText = "color: red";
    check(true);

    el.remove();
  }
</script>

<script id="memo_form_state">
  {
    const tabs = document.createElement("div");
    tabs.className = "memo-tabs";
    tabs.innerHTML = '<input type="checkbox"><span>panel</span>';
    document.body.appendChild(tabs);
    const input = tabs.firstChild;
    const panel = tabs.lastChild;

    testing.expectEqual(true, panel.checkVisibility());
    input.checked = true;
    testing.expectEqual(false, panel.checkVisibility());
    input.click();
    testing.expectEqual(true, panel.checkVisibility());
    input.indeterminate = true;
    testing.expectEqual(false, panel.checkVisibility());
    input.indeterminate = false;
    testing.expectEqual(true, panel.checkVisibility());

    const form = document.createElement("div");
    form.className = "memo-form";
    form.innerHTML = '<input required><span>a</span><select required><option value="">-</option><option value="x">x</option></select><span>b</span>';
    document.body.appendChild(form);
    const [text, a, select, b] = form.childNodes;

    testing.expectEqual(false, a.checkVisibility());
    text.value = "filled";
    testing.expectEqual(true, a.checkVisibility());
    text.value = "";
    testing.expectEqual(false, a.checkVisibility());

    testing.expectEqual(false, b.checkVisibility());
    select.value = "x";
    testing.expectEqual(true, b.checkVisibility());
    select.selectedIndex = 0;
    testing.expectEqual(false, b.checkVisibility());

    tabs.remove();
    form.remove();
  }
</script>

<script id="memo_reparent">

    hidden.style.display = "none";
    const shown = document.createElement("div");

    document.body.appendChild(hidden);

    testing.expectEqual(false, child.checkVisibility());
    shown.appendChild(child);

<script id="memo_tree_entry_points">
  {
    // Every way into or out of the tree reaches both the live collections
    // and the cascade memo (:empty).
    const parent = document.createElement("div");
    parent.className = "memo-badge";
    document.body.appendChild(parent);
    const children = parent.childNodes;
    const items = parent.getElementsByTagName("i");
    const check = (count) => {
      testing.expectEqual(count, children.length);
      testing.expectEqual(count, items.length);
      testing.expectEqual(count > 0, parent.checkVisibility());
    };
    const i = () => document.createElement("i");
    check(0);

    const child = parent.appendChild(i());
    check(1);
    parent.removeChild(child);
    check(0);

    parent.insertBefore(i(), null);
    check(1);
    parent.insertBefore(i(), parent.firstChild);
    check(2);
    parent.replaceChild(i(), parent.firstChild);
    check(2);
    parent.firstChild.replaceWith();
    check(1);
    parent.firstChild.replaceWith(i(), i());
    check(2);
    parent.replaceChildren();
    check(0);

    // moveBefore: the node moves in from a sibling, keeping its state
    const other = document.body.appendChild(document.createElement("div"));
    const moved = other.appendChild(i());
    parent.moveBefore(moved, null);
    check(1);
    other.moveBefore(moved, null);
    check(0);
    other.remove();

    parent.innerHTML = "<i></i>";
    check(1);
    parent.innerHTML = "";
    check(0);

    parent.insertAdjacentHTML("beforeend", "<i></i><i></i>");
    check(2);
    parent.firstChild.outerHTML = "";
    check(1);
    parent.replaceChildren();
    check(0);
    parent.replaceChildren(i());
    check(1);

    const range = document.createRange();
    range.selectNodeContents(parent);
    range.deleteContents();
    check(0);
    parent.append(i());
    check(1);
    range.selectNodeContents(parent);
    range.extractContents();
    check(0);

    parent.append(i());
    check(1);
    document.adoptNode(parent.firstChild);
    check(0);

    // an empty text node doesn't count for :empty, but it is a child
    parent.appendChild(document.createTextNode(""));

<script id="insert_rule_fast_path_matches_rebuild">
  {
    const el = document.createElement("div");
    document.body.appendChild(el);
    const first = document.createElement("style");
    document.head.appendChild(first);
    const last = document.createElement("style");
    document.head.appendChild(last);

    // Appends to the last sheet
    el.className = "ins-a";
    last.sheet.insertRule(".ins-a { display: none }", last.sheet.cssRules.length);
    testing.expectEqual(false, el.checkVisibility());
    last.sheet.insertRule(".ins-a { display: block }", last.sheet.cssRules.length);
    testing.expectEqual(true, el.checkVisibility());
    last.sheet.insertRule("div.ins-a { display: none }", last.sheet.cssRules.length);
    testing.expectEqual(false, el.checkVisibility());

    // An append to an earlier sheet and an insert at index 0 rebuild, and
    // still lose to the later rule at equal specificity
    first.sheet.insertRule("div.ins-a { display: block }", first.sheet.cssRules.length);
    testing.expectEqual(false, el.checkVisibility());
    last.sheet.insertRule("div.ins-a { display: inline }", 0);
    testing.expectEqual(false, el.checkVisibility());

    // An unlayered append outranks a layered rule from an earlier sheet
    el.className = "layered-hide";
    testing.expectEqual(false, el.checkVisibility());
    last.sheet.insertRule(".layered-hide { display: block }", last.sheet.cssRules.length);
    testing.expectEqual(true, el.checkVisibility());

    // Deleting rebuilds
    last.sheet.deleteRule(last.sheet.cssRules.length - 1);
    testing.expectEqual(false, el.checkVisibility());

    first.remove();
    last.remove();
    el.remove();
  }
</script>

<script id="memo_tree_scoped">
  {
    // An insertion or removal only drops the cascade around its parent. Each
    // case reads (filling the memo), mutates, reads again. The sheet goes
    // at the end: what selectors it holds decides how much a change drops.
    const sheet = document.createElement("style");
    sheet.textContent = `
      .s-a + .s-b { display: none }
      .s-list > i:first-child { display: none }
      .s-e:empty + .s-f { display: none }
      .s-hide { visibility: hidden }
      .s-h:has(.s-k) { display: none }
      .s-form:invalid { display: none }
      .s-submit:default { display: none }
      .s-fw:focus-within + .s-mark { display: none }
    `;
    document.head.appendChild(sheet);
    const make = (html) => {
      const div = document.createElement("div");
      div.innerHTML = html;
      document.body.appendChild(div);
      return div;
    };
    const hidden = (el) => el.checkVisibility({ visibilityProperty: true }) === false;

    // + : a sibling inserted between, then removed
    {
      const root = make("<p class=s-a></p><p class=s-b></p>");
      const b = root.querySelector(".s-b");
      testing.expectEqual(true, hidden(b));
      const x = root.insertBefore(document.createElement("p"), b);
      testing.expectEqual(false, hidden(b));
      x.remove();
      testing.expectEqual(true, hidden(b));
      root.remove();
    }

    // :first-child moves to an inserted element
    {
      const root = make("<div class=s-list><i></i><i></i></div>");
      const list = root.firstChild;
      const first = list.firstChild;
      testing.expectEqual(true, hidden(first));
      const inserted = list.insertBefore(document.createElement("i"), first);
      testing.expectEqual(false, hidden(first));
      testing.expectEqual(true, hidden(inserted));
      inserted.remove();
      testing.expectEqual(true, hidden(first));
      root.remove();
    }

    // :empty flips on the parent, reaching its next sibling
    {
      const root = make("<p class=s-e></p><p class=s-f></p>");
      const e = root.firstChild;
      const f = root.lastChild;
      testing.expectEqual(true, hidden(f));
      const child = e.appendChild(document.createElement("b"));
      testing.expectEqual(false, hidden(f));
      child.remove();
      testing.expectEqual(true, hidden(f));
      e.appendChild(document.createComment("not content"));
      testing.expectEqual(true, hidden(f));
      root.remove();
    }

    // A moved element drops what it inherited
    {
      const root = make("<div class=s-hide><span></span></div><div></div>");
      const span = root.querySelector("span");
      testing.expectEqual(true, hidden(span));
      root.lastChild.appendChild(span);
      testing.expectEqual(false, hidden(span));
      root.firstChild.appendChild(span);
      testing.expectEqual(true, hidden(span));
      root.remove();
    }

    // An element read while detached, then inserted
    {
      const root = make("<div class=s-hide></div>");
      const detached = document.createElement("div");
      const span = detached.appendChild(document.createElement("span"));
      // Chrome says hidden (no box), we don't: only the read matters here
      hidden(span);
      root.firstChild.appendChild(detached);
      testing.expectEqual(true, hidden(span));
      root.appendChild(detached);
      testing.expectEqual(false, hidden(span));
      root.remove();
    }

    // :has() with a key: its subject moving in or out, deep below
    {
      const root = make("<div class=s-h><div><p></p></div></div>");
      const h = root.firstChild;
      const p = h.querySelector("p");
      testing.expectEqual(false, hidden(h));
      const k = p.appendChild(document.createElement("span"));
      testing.expectEqual(false, hidden(h));
      k.className = "s-k";
      testing.expectEqual(true, hidden(h));
      k.remove();
      testing.expectEqual(false, hidden(h));
      p.appendChild(k);
      testing.expectEqual(true, hidden(h));
      root.remove();
    }

    // A form's validity reads its controls
    {
      const root = make("<form class=s-form><div></div></form>");
      const form = root.firstChild;
      testing.expectEqual(false, hidden(form));
      const input = document.createElement("input");
      input.required = true;
      form.firstChild.appendChild(input);
      testing.expectEqual(true, hidden(form));
      input.remove();
      testing.expectEqual(false, hidden(form));
      root.remove();
    }

    // :default is the form's first submit button
    {
      const root = make("<form><div><button class=s-submit></button></div></form>");
      const button = root.querySelector("button");
      testing.expectEqual(true, hidden(button));
      const first = root.firstChild.insertBefore(document.createElement("button"), root.firstChild.firstChild);
      testing.expectEqual(false, hidden(button));
      first.remove();
      testing.expectEqual(true, hidden(button));
      root.remove();
    }

    // Moving the focused element keeps it focused (moveBefore), moving
    // :focus-within from its old ancestors to its new ones
    {
      // not a form control: the :invalid rule would drop everything anyway
      const root = make("<div class=s-fw><div><div><p tabindex=0></p></div></div></div><b class=s-mark></b><div></div>");
      const focused = root.querySelector("p");
      const mark = root.querySelector(".s-mark");
      testing.expectEqual(false, hidden(mark));
      focused.focus();
      testing.expectEqual(true, hidden(mark));
      root.lastChild.moveBefore(focused.parentNode, null);
      testing.expectEqual(focused, document.activeElement);
      testing.expectEqual(false, hidden(mark));
      root.remove();
    }

    sheet.remove();
  }
</script>

<script id="memo_detached_changes">
  {
    // Changes while detached don't drop the cascade: the element can't be
    // in it. Read before, changed while out, read after reinserting.
    const sheet = document.createElement("style");
    sheet.textContent = ".d-hide { visibility: hidden } .d-off > b { display: none }";
    document.head.appendChild(sheet);
    const hidden = (el) => el.checkVisibility({ visibilityProperty: true }) === false;
    const root = document.createElement("div");
    root.innerHTML = "<div class=d-hide><span></span><b></b></div><p></p>";
    document.body.appendChild(root);
    const box = root.firstChild;
    const span = box.firstChild;
    const b = box.lastChild;
    testing.expectEqual(true, hidden(span));
    testing.expectEqual(true, b.checkVisibility());

    box.remove();
    box.className = "d-off";
    span.textContent = "now visible";
    box.insertAdjacentHTML("beforeend", "<b></b>");
    root.insertBefore(box, root.firstChild);
    testing.expectEqual(false, hidden(span));
    testing.expectEqual(false, b.checkVisibility());
    testing.expectEqual(false, box.lastChild.checkVisibility());

    root.remove();
    sheet.remove();
  }
</script>

<script id="memo_class_reach">
  {
    // A class change drops what its selectors can reach: the element's
    // subtree, or its parent's for a sibling combinator, or everything.
    const sheet = document.createElement("style");
    sheet.textContent = `
      .cr-a { visibility: hidden }
      .cr-p .cr-x { display: none }
      .cr-s + .cr-t { display: none }
      :is(.cr-i ~ .cr-j) { display: none }
      .cr-list > :nth-child(1 of .cr-n) { display: none }
      .cr-h:has(.cr-k) { display: none }
      .zh:has(:is(.za .zb)) { display: none }
    `;
    document.head.appendChild(sheet);
    const hidden = (el) => el.checkVisibility({ visibilityProperty: true }) === false;
    const make = (html) => {
      const div = document.createElement("div");
      div.innerHTML = html;
      document.body.appendChild(div);
      return div;
    };

    // subject: the element and what inherits from it
    {
      const root = make("<div><span></span></div><p></p>");
      const div = root.firstChild;
      const span = div.firstChild;
      const p = root.lastChild;
      testing.expectEqual(false, hidden(span));
      testing.expectEqual(false, hidden(p));
      div.classList.add("cr-a");
      testing.expectEqual(true, hidden(span));
      testing.expectEqual(false, hidden(p));
      div.classList.remove("cr-a");
      testing.expectEqual(false, hidden(span));
      root.remove();
    }

    // ancestor compound: the descendants
    {
      const root = make("<div><section><i class=cr-x></i></section></div>");
      const i = root.querySelector("i");
      testing.expectEqual(true, i.checkVisibility());
      root.firstChild.className = "cr-p";
      testing.expectEqual(false, i.checkVisibility());
      root.firstChild.className = "";
      testing.expectEqual(true, i.checkVisibility());
      root.remove();
    }

    // sibling combinator: the later siblings, outside the element's subtree
    {
      const root = make("<p></p><p class=cr-t></p>");
      const t = root.lastChild;
      testing.expectEqual(true, t.checkVisibility());
      root.firstChild.classList.add("cr-s");
      testing.expectEqual(false, t.checkVisibility());
      root.firstChild.classList.remove("cr-s");
      testing.expectEqual(true, t.checkVisibility());
      // inside :is(), the same
      const j = root.appendChild(document.createElement("b"));
      j.className = "cr-j";
      testing.expectEqual(true, j.checkVisibility());
      root.firstChild.classList.add("cr-i");
      testing.expectEqual(false, j.checkVisibility());
      root.remove();
    }

    // :nth-child(of S): a sibling's class moves the index
    {
      const root = make("<div class=cr-list><i></i><i class=cr-n></i></div>");
      const second = root.firstChild.lastChild;
      testing.expectEqual(false, second.checkVisibility());
      root.firstChild.firstChild.classList.add("cr-n");
      testing.expectEqual(true, second.checkVisibility());
      root.remove();
    }

    // :has(): an ancestor, anywhere above
    {
      const root = make("<div class=cr-h><div><p></p></div></div>");
      const h = root.firstChild;
      testing.expectEqual(true, h.checkVisibility());
      h.querySelector("p").classList.add("cr-k");
      testing.expectEqual(false, h.checkVisibility());
      root.remove();
    }

    // :is() inside :has(): every compound of it reaches the anchor, inside
    // it or above it
    {
      const root = make("<div class=zh><section><p class=zb></p></section></div>");
      const h = root.firstChild;
      testing.expectEqual(true, h.checkVisibility());
      h.firstChild.classList.add("za");
      testing.expectEqual(false, h.checkVisibility());
      h.firstChild.classList.remove("za");
      testing.expectEqual(true, h.checkVisibility());
      root.classList.add("za");
      testing.expectEqual(false, h.checkVisibility());
      root.remove();
    }

    // a class no selector names changes nothing, but collections see it
    {
      const root = make("<p></p>");
      const live = root.getElementsByClassName("cr-unstyled");
      testing.expectEqual(0, live.length);
      root.firstChild.classList.add("cr-unstyled");
      testing.expectEqual(1, live.length);
      testing.expectEqual(true, root.firstChild.checkVisibility());
      root.remove();
    }

    sheet.remove();
  }
</script>

<script id="memo_tree_form_and_has_reach">
  {
    // A moved control or :has() subject reaches matches above its parent:
    // the forms and fieldsets around it, the anchors up to the argument's
    // depth, and what those reach (their later siblings).
    const sheet = document.createElement("style");
    sheet.textContent = `
      .fs:invalid + .fs-after { display: none }
      .lg:disabled { visibility: hidden }
      .r:invalid ~ .rm { display: none }
      .hd:has(> .hk) + .hm { display: none }
      .h2:has(> div > .hk2) + .h2m { display: none }
    `;
    document.head.appendChild(sheet);
    const hidden = (el) => el.checkVisibility({ visibilityProperty: true }) === false;
    const make = (html) => {
      const div = document.createElement("div");
      div.innerHTML = html;
      document.body.appendChild(div);
      return div;
    };

    // the outer fieldset's validity, read through its later sibling
    {
      const root = make("<fieldset class=fs><fieldset><div></div></fieldset></fieldset><p class=fs-after></p>");
      const after = root.lastChild;
      testing.expectEqual(true, after.checkVisibility());
      const input = document.createElement("input");
      input.required = true;
      root.querySelector("div").appendChild(input);
      testing.expectEqual(false, after.checkVisibility());
      input.remove();
      testing.expectEqual(true, after.checkVisibility());
      root.remove();
    }

    // a legend inserted ahead takes the first-legend exception away
    {
      const root = make("<fieldset disabled><legend><input class=lg></legend></fieldset>");
      const input = root.querySelector("input");
      testing.expectEqual(false, hidden(input));
      const fieldset = root.firstChild;
      fieldset.insertBefore(document.createElement("legend"), fieldset.firstChild);
      testing.expectEqual(true, hidden(input));
      root.remove();
    }

    // a radio group's validity reads every radio of the form owner
    {
      const root = make("<form><div><input type=radio name=g required class=r><b class=rm></b></div><section></section></form>");
      const mark = root.querySelector(".rm");
      testing.expectEqual(false, mark.checkVisibility());
      const other = document.createElement("input");
      other.type = "radio";
      other.name = "g";
      other.checked = true;
      root.querySelector("section").appendChild(other);
      testing.expectEqual(true, mark.checkVisibility());
      root.remove();
    }

    // without a form, the group is every radio of that name in the document
    {
      const a = make("<div><input type=radio name=g2 required class=r><b class=rm></b></div>");
      const b = make("<section></section>");
      const mark = a.querySelector(".rm");
      testing.expectEqual(false, mark.checkVisibility());
      const other = document.createElement("input");
      other.type = "radio";
      other.name = "g2";
      other.checked = true;
      b.firstChild.appendChild(other);
      testing.expectEqual(true, mark.checkVisibility());
      a.remove();
      b.remove();
    }

    // :has(> x): the parent anchors, and reaches its later sibling
    {
      const root = make("<div class=hd></div><p class=hm></p>");
      const mark = root.lastChild;
      testing.expectEqual(true, mark.checkVisibility());
      const k = document.createElement("i");
      k.className = "hk";
      root.firstChild.appendChild(k);
      testing.expectEqual(false, mark.checkVisibility());
      k.remove();
      testing.expectEqual(true, mark.checkVisibility());
      root.remove();
    }

    // :has(> div > x): the grandparent anchors, and reaches its later sibling
    {
      const root = make("<section class=h2><div></div></section><p class=h2m></p>");
      const anchor = root.firstChild;
      const mark = root.lastChild;
      testing.expectEqual(true, mark.checkVisibility());
      const k = document.createElement("i");
      k.className = "hk2";
      anchor.firstChild.appendChild(k);
      testing.expectEqual(false, mark.checkVisibility());
      root.remove();
    }

    sheet.remove();
  }
</script>

<script id="memo_frameless_document_attributes">
  {
    // A DOMParser document has no frame and no styles: its attribute
    // writes stay out of the page's cascade
    const doc = new DOMParser().parseFromString("<p></p><i hidden></i>", "text/html");
    const p = doc.querySelector("p");
    p.className = "x";
    p.classList.add("y");
    p.setAttribute("data-x", "1");
    doc.querySelector("i").removeAttribute("hidden");
    testing.expectEqual("x y", p.className);
  }
</script>

<script id="memo_tree_sibling_direction">
  {
    // A sibling match reads earlier siblings (+, ~, :first-child, :nth-child)
    // or later ones (:last-child, :nth-last-child, :last-of-type), so an
    // insertion or removal reaches the other side: the nearest element, or
    // all of them.
    const sheet = document.createElement("style");
    sheet.textContent = `
      .sd-n > :nth-last-child(3) { display: none }
      .sd-a ~ .sd-t { display: none }
      .sd-y > p:last-of-type { display: none }
    `;
    document.head.appendChild(sheet);
    const make = (html) => {
      const div = document.createElement("div");
      div.innerHTML = html;
      document.body.appendChild(div);
      return div.firstChild;
    };
    const el = (tag, cls) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      return e;
    };

    // :nth-last-child(3): every earlier element
    {
      const list = make("<div class=sd-n><i></i><i></i><i></i></div>");
      const first = list.firstChild;
      const second = first.nextSibling;
      testing.expectEqual(false, first.checkVisibility());
      list.appendChild(el("i"));
      testing.expectEqual(true, first.checkVisibility());
      testing.expectEqual(false, second.checkVisibility());
      list.parentNode.remove();
    }

    // ~: every later element, not only the next one
    {
      const list = make("<div><span></span><p class=sd-t></p><p class=sd-t></p></div>");
      const last = list.lastChild;
      testing.expectEqual(true, last.checkVisibility());
      list.insertBefore(el("b", "sd-a"), list.firstChild);
      testing.expectEqual(false, last.checkVisibility());
      list.firstChild.remove();
      testing.expectEqual(true, last.checkVisibility());
      list.parentNode.remove();
    }

    // :last-of-type: an earlier p, past an element of another type
    {
      const list = make("<div class=sd-y><p></p><span></span></div>");
      const p = list.firstChild;
      testing.expectEqual(false, p.checkVisibility());
      list.appendChild(el("p"));
      testing.expectEqual(true, p.checkVisibility());
      list.parentNode.remove();
    }

    sheet.remove();
  }
</script>

<script id="memo_tree_sibling_near">
  {
    // :last-child and :first-child read only the nearest element sibling, and
    // each `+` one more. One sheet per rule: a rule that reaches further
    // would cover the others.
    const make = (html) => {
      const div = document.createElement("div");
      div.innerHTML = html;
      document.body.appendChild(div);
      return div.firstChild;
    };
    const el = (tag) => document.createElement(tag);

    for (const [rule, check] of [
      // :last-child: the previous element, across a text node
      [".sd-l > :last-child { display: none }", () => {
        const list = make("<div class=sd-l><i></i><b></b></div>");
        const b = list.lastChild;
        testing.expectEqual(false, b.checkVisibility());
        list.appendChild(document.createTextNode("text is no sibling"));
        testing.expectEqual(false, b.checkVisibility());
        const c = list.appendChild(el("u"));
        testing.expectEqual(true, b.checkVisibility());
        testing.expectEqual(false, c.checkVisibility());
        c.remove();
        testing.expectEqual(false, b.checkVisibility());
        list.parentNode.remove();
      }],

      // :first-child: the next element
      [".sd-f > :first-child { display: none }", () => {
        const list = make("<div class=sd-f><i></i><b></b></div>");
        const i = list.firstChild;
        testing.expectEqual(false, i.checkVisibility());
        list.insertBefore(el("u"), i);
        testing.expectEqual(true, i.checkVisibility());
        list.firstChild.remove();
        testing.expectEqual(false, i.checkVisibility());
        list.parentNode.remove();
      }],

      // :only-child: both sides
      [".sd-o > :only-child { display: none }", () => {
        const list = make("<div class=sd-o><i></i></div>");
        const i = list.firstChild;
        testing.expectEqual(false, i.checkVisibility());
        const before = list.insertBefore(el("u"), i);
        testing.expectEqual(true, i.checkVisibility());
        before.remove();
        list.appendChild(el("u"));
        testing.expectEqual(true, i.checkVisibility());
        list.parentNode.remove();
      }],

      // + + : two elements after the gap, inserted or removed
      [".sd-c > i + b + u { display: none }", () => {
        const list = make("<div class=sd-c><i></i><b></b><u></u></div>");
        const u = list.lastChild;
        testing.expectEqual(false, u.checkVisibility());
        const span = list.insertBefore(el("span"), list.firstChild.nextSibling);
        testing.expectEqual(true, u.checkVisibility());
        span.remove();
        testing.expectEqual(false, u.checkVisibility());
        list.parentNode.remove();
      }],

      // :first-child + : the element after the next one
      [".sd-c > :first-child + b { display: none }", () => {
        const list = make("<div class=sd-c><i></i><b></b></div>");
        const b = list.lastChild;
        testing.expectEqual(false, b.checkVisibility());
        list.insertBefore(el("span"), list.firstChild);
        testing.expectEqual(true, b.checkVisibility());
        list.parentNode.remove();
      }],

      // the same, nested in :not()
      [".sd-c > :not(:first-child) + b { display: none }", () => {
        const list = make("<div class=sd-c><span></span><i></i><b></b></div>");
        const b = list.lastChild;
        testing.expectEqual(false, b.checkVisibility());
        list.firstChild.remove();
        testing.expectEqual(true, b.checkVisibility());
        list.parentNode.remove();
      }],
    ]) {
      const sheet = document.createElement("style");
      sheet.textContent = rule;
      document.head.appendChild(sheet);
      check();
      sheet.remove();
    }
  }
</script>

<script id="memo_style_attribute_writes">
  {
    // setAttribute('style') and cssText only drop what their changed
    // declarations reach
    const root = document.createElement("div");
    root.innerHTML = "<div><span></span></div><p></p>";
    document.body.appendChild(root);
    const div = root.firstChild;
    const span = div.firstChild;
    const p = root.lastChild;
    const hidden = (el) => el.checkVisibility({ visibilityProperty: true }) === false;
    testing.expectEqual(false, hidden(span));

    div.setAttribute("style", "color: red; --x: 1");
    testing.expectEqual(false, hidden(span));
    div.setAttribute("style", "color: red; visibility: hidden");
    testing.expectEqual(true, hidden(span));
    testing.expectEqual(false, hidden(p));
    div.style.cssText = "visibility: visible";
    testing.expectEqual(false, hidden(span));
    div.style.cssText = "display: none";
    testing.expectEqual(false, span.checkVisibility());
    div.setAttribute("style", "DISPLAY: none !important");
    testing.expectEqual(false, span.checkVisibility());
    div.removeAttribute("style");
    testing.expectEqual(true, span.checkVisibility());
    root.remove();

    // A shorthand and its longhand, reordered: the same declarations, but
    // the last one wins
    const box = document.createElement("div");
    document.body.appendChild(box);
    box.setAttribute("style", "margin: 0; margin-left: 50px");
    const narrow = box.getBoundingClientRect().width;
    box.setAttribute("style", "margin-left: 50px; margin: 0");
    testing.expectEqual(narrow + 50, box.getBoundingClientRect().width);
    box.remove();
  }
</script>
