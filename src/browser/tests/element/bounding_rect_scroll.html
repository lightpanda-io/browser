<!DOCTYPE html>
<script src="../testing.js"></script>
<!-- A tall body so the window can actually scroll. -->
<body style=height:4000px;width:4000px></body>

<script id="rect_is_viewport_relative">
{
  // getBoundingClientRect is viewport-relative (CSSOM-View): the rect must move
  // with the window scroll. The faux layout computes document positions that
  // never move, so this guards the scroll subtraction (CDP drivers rely on it:
  // Playwright times out with "element is outside of the viewport" otherwise).
  //
  // Precede the target with enough nodes that its document y is well below the
  // viewport. The faux layout advances 5px per node, so 200 nodes put it past
  // 1000px while the viewport stays above it. They are display:none so they
  // don't also push the target horizontally (horizontal position skips hidden
  // siblings), keeping the hit-test point near x=0.
  for (let i = 0; i < 200; i++) {
    const pad = document.createElement('div');
    pad.style.display = 'none';
    document.body.appendChild(pad);
  }
  const el = document.createElement('div');
  document.body.appendChild(el);

  const before = el.getBoundingClientRect();
  testing.expectTrue(before.y > 0);

  // Scroll so the element lands inside the viewport (100px from the top),
  // rather than off the top edge. Use the element's own document position so
  // the target offset does not depend on the node count above.
  const scroll = before.y - 100;
  window.scrollTo(0, scroll);
  const after = el.getBoundingClientRect();

  testing.expectEqual(before.y - scroll, after.y);
  testing.expectEqual(before.x, after.x);

  // The element is now inside the viewport, and the hit test takes a
  // viewport-relative point, so it must agree with the (also viewport-relative)
  // rect.
  testing.expectTrue(after.y >= 0);
  testing.expectTrue(after.y < window.innerHeight);
  testing.expectEqual(document.elementFromPoint(after.x + 1, after.y + 1), el);

  // Points outside the viewport must still return null now that we are
  // scrolled: the scroll offset must not translate an out-of-viewport point
  // onto a valid document position. (Before the scroll the offset is zero, so
  // this can only be checked while scrolled.)
  testing.expectEqual(null, document.elementFromPoint(after.x + 1, -1));
  testing.expectEqual(null, document.elementFromPoint(after.x + 1, window.innerHeight + 1));
  testing.expectEqual(null, document.elementFromPoint(-1, after.y + 1));
  testing.expectEqual(null, document.elementFromPoint(window.innerWidth + 1, after.y + 1));

  window.scrollTo(0, 0);
}
</script>

<script id="horizontal_scroll_into_view">
{
  // scrollIntoView moves both axes. Put enough visible siblings before the
  // target that its horizontal position (sum of preceding visible sibling
  // widths, 5px each) is well past the viewport, then bring it back with
  // scrollIntoView. Guards the x-axis branch that a y-only implementation
  // would leave at 0.
  for (let i = 0; i < 600; i++) {
    document.body.appendChild(document.createElement('div'));
  }
  const el = document.createElement('div');
  document.body.appendChild(el);

  const before = el.getBoundingClientRect();
  testing.expectTrue(before.x > window.innerWidth);
  testing.expectEqual(0, window.scrollX);

  el.scrollIntoView();
  const after = el.getBoundingClientRect();

  // The window scrolled horizontally to the element's document x, and the
  // viewport-relative rect moved with it. Everything before the target is
  // inline-ish (block boxes), so the document y is finite and shared.
  testing.expectEqual(before.x, window.scrollX);
  testing.expectEqual(0, after.x);
  testing.expectTrue(after.x < window.innerWidth);
}
</script>
