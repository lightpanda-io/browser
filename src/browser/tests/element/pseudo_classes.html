<!DOCTYPE html>
<script src="../testing.js"></script>

<div id="container">
    <p id="first">First</p>
    <input type="checkbox" id="checkbox">
    <span id="empty"></span>
    <span id="nonempty">Content</span>
</div>

<script id="parsing">
{
    const container = $('#container');

    // Test that all pseudo-classes parse without throwing errors
    const pseudoClasses = [
        ':modal', ':checked', ':disabled', ':enabled', ':indeterminate',
        ':valid', ':invalid', ':required', ':optional', ':in-range', ':out-of-range',
        ':placeholder-shown', ':read-only', ':read-write', ':default',
        ':hover', ':active', ':focus', ':focus-within', ':focus-visible',
        ':link', ':visited', ':any-link', ':target',
        ':root', ':empty', ':first-child', ':last-child', ':only-child',
        ':first-of-type', ':last-of-type', ':only-of-type',
        ':nth-child(2)', ':nth-last-child(2)', ':nth-of-type(2)', ':nth-last-of-type(2)',
        ':defined', ':not(div)', ':is(div, span)', ':where(p, a)', ':has(span)', ':lang(en)'
    ];

    // Each querySelector should not throw an error
    let allPassed = true;
    for (const pseudo of pseudoClasses) {
        try {
            container.querySelector(pseudo);
        } catch (e) {
            allPassed = false;
            break;
        }
    }
    testing.expectTrue(allPassed);
}
</script>

<script id="empty">
{
    const empty = document.querySelector(':empty');
    testing.expectTrue(empty !== null);
}
</script>

<script id="root">
{
    const html = document.querySelector(':root');
    testing.expectTrue(html !== null);
}
</script>

<script id="has">
{
    const result = document.querySelector(':has(span)');
    testing.expectTrue(result !== null);
}
</script>

<script id="not">
{
    const noDiv = document.querySelectorAll(':not(div)');
    testing.expectTrue(noDiv.length > 0);
}
</script>

<script id="is">
{
    const isResult = document.querySelectorAll(':is(p, span, input)');
    testing.expectTrue(isResult.length >= 4);
}
</script>

<script id="where">
{
    const whereResult = document.querySelectorAll(':where(p, span)');
    testing.expectTrue(whereResult.length >= 3);
}
</script>

<script id="is_empty">
{
    // Empty :is() and :where() are valid per spec and match nothing
    const isEmptyResult = document.querySelectorAll(':is()');
    testing.expectEqual(0, isEmptyResult.length);

    const whereEmptyResult = document.querySelectorAll(':where()');
    testing.expectEqual(0, whereEmptyResult.length);
}
</script>

<div id=escaped class=":popover-open"></div>
<script id="escaped">
{
    const escaped = document.querySelector('.\\:popover-open');
    testing.expectEqual('escaped', escaped.id);
}
</script>

<script id="lang">
{
    // No lang attribute anywhere: nothing has a language, so nothing matches.
    testing.expectEqual(0, document.querySelectorAll(':lang(en)').length);

    const outer = document.createElement('div');
    outer.innerHTML = '<p lang="en-AU"><span id="inherits"></span><span id="fr" lang="fr"></span><span id="unknown" lang=""></span></p><i id="none"></i>';
    const p = outer.querySelector('p');

    testing.expectTrue(p.matches(':lang(en)'));
    testing.expectTrue(p.matches(':lang(en-au)'));
    testing.expectFalse(p.matches(':lang(en-US)'));
    testing.expectFalse(p.matches(':lang(e)'));

    testing.expectTrue(outer.querySelector('#inherits').matches(':lang(en)'));

    // The nearest lang attribute wins, and an empty one means unknown.
    testing.expectFalse(outer.querySelector('#fr').matches(':lang(en)'));
    testing.expectTrue(outer.querySelector('#fr').matches(':lang(fr)'));
    testing.expectFalse(outer.querySelector('#unknown').matches(':lang(en)'));

    testing.expectFalse(outer.querySelector('#none').matches(':lang(en)'));
    testing.expectEqual(2, outer.querySelectorAll(':lang(en)').length);

    document.body.appendChild(outer);
    testing.expectEqual(2, document.querySelectorAll(':lang(en)').length);
    outer.remove();
}
</script>

<div id="rw">
    <input id="rw_text">
    <input id="rw_readonly" readonly>
    <input id="rw_disabled" disabled>
    <input id="rw_checkbox" type="checkbox">
    <input id="rw_number" type="number">
    <textarea id="rw_textarea"></textarea>
    <textarea id="rw_textarea_ro" readonly></textarea>
    <div id="rw_editable" contenteditable>
        <p id="rw_editable_child"><b id="rw_editable_grandchild"></b></p>
        <p id="rw_not_editable" contenteditable="false"><b id="rw_not_editable_child"></b></p>
    </div>
    <p id="rw_p"></p>
</div>
<script id="read_write">
{
    const ids = (sel) => Array.from(document.querySelectorAll('#rw ' + sel)).map((e) => e.id).join();
    testing.expectEqual('rw_text,rw_number,rw_textarea,rw_editable,rw_editable_child,rw_editable_grandchild', ids(':read-write'));
    testing.expectEqual('rw_readonly,rw_disabled,rw_checkbox,rw_textarea_ro,rw_not_editable,rw_not_editable_child,rw_p', ids(':read-only'));
}
</script>

<ul id="nth_list"><li>1</li><li>2</li><li>3</li></ul>
<script id="nth_whitespace">
{
    const texts = (sel) => Array.from(document.querySelectorAll(sel)).map((li) => li.textContent).join();
    testing.expectEqual('1,3', texts('#nth_list li:nth-child(odd )'));
    testing.expectEqual('1,3', texts('#nth_list li:nth-child( 2n+1 )'));
    testing.expectEqual('2', texts('#nth_list li:nth-child( 2 )'));
    testing.expectEqual('2', texts('#nth_list li:nth-last-child(even )'));
    testing.expectEqual('3', texts('#nth_list li:nth-of-type( 3 )'));
    testing.expectEqual('1', texts('#nth_list li:nth-last-of-type( 3 )'));
}
</script>

<div id="of_type_custom"><x-a>a1</x-a><x-b>b1</x-b><foo>f1</foo><x-b>b2</x-b><bar>r1</bar></div>
<div id="of_type_custom_many"></div>
<script id="of_type_custom">
{
    const texts = (sel) => Array.from(document.querySelectorAll(sel)).map((e) => e.textContent).join();
    testing.expectEqual('a1,b1,f1,r1', texts('#of_type_custom > :first-of-type'));
    testing.expectEqual('a1,f1,b2,r1', texts('#of_type_custom > :last-of-type'));
    testing.expectEqual('a1,f1,r1', texts('#of_type_custom > :only-of-type'));
    testing.expectEqual('b1', texts('#of_type_custom x-b:nth-of-type(1)'));
    testing.expectEqual('b2', texts('#of_type_custom x-b:nth-of-type(2)'));
    testing.expectEqual('b1', texts('#of_type_custom x-b:nth-last-of-type(2)'));
    testing.expectEqual('r1', texts('#of_type_custom bar:first-of-type'));

    // enough siblings to go through the cached ordinals
    const many = $('#of_type_custom_many');
    for (let i = 1; i <= 40; i++) {
        const el = document.createElement(i % 2 ? 'x-a' : 'x-b');
        el.textContent = i;
        many.appendChild(el);
    }
    testing.expectEqual('2', texts('#of_type_custom_many > x-b:nth-of-type(1)'));
    testing.expectEqual('6', texts('#of_type_custom_many > x-b:nth-of-type(3)'));
    testing.expectEqual('38', texts('#of_type_custom_many > x-b:nth-last-of-type(2)'));
    testing.expectEqual('1,2', texts('#of_type_custom_many > :first-of-type'));
    testing.expectEqual('39,40', texts('#of_type_custom_many > :last-of-type'));
}
</script>

<div id=checked1>
    <input type=checkbox name=cb0 value=cb0-1>
</div>

<div id=checked2>
    <input type=checkbox name=cb1 value=cb1-1>
    <input type=checkbox name=cb1 value=cb1-2 checked>
</div>

<div id=checked3>
    <select>
        <option value=sel1-1>
        <option value=sel1-2 selected>
    </select>
</div>

<div id=checked4>
    <select>
        <option value=sel2-1>
        <option value=sel2-2>
    </select>
</div>

<script id="checked">
{
    testing.expectEqual(null, $('#checked1').querySelector(':checked'));
    testing.expectEqual('cb1-2', $('#checked2').querySelector(':checked')?.value);

    {
        const s = $('#checked3 select');
        testing.expectEqual('sel1-2', s.querySelector(':checked')?.value);
        s.value = 'sel1-1'
        testing.expectEqual('sel1-1', s.querySelector(':checked')?.value);
        testing.expectEqual(true, s.options[0].matches(':checked'));
        testing.expectEqual(false, s.options[1].matches(':checked'));

        s.options[1].selected = true;
        testing.expectEqual('sel1-2', s.querySelector('option:checked')?.value);
    }

    testing.expectEqual('sel2-1', $('#checked4').querySelector(':checked')?.value);
}
</script>
