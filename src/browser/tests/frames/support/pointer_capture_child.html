<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; }
  #child_box {
    width: 80px;
    height: 80px;
    background: green;
  }
</style>
</head>
<body>
<div id="child_box"></div>
<script>
  window.childEvents = [];
  const b = document.getElementById('child_box');
  for (const t of ['pointerdown', 'gotpointercapture', 'lostpointercapture', 'pointermove', 'pointerup', 'pointercancel', 'click']) {
    b.addEventListener(t, (e) => {
      window.childEvents.push(t + '@' + e.target.id + ':' + Math.round(e.clientX) + ',' + Math.round(e.clientY));
      if (t === 'pointerdown') {
        b.setPointerCapture(e.pointerId);
      }
    });
  }
  document.addEventListener('lostpointercapture', (e) => {
    window.childEvents.push('lostpointercapture@document');
  });
</script>
</body>
</html>
