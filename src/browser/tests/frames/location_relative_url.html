<!DOCTYPE html>
<script src="../testing.js"></script>

<!-- The Location href setter, assign() and replace() parse the URL relative
     to the entry settings object: the calling script's document, not the
     document of the window being navigated.
     https://html.spec.whatwg.org/multipage/nav-history-apis.html#dom-location-href
     The frames start at support/nested/start.html, so "support/page.html"
     resolves to support/page.html from this document ("a-page") and to
     support/nested/support/page.html from theirs ("nested-page"). -->

<script>
  function loadFrame(name) {
    return new Promise((resolve) => {
      const frame = document.createElement('iframe');
      frame.name = name;
      frame.onload = () => {
        // Skip the load of the initial about:blank document.
        if (!frame.contentWindow.location.pathname.endsWith('/nested/start.html')) return;
        frame.onload = null;
        resolve(frame);
      };
      frame.src = 'support/nested/start.html';
      document.body.appendChild(frame);
    });
  }

  async function navigateFrame(name, navigate) {
    const frame = await loadFrame(name);
    const loaded = new Promise((resolve) => frame.onload = resolve);
    navigate(frame);
    await loaded;
    return frame.contentDocument.body.textContent.trim();
  }
</script>

<script id=href_setter type=module>
  const state = await testing.async();
  const text = await navigateFrame('href_frame', (frame) => {
    frame.contentWindow.location.href = 'support/page.html';
  });
  state.resolve();
  await state.done(() => {
    testing.expectEqual('a-page', text);
  });
</script>

<script id=window_location_setter type=module>
  const state = await testing.async();

  });
  state.resolve();
  await state.done(() => {
    testing.expectEqual('a-page', text);
  });
</script>

<script id=own_script type=module>
  // The frame's own script is the entry: its document's base applies.
  const state = await testing.async();
  const text = await navigateFrame('own_frame', (frame) => {
    const script = frame.contentDocument.createElement('script');
    script.textContent = "location.href = 'support/page.html'";
    frame.contentDocument.body.appendChild(script);
  });
  state.resolve();
  await state.done(() => {
    testing.expectEqual('nested-page', text);
  });
</script>
