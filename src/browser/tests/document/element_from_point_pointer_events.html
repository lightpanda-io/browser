<!DOCTYPE html>
<script src="../testing.js"></script>
<style>
  .dead { pointer-events: none; }
</style>

<body>
  <div id="plain">Plain</div>
  <div id="under">
    <span id="dead" class="dead">Dead</span>
  </div>
  <div id="wrap" style="pointer-events: none">
    <div id="inherits">Inherits</div>
    <div id="live" style="pointer-events: auto">Live</div>
  </div>
</body>

<script id="computed_pointer_events">
{
  const pe = (id) => getComputedStyle(document.getElementById(id)).pointerEvents;
  testing.expectEqual('auto', pe('plain'));
  testing.expectEqual('none', pe('dead'));
  testing.expectEqual('none', pe('wrap'));
  testing.expectEqual('none', pe('inherits'));
  testing.expectEqual('auto', pe('live'));
  testing.expectEqual('none', getComputedStyle(document.getElementById('wrap')).getPropertyValue('pointer-events'));
}
</script>

<script id="hit_skips_pointer_events_none">
{
  const center = (el) => {
    const r = el.getBoundingClientRect();
    return [(r.left + r.right) / 2, (r.top + r.bottom) / 2];
  };

  // The hit falls through to an element underneath: #under in a real
  // layout, possibly a further ancestor in ours.
  const dead = document.getElementById('dead');
  const hit = document.elementFromPoint(...center(dead));
  testing.expectTrue(hit !== dead && hit.contains(dead));
  testing.expectFalse(document.elementsFromPoint(...center(dead)).includes(dead));

  // A pointer-events:auto child of a pointer-events:none parent is hit, and
  // the parent is left out of the stack.
  const live = document.getElementById('live');
  testing.expectEqual(live, document.elementFromPoint(...center(live)));
  const stack = document.elementsFromPoint(...center(live));
  testing.expectEqual(live, stack[0]);
  testing.expectFalse(stack.includes(document.getElementById('wrap')));
  testing.expectEqual(document.documentElement, stack[stack.length - 1]);
}
</script>
