<!DOCTYPE html>
<script src="../testing.js"></script>

<iframe id=loaded src="about:blank"></iframe>

<script id=open_close_fires_load_events type=module>
  {
    const state = await testing.async();

    const cw = $('#loaded').contentWindow;
    const doc = cw.document;
    const events = [];

    // registered before open(): erased by it
    cw.addEventListener('load', () => events.push('old window load'));
    cw.onload = () => events.push('old window onload');
    doc.addEventListener('DOMContentLoaded', () => events.push('old dcl'));
    doc.onreadystatechange = () => events.push('old readystatechange');

    // descendants, shadow trees included, lose theirs; detached nodes don't
    const child = doc.body.appendChild(doc.createElement('div'));
    child.addEventListener('ping', () => events.push('old child'));
    const shadowChild = child.attachShadow({ mode: 'open' }).appendChild(doc.createElement('span'));
    shadowChild.addEventListener('ping', () => events.push('old shadow child'));
    const detached = doc.createElement('div');
    detached.addEventListener('ping', () => events.push('detached'));

    // after parsing, so open() clears the document
    setTimeout(() => {
      doc.open();
      testing.expectEqual('loading', doc.readyState);

      child.dispatchEvent(new cw.Event('ping'));
      shadowChild.dispatchEvent(new cw.Event('ping'));
      detached.dispatchEvent(new cw.Event('ping'));

      doc.addEventListener('readystatechange', () => events.push('readystatechange ' + doc.readyState));
      doc.addEventListener('DOMContentLoaded', () => events.push('dcl'));
      // the events are queued by close(): wait for the last one
      cw.addEventListener('load', () => {
        events.push('window load');
        state.resolve();
      });

      doc.write('<p id=written>hello</p>');
      doc.close();
    }, 5);

    await state.done(() => {
      testing.expectEqual('hello', doc.getElementById('written').textContent);
      testing.expectEqual('complete', doc.readyState);
      testing.expectEqual([
        'detached',
        'readystatechange interactive',
        'dcl',
        'readystatechange complete',
        'window load',
      ], events);
    });
  }
</script>

<script id=open_close_on_fresh_iframe type=module>
  {
    const state = await testing.async();

    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    const cw = iframe.contentWindow;
    const doc = cw.document;
    const events = [];

    doc.open();
    doc.addEventListener('DOMContentLoaded', () => events.push('dcl'));
    cw.addEventListener('load', () => {
      events.push('window load');
      state.resolve();
    });
    doc.write('<p id=written>fresh</p>');
    doc.close();

    await state.done(() => {
      testing.expectEqual('fresh', doc.getElementById('written').textContent);
      testing.expectEqual(['dcl', 'window load'], events);
    });
  }
</script>

<script id=close_from_load_handler type=module>
  {
    const state = await testing.async();

    // Each window load opens, writes + closes again: the next load must be
    // queued, not fired from within close() (which recursed, and crashed on
    // the write).
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    const cw = iframe.contentWindow;
    let depth = 0;
    let max_depth = 0;
    let count = 0;

    const rewrite = () => {
      const doc = cw.document;
      doc.open();
      // open() erased the window's listeners
      cw.addEventListener('load', onload);
      doc.write('<b id=n>' + count + '</b>');
      doc.close();
    };
    const onload = () => {
      depth += 1;
      max_depth = Math.max(max_depth, depth);
      count += 1;
      if (count < 3) {
        rewrite();
      } else {
        state.resolve();
      }
      depth -= 1;
    };
    setTimeout(rewrite, 5);

    await state.done(() => {
      testing.expectEqual(1, max_depth);
      testing.expectEqual(3, count);
      testing.expectEqual('2', cw.document.getElementById('n').textContent);
    });
  }
</script>

<!--
  https://html.spec.whatwg.org/multipage/iframe-embed-object.html#iframe-load-event-steps
  open() from within the iframe element's load event mutes its later ones.
-->
<script id=open_during_iframe_load_mutes type=module>
  {
    const state = await testing.async();

    const iframe = document.createElement('iframe');
    let loads = 0;
    let window_loads = 0;
    iframe.addEventListener('load', () => {
      loads += 1;
      if (loads > 1) return;
      const doc = iframe.contentDocument;
      doc.open();
      iframe.contentWindow.addEventListener('load', () => {
        window_loads += 1;
        // a (wrongly) unmuted element load fires right after this one
        setTimeout(() => state.resolve(), 0);
      });
      doc.write('<p>muted</p>');
      doc.close();
    });
    document.body.appendChild(iframe);

    await state.done(() => {
      testing.expectEqual(1, loads);
      testing.expectEqual(1, window_loads);
    });
  }
</script>
