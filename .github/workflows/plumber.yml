name: plumber

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plumber:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets Plumber read the workflow states and one run log to prove
      # the token scope.
      actions: read
      security-events: write
      # Lets the run publish the score for the README badge via OIDC,
      # no secret involved.
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: getplumber/plumber@e9ad2dc6d6faa2dfd84395aac18e461284062640 # v0.7.16
        with:
          # Code scanning upload needs security-events write, which PRs
          # from forks do not get. The report stays available as a
          # workflow artifact there.
          upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}
          # Feeds the score badge in the README. The badge service only
          # keeps the default branch score (verified from the OIDC
          # token), and a failed push never fails the run.
          score-push: true
          # Gate at 85 points instead of the all-or-nothing default,
          # leaves room for a small finding without blocking PRs.
          min-points: 85
