name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    # No "closed": on that event the action only locks the PR and reports a
    # passing CLAAssistant check. Locking is done in cla-lock.yml.
    types: [opened,reopened,synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_GH_PAT }}
        with:
          path-to-signatures: 'signatures/browser/version1/cla.json'
          path-to-document: 'https://github.com/lightpanda-io/browser/blob/main/CLA.md'
          # branch should not be protected
          branch: 'main'
          allowlist: krichprollsch,francisbouvier,katie-lpd,sjorsdonkers,bornlex

          remote-organization-name: lightpanda-io
          remote-repository-name: cla
          lock-pullrequest-aftermerge: false
