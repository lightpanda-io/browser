name: nix-deps

# Checks the flake, then regenerates nix/v8-deps.nix (hashes for the
# prebuilt V8 archives pinned in .github/actions/install/action.yml) and
# opens a pull request with the result, every night or on demand from the
# Actions tab.
#
# Mirrors orderfile.yml's regen-and-PR pattern. See orderfile.yml for the
# token/permission rationale.

on:
  schedule:
    - cron: "5 0 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flake-check:
    name: nix flake check

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check

  v8-deps:
    name: regenerate v8 deps

    needs: flake-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate token for browser
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: lightpanda-io
          repositories: browser

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: DeterminateSystems/nix-installer-action@main

      - name: regenerate nix/v8-deps.nix
        run: nix run .#generate-v8-deps

      - name: open a pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: v8-deps-regen
        run: |
          if git diff --quiet -- nix/v8-deps.nix; then
            echo "v8 deps unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/v8-deps.nix
          git commit -m "nix: regenerate v8-deps.nix"
          # One fixed branch, force-pushed: a re-run refreshes the open PR
          # instead of stacking a second one.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
            echo "refreshed the open pull request"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "nix: regenerate v8-deps.nix" \
            --body "Picks up the prebuilt V8 archive hashes for the versions pinned in .github/actions/install/action.yml."
